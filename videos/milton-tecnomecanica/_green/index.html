<!doctype html>
<html lang="es" data-mode="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Profe Milton — revisión técnico-mecánica</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      /* Profe Milton palette */
      :root {
        --ink: #0b1428;
        --yellow: #ffd400;
        --orange: #ff7a2f;
        --red: #e5484d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #zoom {
        display: none;
      }
      #zoom {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- captions: cápsula hierarchy in Milton colours ---------- */
      .cg {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1470px;
        text-align: center;
        visibility: hidden;
        perspective: 900px;
      }
      .who {
        display: inline-block;
        height: 46px;
        padding: 0 20px;
        border-radius: 23px;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 0.14em;
        line-height: 46px;
        margin-bottom: 10px;
      }
      .who.A {
        background: var(--orange);
        color: #fff;
      }
      .who.M {
        background: var(--yellow);
        color: var(--ink);
      }
      .cg .sm {
        font-weight: 800;
        font-size: 50px;
        line-height: 1.1;
        color: #fff;
        -webkit-text-stroke: 9px var(--ink);
        paint-order: stroke fill;
      }
      .cg .sm span {
        display: inline-block;
        margin: 0 7px;
      }
      .cg .bg {
        display: inline-block;
        margin-top: 12px;
        font-weight: 900;
        font-size: 124px;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: #fff;
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
        transform-origin: 50% 70%;
      }
      .cg .bg.hot {
        color: var(--yellow);
      }
      .cg .bg .c {
        display: inline-block;
      }
      .cg .tn {
        margin-top: 4px;
        font-weight: 800;
        font-size: 38px;
        color: #fff;
        -webkit-text-stroke: 7px var(--ink);
        paint-order: stroke fill;
      }

      /* ---------- stickers ---------- */
      .stk {
        position: absolute;
        visibility: hidden;
      }
      .tog {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 96px;
        padding: 0 28px 0 18px;
        border-radius: 48px;
        background: var(--ink);
        color: #fff;
        font-weight: 900;
        font-size: 38px;
        white-space: nowrap;
        box-shadow: 0 10px 0 rgba(11, 20, 40, 0.35);
      }
      .flag {
        width: 84px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 3px solid #fff;
      }
      .sw {
        position: relative;
        width: 96px;
        height: 52px;
        border-radius: 26px;
        background: #3a4560;
      }
      .sw i {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
      }
      .stamp {
        padding: 14px 40px;
        border: 12px solid var(--red);
        border-radius: 22px;
        color: var(--red);
        font-weight: 900;
        font-size: 104px;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.86);
        white-space: nowrap;
      }
      .burst {
        display: grid;
        place-items: center;
        width: 330px;
        height: 330px;
        color: var(--ink);
        font-weight: 900;
        font-size: 64px;
        text-align: center;
        line-height: 0.95;
        background: var(--yellow);
        clip-path: polygon(50% 0%, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 86% 52%, 100% 68%, 79% 72%, 82% 94%, 61% 84%, 50% 100%, 39% 84%, 18% 94%, 21% 72%, 0% 68%, 14% 52%, 0% 36%, 20% 30%, 18% 8%, 39% 18%);
      }
      .pill {
        height: 76px;
        padding: 0 32px;
        border-radius: 38px;
        font-weight: 900;
        font-size: 36px;
        letter-spacing: 0.1em;
        line-height: 76px;
        white-space: nowrap;
      }
      .ov {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: screen;
      }
      html[data-mode="green"] .ov {
        display: none;
      }
      #rw {
        position: absolute;
        inset: 0;
        visibility: hidden;
        background: transparent;
      }
      #rw-t {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        text-align: center;
        font-weight: 900;
        font-size: 92px;
        white-space: nowrap;
        color: #fff;
        letter-spacing: -0.02em;
        -webkit-text-stroke: 12px #0b1428;
        paint-order: stroke fill;
      }
      #rw-s {
        position: absolute;
        left: 0;
        right: 0;
        top: 970px;
        text-align: center;
        font-weight: 800;
        font-size: 44px;
        color: var(--yellow);
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="78.04" data-width="1080" data-height="1920">
      <div id="zoom">
        <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="78.04" data-track-index="0" muted playsinline></video>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="78.04" data-track-index="1">
        <!-- rewind: "1 minuto antes" -->
        <div id="rw"><div id="rw-t">◀◀ 1 MINUTO ANTES</div><div id="rw-s">REBOBINANDO</div></div>

        <!-- motorcycle plate: blurred patch that follows the plate (68.2 – 71.5) -->
        <div id="plate" style="position: absolute; inset: 0; opacity: 0; clip-path: inset(1920px 0px 0px 1080px)">
          <video id="plv" src="assets/footage.mp4" data-start="0" data-duration="78.04" data-track-index="2" muted playsinline style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(22px)"></video>
        </div>

        <div id="caps"></div>
        <!-- film-burn / light-leak overlays (screen blend) -->
        <video id="ov1" class="ov" src="assets/fx/ov1.mp4" data-start="4.3" data-duration="1.16" data-track-index="3" muted playsinline></video>
      </div>

      <!-- a few SFX only -->
      <audio id="sx01" src="assets/fx/ov1.wav" data-start="4.3" data-duration="1.17" data-track-index="20" data-volume="0.45"></audio>
      <audio id="sx02" src="assets/sfx/rewind.wav" data-start="4.45" data-duration="0.9" data-track-index="21" data-volume="0.35"></audio>
      <audio id="sx03" src="assets/sfx/dundun.wav" data-start="18.5" data-duration="2.04" data-track-index="22" data-volume="0.3"></audio>
      <audio id="sx04" src="assets/sfx/scratch.wav" data-start="27.3" data-duration="0.5" data-track-index="23" data-volume="0.4"></audio>
      <audio id="sx05" src="assets/sfx/error.wav" data-start="29.68" data-duration="0.9" data-track-index="24" data-volume="0.22"></audio>
      <audio id="sx06" src="assets/sfx/ding.wav" data-start="33.94" data-duration="1.2" data-track-index="25" data-volume="0.22"></audio>
      <audio id="sx07" src="assets/sfx/stamp.wav" data-start="51.9" data-duration="0.35" data-track-index="26" data-volume="0.5"></audio>
      <audio id="sx08" src="assets/sfx/kaching.wav" data-start="52.0" data-duration="1.59" data-track-index="27" data-volume="0.25"></audio>
      <audio id="sx09" src="assets/sfx/boing.wav" data-start="56.1" data-duration="0.7" data-track-index="28" data-volume="0.3"></audio>
      <audio id="sx10" src="assets/sfx/whoosh.wav" data-start="59.5" data-duration="0.57" data-track-index="29" data-volume="0.3"></audio>
      <audio id="sx11" src="assets/sfx/ding.wav" data-start="76.48" data-duration="1.2" data-track-index="25" data-volume="0.25"></audio>
    </div>

    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

        // ---------- captions: [who, start, end, lead [[w,t]], big [word,t,hot?] | null, tail [text,t] | null, anim] ----------
        const G = [
          ["M", 0.1, 1.9, [["tiene", 0.14], ["todo", 0.34], ["al", 0.5]], ["día", 0.62], null, "pop"],
          ["M", 1.9, 4.4, [["pero", 0.82], ["me", 0.98], ["toca", 1.28], ["hacerle", 1.52], ["una", 1.68], ["orden", 1.94], ["de", 2.08]], ["comparendo", 2.3, 1], ["por revisión técnico-mecánica", 3.04], "flip"],
          ["M", 4.58, 7.08, [["caballero,", 4.6], ["me", 4.86], ["permite", 5.04], ["los", 5.28]], ["documentos", 5.54], ["del vehículo, ¿si es tan amable?", 5.82], "slide"],
          ["A", 7.1, 10.8, [["buenos", 7.12], ["días,", 7.34], ["señor", 7.62], ["agente,", 7.86], ["aquí", 8.38], ["están", 8.54], ["los", 8.74]], ["documentos", 9.06], null, "pop"],
          ["A", 10.82, 12.8, [["¿y", 10.84], ["por", 11.04], ["qué", 11.14], ["me", 11.28], ["está", 11.4]], ["parando?", 11.64], ["¿y ahora qué pasó?", 12.04], "bounce"],
          ["A", 12.82, 15.6, [["yo", 12.82], ["tengo", 13.06], ["todo", 13.28]], ["al día", 13.5, 1], ["SOAT, todo", 14.08], "type"],
          ["A", 15.62, 18.0, [["hasta", 15.66], ["el", 15.92]], ["pico y placa", 16.06], ["estoy bien, ¿qué pasó ahora?", 16.66], "slide"],
          ["M", 18.02, 20.5, [["sí,", 18.02], ["hermano,", 18.2], ["tiene", 18.5], ["todo", 18.7], ["al", 18.86], ["día,", 18.98], ["pero", 19.2]], ["me toca", 19.5], null, "flip"],
          ["M", 20.52, 22.78, [["hacerle", 19.88], ["una", 20.04], ["orden", 20.3], ["de", 20.44]], ["comparendo", 20.68, 1], ["por revisión técnico-mecánica", 21.0], "pop"],
          ["A", 22.8, 26.14, [["no,", 22.8], ["ahí", 23.04], ["está", 23.22]], ["vigente", 23.38], ["la revisión técnico-mecánica, me disculpe", 24.46], "bounce"],
          ["M", 26.16, 28.02, [["sí", 26.16], ["está", 26.36], ["vigente,", 26.52], ["pero", 26.88], ["mire", 27.02], ["el", 27.16]], ["espejito", 27.3], ["papá", 27.74], "pop"],
          ["A", 28.04, 29.2, [["veo", 28.04], ["muy", 28.26], ["bien", 28.42], ["por", 28.58], ["el", 28.66]], ["espejo", 28.84], null, "slide"],
          ["M", 29.22, 31.32, [["pero", 29.22], ["está", 29.44]], ["quebrado", 29.68, 1], ["caballero, mira, está quebrado", 30.22], "flip"],
          ["A", 31.34, 33.22, [["pero", 31.34], ["tengo", 31.58], ["la", 31.7]], ["técnico-mecánica", 31.86], ["mi muchacho", 32.74], "type"],
          ["M", 33.24, 36.0, [["pero", 33.24], ["es", 33.38], ["que", 33.46], ["la", 33.64]], ["norma dice", 33.94], ["que independientemente", 34.48], "pop"],
          ["M", 36.02, 39.34, [["de", 36.06], ["que", 36.16], ["usted", 36.34], ["tenga", 36.66], ["la", 36.8]], ["técnico-mecánica", 37.04], ["al orden del día", 38.36], "slide"],
          ["M", 39.36, 43.9, [["si", 39.38], ["uno", 39.58], ["de", 39.72], ["los", 39.86], ["elementos", 40.4], ["que", 40.84], ["se", 40.92], ["inspeccionan", 41.04]], ["está defectuoso", 42.84, 1], null, "flip"],
          ["M", 43.92, 46.6, [["tengo", 44.1], ["que", 44.22], ["hacerle", 44.44]], ["comparendo", 44.78], ["por revisión técnico-mecánica", 45.26], "pop"],
          ["M", 46.8, 50.5, [["cuando", 46.8], ["usted", 47.06], ["lleva", 47.26], ["el", 47.38], ["vehículo", 47.56], ["a", 48.22], ["la", 48.3], ["revisión,", 48.5], ["le", 49.52], ["inspeccionan", 49.64], ["el", 50.06]], ["espejo", 50.22], null, "bounce"],
          ["A", 50.6, 51.1, [], ["sí, señor", 50.66], null, "pop"],
          ["M", 51.12, 53.4, [["entonces", 51.12], ["tengo", 51.36], ["que", 51.42], ["hacerle", 51.54]], ["comparendo", 51.9, 1], null, "pop"],
          ["M", 53.42, 55.88, [["¿listo?", 53.4], ["para", 54.08], ["que", 54.2], ["tenga", 54.32], ["presente.", 54.52], ["le", 54.82], ["voy", 54.92], ["a", 54.94], ["revisar", 55.1], ["la", 55.3]], ["llantica", 55.38], null, "type"],
          ["A", 55.9, 58.6, [["no,", 55.9], ["no,", 56.06], ["no,", 56.24], ["es", 56.68], ["acá", 56.86], ["en", 56.94], ["el", 57.02]], ["espejo", 57.2], ["mi hermano, ahí está bien, vea", 57.48], "bounce"],
          ["M", 58.62, 61.2, [["ah,", 58.62], ["con", 58.92], ["el", 59.04], ["espejo.", 59.18]], ["mis muchachos", 59.58], ["y recuerden", 60.6], "slide"],
          ["M", 61.22, 64.46, [["que", 61.28], ["si", 61.42], ["usted", 61.6], ["tiene", 61.92], ["la", 62.06]], ["técnico-mecánica", 62.26], ["al orden del día", 63.36], "flip"],
          ["M", 64.48, 65.84, [["si", 64.48], ["tiene", 64.64], ["un", 64.74], ["espejo", 64.94]], ["quebrado", 65.28, 1], null, "pop"],
          ["M", 65.86, 67.1, [["no", 65.86], ["tiene", 66.12]], ["direccionales", 66.32], null, "slide"],
          ["M", 67.12, 68.18, [["no", 67.12], ["tiene", 67.38]], ["stop", 67.76], null, "pop"],
          ["M", 68.2, 70.3, [["de", 68.2], ["hecho", 68.36], ["la", 68.54]], ["carcasa", 68.82], ["está quebrada", 69.4], "bounce"],
          ["M", 70.32, 71.8, [["o", 70.32], ["las", 70.46], ["llantas", 70.64], ["están", 71.06]], ["lisas", 71.22], null, "pop"],
          ["M", 71.82, 75.6, [["le", 71.84], ["van", 72.04], ["a", 72.18], ["realizar", 72.52], ["una", 72.76], ["orden", 72.96], ["de", 73.12]], ["comparendo", 73.32, 1], ["por revisión técnico-mecánica", 73.72], "flip"],
          ["M", 75.62, 78.04, [["acuérdese:", 75.62]], ["inspección preventiva", 76.48], ["del vehículo", 77.34], "type"],
        ];
        const caps = $("#caps");
        G.forEach(([who, a, b, lead, big, tail, anim]) => {
          const g = document.createElement("div");
          g.className = "cg " + who;
          const sm = document.createElement("div");
          sm.className = "sm";
          const leadEls = lead.map(([w, t]) => {
            const s = document.createElement("span");
            s.textContent = w;
            sm.appendChild(s);
            return [s, t];
          });
          g.appendChild(sm);
          let bg = null;
          let tn = null;
          if (big) {
            bg = document.createElement("div");
            bg.className = "bg" + (big[2] ? " hot" : "");
            // long keywords shrink so they always fit on one line
            if (big[0].length > 11) bg.style.fontSize = Math.round(Math.min(124, 1500 / big[0].length)) + "px";
            if (anim === "type") {
              [...big[0]].forEach((ch) => {
                const c = document.createElement("span");
                c.className = "c";
                c.textContent = ch === " " ? " " : ch;
                bg.appendChild(c);
              });
            } else bg.textContent = big[0];
            g.appendChild(bg);
          }
          if (tail) {
            tn = document.createElement("div");
            tn.className = "tn";
            tn.textContent = tail[0];
            g.appendChild(tn);
          }
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          leadEls.forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, Math.max(a, t)));
          if (bg) {
            const t = Math.max(a, big[1]);
            if (anim === "pop") tl.fromTo(bg, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.8)" }, t);
            else if (anim === "flip") tl.fromTo(bg, { rotationX: -95, opacity: 0, y: 20 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t);
            else if (anim === "slide") tl.fromTo(bg, { yPercent: 70, clipPath: "inset(0 -5% 100% -5%)" }, { yPercent: 0, clipPath: "inset(-15% -5% -15% -5%)", duration: 0.45, ease: "expo.out" }, t);
            else if (anim === "bounce") tl.fromTo(bg, { y: -200, scale: 1.3, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, t);
            else if (anim === "type") tl.fromTo(bg.querySelectorAll(".c"), { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.035 }, t);
            tl.to(bg, { scale: 1.04, duration: Math.max(0.2, b - t - 0.6), ease: "none" }, t + 0.5);
          }
          if (tn) tl.fromTo(tn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, tail[1]);
          if (b < 89.7) tl.set(g, { visibility: "hidden" }, b);
        });

        // ---------- camera: comedic punch-ins on the reactions ----------
        // [t, scale, origin, hold]
        const P = [
          [18.02, 1.15, "50% 30%", 1.6], [29.22, 1.2, "50% 30%", 2.0], [51.12, 1.15, "50% 30%", 2.2], [55.9, 1.15, "50% 30%", 2.6],
        ];
        P.forEach(([t, s, o, hold]) => {
          tl.set("#zoom", { transformOrigin: o }, t)
            .fromTo("#zoom", { scale: 1 }, { scale: s, duration: 0.18, ease: "power4.out" }, t)
            .to("#zoom", { scale: s + 0.04, duration: hold - 0.4, ease: "none" }, t + 0.18)
            .to("#zoom", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + hold - 0.2);
        });
        // shakes on the punchlines
        [[29.68, 0.35], [51.9, 0.35]].forEach(([t, d]) => {
          tl.to("#zoom", { x: 12, duration: 0.04, ease: "none", yoyo: true, repeat: Math.round(d / 0.04) }, t);
          tl.set("#zoom", { x: 0 }, t + d + 0.05);
        });

        const show = (id, a, b) => {
          tl.set(id, { visibility: "visible" }, a);
          tl.set(id, { visibility: "hidden" }, b);
        };
        const pop = (sel, t, from = { scale: 0 }, d = 0.45, ease = "back.out(2.6)") =>
          tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: d, ease }, t);
        const slam = (sel, t, rot = -8) => {
          tl.fromTo(sel, { scale: 3, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo(sel, { y: 0 }, { y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.25);
        };

        // ===== rewind (4.45 – 5.0) =====
        show("#rw", 4.45, 5.0);
        tl.fromTo("#rw-t", { x: 60 }, { x: -60, duration: 0.55, ease: "none" }, 4.45);
        
        // ===== plate blur (68.2 – 71.5) =====
        const box = (x0, y0, x1, y1) => "inset(" + Math.max(0, y0 - 40) + "px " + Math.max(0, 1080 - x1 - 40) + "px " + Math.max(0, 1920 - y1 - 40) + "px " + Math.max(0, x0 - 40) + "px round 18px)";
        const PK = [
          [68.15, 700, 1680, 1080, 1920], [69.0, 700, 1660, 1080, 1920], [69.2, 740, 1640, 1080, 1880], [69.6, 760, 1600, 1080, 1850],
          [70.0, 800, 1610, 1080, 1870], [70.4, 860, 1590, 1080, 1820], [70.8, 880, 1600, 1080, 1850], [71.2, 920, 1700, 1080, 1920],
          [71.5, 960, 1760, 1080, 1920],
        ];
        tl.set("#plate", { opacity: 1, clipPath: box(...PK[0].slice(1)) }, 68.15);
        PK.slice(1).forEach((k, i) => tl.to("#plate", { clipPath: box(...k.slice(1)), duration: k[0] - PK[i][0], ease: "none" }, PK[i][0]));
        tl.set("#plate", { opacity: 0, clipPath: "inset(1920px 0px 0px 1080px)" }, 71.6);

        tl.set({}, {}, 78.04);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
