<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Colpensiones parte 3 — reel editado</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      :root {
        --white: #ffffff;
        --blue: #1f4fff;
        --navy: #0b1f66;
        --sky: #7d9bff;
        --mist: #e3eaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 53% 27%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #leak {
        position: absolute;
        right: -360px;
        top: -360px;
        width: 1100px;
        height: 1100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 248, 235, 0.22) 38%, rgba(255, 255, 255, 0) 70%);
      }

      /* ---------- captions (series system) ---------- */
      .cap {
        position: absolute;
        left: 70px;
        right: 70px;
        display: flex;
        justify-content: center;
      }
      .inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 16px;
        text-align: center;
      }
      .inner.pill {
        background: rgba(11, 31, 102, 0.9);
        border-radius: 30px;
        padding: 12px 36px 18px;
        box-shadow: 0 18px 40px rgba(11, 31, 102, 0.35);
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
        font-size: 62px;
        line-height: 1.28;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(11, 31, 102, 0.8), 0 0 26px rgba(11, 31, 102, 0.65), 0 0 60px rgba(11, 31, 102, 0.35);
        white-space: nowrap;
      }
      .inner.pill .cw {
        text-shadow: none;
      }
      .cap.dark .cw {
        color: var(--navy);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.85);
      }
      .cw.kw {
        font-weight: 700;
        font-style: italic;
      }
      .cw .ul {
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 4px;
        height: 6px;
        border-radius: 3px;
        background: currentColor;
      }
      .cw.hero {
        flex-basis: 100%;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.02em;
        line-height: 1.02;
      }

      /* ---------- profile overlay ---------- */
      #prof {
        position: absolute;
        left: 250px;
        top: 150px;
        width: 580px;
        height: 210px;
        border-radius: 34px;
        background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%);
      }
      #prof .av {
        position: absolute;
        left: 30px;
        top: 45px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--mist);
        overflow: hidden;
      }
      #prof .av::before {
        content: "";
        position: absolute;
        left: 38px;
        top: 22px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--blue);
      }
      #prof .av::after {
        content: "";
        position: absolute;
        left: 18px;
        top: 74px;
        width: 84px;
        height: 70px;
        border-radius: 42px 42px 0 0;
        background: var(--blue);
      }
      #av-ring {
        position: absolute;
        left: 20px;
        top: 35px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 6px solid var(--blue);
      }
      .bar {
        position: absolute;
        left: 180px;
        height: 18px;
        border-radius: 9px;
      }
      #btn {
        position: absolute;
        left: 180px;
        top: 118px;
        width: 250px;
        height: 64px;
        border-radius: 32px;
        background: var(--blue);
        display: grid;
        place-items: center;
      }
      #btn svg {
        width: 44px;
        height: 44px;
      }
      #btn-rip {
        position: absolute;
        left: 180px;
        top: 118px;
        width: 250px;
        height: 64px;
        border-radius: 32px;
        border: 5px solid var(--blue);
      }
      .cursor {
        position: absolute;
        width: 90px;
        height: 110px;
        overflow: visible;
      }

      /* ---------- cutaways (house style) ---------- */
      .cut {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f8f9fd 55%, #e8edf8 100%);
        overflow: hidden;
      }
      .barcode {
        position: absolute;
        left: 450px;
        top: 130px;
        width: 180px;
        height: 54px;
      }
      .grid {
        position: absolute;
        background-image: linear-gradient(to right, rgba(31, 79, 255, 0.16) 2px, transparent 2px),
          linear-gradient(to bottom, rgba(31, 79, 255, 0.16) 2px, transparent 2px);
        background-size: 56px 56px;
      }
      .shadow {
        filter: drop-shadow(0 30px 34px rgba(11, 31, 102, 0.24)) drop-shadow(0 5px 8px rgba(11, 31, 102, 0.12));
      }
      .layer {
        position: absolute;
        left: 110px;
        right: 110px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .line {
        display: block;
        overflow: hidden;
        padding: 0 10px;
        margin: 0 -10px;
      }
      .disp {
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        line-height: 1.12;
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
      }
      .sans {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 72px;
        line-height: 1.25;
        white-space: nowrap;
        color: var(--navy);
      }
      .rw {
        display: inline-block;
        margin-right: 0.24em;
      }
      .tile {
        position: absolute;
        top: 1010px;
        width: 250px;
        height: 280px;
        border-radius: 34px;
        background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%);
        display: grid;
        place-items: center;
      }
      .tile svg {
        width: 160px;
        height: 160px;
      }
      .tile .hl {
        position: absolute;
        inset: -10px;
        border-radius: 42px;
        border: 8px solid var(--blue);
      }
      #wa {
        position: absolute;
        left: 170px;
        top: 1200px;
        width: 740px;
        height: 180px;
        border-radius: 90px;
        background: linear-gradient(180deg, #3a68ff 0%, #1f4fff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      #wa svg {
        width: 104px;
        height: 104px;
      }
      #wa span {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-style: italic;
        font-size: 88px;
        color: #fff;
      }
      #wa-rip {
        position: absolute;
        left: 170px;
        top: 1200px;
        width: 740px;
        height: 180px;
        border-radius: 90px;
        border: 8px solid var(--blue);
      }
      #wash {
        position: absolute;
        inset: 0;
        background: #ffffff;
      }
    </style>

          ["semanas", 1.92, 2.28], ["cotizadas,", 2.28, 2.82],
          ["quienes", 3.02, 3.42], ["mantienen", 3.42, 3.98], ["las", 3.98, 4.44], ["condiciones", 4.44, 4.9], ["del", 4.9, 5.2], ["esquema", 5.2, 5.66], ["anterior.", 5.66, 5.86],
          ["Si", 5.94, 6.24], ["quieres", 6.24, 6.66], ["conocer", 6.66, 7.08], ["el", 7.08, 7.42], ["estado", 7.42, 7.64], ["de", 7.64, 7.72], ["tu", 7.72, 8.0],
          ["historia", 8.0, 8.26], ["laboral", 8.26, 8.8], ["y", 8.8, 9.28], ["entender", 9.28, 9.72], ["en", 9.72, 9.94], ["qué", 9.94, 10.2], ["grupo", 10.2, 10.6], ["estás,", 10.6, 11.02],
          ["visita", 11.2, 11.58], ["el", 11.58, 11.68], ["enlace", 11.68, 12.26], ["en", 12.26, 12.46], ["nuestro", 12.46, 12.92], ["perfil", 12.92, 13.3], ["y", 13.3, 13.5],
          ["solicita", 13.5, 14.38], ["atención", 14.38, 14.74], ["personalizada", 14.74, 15.42], ["vía", 15.42, 15.86], ["WhatsApp.", 15.86, 16.04],
        ];
        const CAPS = [
          [0, 7, 1110, "pill", [1, 6, 7], { 5: 176 }],
          [8, 10, 1370, "", [9]],
          [11, 14, 170, "dark", [11], { 14: 130 }],
          [30, 32, 1370, "", [32]],
          [33, 36, 1300, "pill", [35]],
        ];
        const CUTS = [[5.9, 11.1], [13.45, 17.5]];
        const END = 17.5;

        const caps = $("#caps");
        const groups = CAPS.map(([a, b, top, style, kws, hero = {}], gi) => {
          const cap = document.createElement("div");
          cap.className = "cap" + (style === "dark" ? " dark" : "");
          cap.id = "cap-" + gi;
          cap.style.top = top + "px";
          const inner = document.createElement("div");
          inner.className = "inner" + (style === "pill" ? " pill" : "");
          for (let k = a; k <= b; k++) {
            const s = document.createElement("span");
            const isHero = k in hero;
            s.className = "cw" + (kws.includes(k) ? " kw" : "") + (isHero ? " hero" : "");
            s.id = "cw-" + k;
            s.textContent = W[k][0];
            if (isHero) s.style.fontSize = hero[k] + "px";
            if (kws.includes(k)) {
              const u = document.createElement("span");
              u.className = "ul";
              u.id = "ul-" + k;
              s.appendChild(u);
            }
            inner.appendChild(s);
          }
          cap.appendChild(inner);
          caps.appendChild(cap);
          return { cap, inner, a, b, style };
        });

        document.querySelectorAll(".split").forEach((el) => {
          const t = el.textContent;
          el.textContent = "";
          for (const c of t) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c === " " ? " " : c;
            el.appendChild(s);
          }
        });
        const NS = "http://www.w3.org/2000/svg";
        const BARS = [3, 1, 2, 1, 4, 1, 1, 3, 2, 1, 1, 2, 3, 1, 2, 4, 1, 1, 2, 1, 3, 2, 1, 1, 3, 1, 2, 1, 1, 4, 2, 1, 3, 1];
        document.querySelectorAll(".bars").forEach((g) => {
          let bx = 0;
          BARS.forEach((w, i) => {
            if (i % 2 === 0) {
              const r = document.createElementNS(NS, "rect");
              r.setAttribute("x", bx * 2.2);
              r.setAttribute("y", 0);
              r.setAttribute("width", w * 2.2);
              r.setAttribute("height", 54);
              g.appendChild(r);
            }
            bx += w;
          });
        });
        for (let i = 0; i < 8; i++) {
          const y = 164 + i * 52;
          [[44, 150 - (i % 3) * 22, "#d5dcec"], [300, 90, "#c3cde6"], [420, 96 - (i % 2) * 20, "#a9b8e0"]].forEach(([x, w, f]) => {
            const r = document.createElementNS(NS, "rect");
            r.setAttribute("x", x);
            r.setAttribute("y", y);
            r.setAttribute("width", w);
            r.setAttribute("height", 16);
            r.setAttribute("rx", 8);
            r.setAttribute("fill", f);
            $("#doc-rows").appendChild(r);
          });
        }

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        const GHOST = "#8390b3";
        const ink = (sel, t, color = "#0b1f66", step = 0.12) => {
          document.querySelectorAll(sel + " .rw").forEach((w, i) => {
            const ti = Array.isArray(t) ? t[i] : t + i * step;
            tl.fromTo(w, { opacity: 0, y: 26, color: GHOST }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, ti)
              .to(w, { color, duration: 0.25, ease: "power1.out" }, ti + 0.14);
          });
        };
        const letters = (sel, t, from, stagger = 0.03, dur = 0.42) =>
          tl.fromTo(sel + " .ch", from, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: dur, stagger, ease: "expo.out" }, t);

        gsap.set([".cap", "#cutA", "#cutE", "#prof", "#a2", ".tile"], { autoAlpha: 0 });
        gsap.set(".cw", { opacity: 0 });
        gsap.set(".cw .ul", { scaleX: 0, transformOrigin: "0% 50%" });
        gsap.set(["#wash", "#av-ring", "#btn-rip", "#wa-rip", ".tile .hl"], { opacity: 0 });

        tl.fromTo("#leak", { opacity: 0.55, x: 0, y: 0 }, { opacity: 0.9, x: -60, y: 40, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

        // ---- captions ----
        const nextStart = (gi) => {
          const e = gi + 1 < groups.length ? W[groups[gi + 1].a][1] - 0.06 : END;
          const cut = CUTS.find(([c0]) => c0 > W[groups[gi].b][1] - 0.01 && c0 < e);
          return cut ? cut[0] - 0.05 : e;
        };
        groups.forEach(({ cap, inner, a, b, style }, gi) => {
          const s = Math.max(0, W[a][1] - 0.06);
          const e = nextStart(gi);
          tl.set(cap, { autoAlpha: 1 }, s);
          if (style === "pill") tl.fromTo(inner, { scaleX: 0.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, s);
          for (let k = a; k <= b; k++) {
            const el = "#cw-" + k;
            if (document.querySelector(el).classList.contains("hero"))
              tl.fromTo(el, { opacity: 0, scale: 1.35, scaleX: 1.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, scaleX: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, W[k][1]);
            else tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, W[k][1]);
            if (document.querySelector("#ul-" + k)) tl.to("#ul-" + k, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, W[k][1] + 0.12);
          }
          tl.to(cap, { opacity: 0, filter: "blur(10px)", duration: 0.14, ease: "power2.in" }, Math.max(s + 0.3, e - 0.14)).set(cap, { autoAlpha: 0 }, e);
        });
        // "900": counts up while it is said (mirrors the 750 that closes part 2)
        const n900 = { v: 0 };
        tl.fromTo(n900, { v: 0 }, { v: 900, duration: 0.55, ease: "power2.out", onUpdate: () => ($("#cw-5").firstChild.nodeValue = Math.round(n900.v)) }, 1.52);

        // ---- camera ----
        tl.fromTo("#cam", { scale: 1.1 }, { scale: 1.0, duration: 1.0, ease: "expo.out" }, 0)
          .to("#cam", { scale: 1.1, duration: 0.2, ease: "power3.out" }, 1.52)
          .to("#cam", { scale: 1.02, duration: 0.9, ease: "sine.inOut" }, 3.3)
          .to("#cam", { scale: 1.1, duration: 0.2, ease: "power3.out" }, 5.66)
          .set("#cam", { scale: 1.2 }, 11.1)
          .to("#cam", { scale: 1.05, duration: 0.7, ease: "expo.out" }, 11.1)
          .to("#cam", { scale: 1.12, duration: 0.2, ease: "power3.out" }, 12.92);

        // ---- white-wash cuts ----
        const washIn = (t, cut) => tl.to("#wash", { opacity: 1, duration: 0.18, ease: "power2.in" }, t - 0.18).set(cut, { autoAlpha: 1 }, t).to("#wash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        const washOut = (t, cut) => tl.to("#wash", { opacity: 1, duration: 0.16, ease: "power2.in" }, t - 0.16).set(cut, { autoAlpha: 0 }, t).to("#wash", { opacity: 0, duration: 0.32, ease: "power2.out" }, t);

        // =========== cutaway A (5.9 – 11.1) ===========
        washIn(5.9, "#cutA");
        ink("#a-quieres", [5.94, 6.24, 6.66]);
        ink("#a-estado", [7.08, 7.42, 7.64, 7.72]);
        letters("#a-hist", 8.0, { yPercent: 110 }, 0.03);
        letters("#a-lab", 8.26, { yPercent: 110 }, 0.03);
        tl.fromTo("#a-grid", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "expo.inOut" }, 6.0)
          .fromTo("#a-blk", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5 }, 6.2)
          .fromTo("#a-doc", { y: 900, rotation: 20 }, { y: 0, rotation: -6, duration: 0.65, ease: "back.out(1.3)" }, 6.3)
          .fromTo("#a-mag", { x: 560, y: 360, rotation: 40 }, { x: 0, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.4)" }, 8.2)
          .fromTo("#doc-hl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4 }, 8.5);
        // "y entender en qué grupo estás": swap to the group chooser
        tl.to("#a1", { y: -300, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 8.72)
          .to(["#a-doc", "#a-mag", "#a-blk"], { y: 1200, duration: 0.35, ease: "power3.in", stagger: 0.03 }, 8.76)
          .to("#a-grid", { opacity: 0.5, duration: 0.3 }, 8.72)
          .set("#a2", { autoAlpha: 1 }, 8.78);
        ink("#a-entender", [8.8, 9.28, 9.72, 9.94]);
        letters("#a-grupo", 10.2, { scale: 1.8, opacity: 0, filter: "blur(10px)" }, 0.04, 0.45);
        ink("#a-estas", [10.6]);
        tl.set(".tile", { autoAlpha: 1 }, 9.3).fromTo(".tile", { y: 500, rotation: (i) => (i - 1) * 10 }, { y: 0, rotation: (i) => (i - 1) * 3, duration: 0.5, ease: "back.out(1.6)", stagger: 0.1 }, 9.3);
        // which one are you? the highlight hops across the three groups
        [10.2, 10.4, 10.6].forEach((t, i) => {
          tl.to(`#tile-${i} .hl`, { opacity: 1, duration: 0.05 }, t)
            .to(`#tile-${i}`, { y: -24, duration: 0.12, ease: "power2.out" }, t)
            .to(`#tile-${i}`, { y: 0, duration: 0.14, ease: "power2.in" }, t + 0.14)
            .to(`#tile-${i} .hl`, { opacity: 0, duration: 0.08 }, t + 0.19);
        });
        washOut(11.1, "#cutA");

        // =========== on camera: profile card with a tap on the link ===========
        tl.set("#prof", { autoAlpha: 1 }, 11.18)
          .fromTo("#prof", { y: -300, rotation: -6 }, { y: 0, rotation: -2, duration: 0.5, ease: "back.out(1.5)" }, 11.18)
          .fromTo("#cur1", { x: 260, y: 180, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 11.3)
          .to("#cur1", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, 11.68)
          .to("#btn", { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, 11.68)
          .fromTo("#btn-rip", { scale: 1, opacity: 0.9 }, { scale: 1.35, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 11.72)
          .to("#cur1", { x: 180, y: 120, opacity: 0, duration: 0.35, ease: "power2.in" }, 12.3)
          .fromTo("#av-ring", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, 12.92)
          .to("#prof", { y: -300, opacity: 0, duration: 0.25, ease: "power3.in" }, 13.2);

        // =========== end card (13.45 – 17.5) ===========
        washIn(13.45, "#cutE");
        ink("#e-sol", [13.5]);
        letters("#e-aten", 14.38, { yPercent: 110 }, 0.035);
        letters("#e-pers", 14.74, { yPercent: 110 }, 0.025);
        ink("#e-via", [15.42]);
        tl.fromTo("#wa", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 15.86)
          .fromTo("#cur2", { x: 300, y: 260, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 16.1)
          .to("#cur2", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, 16.5)
          .to("#wa", { scale: 0.95, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, 16.5)
          .fromTo("#wa-rip", { scale: 1, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 16.55)
          .to("#wa", { y: -10, duration: 0.8, ease: "sine.inOut" }, 16.7);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
