          { id: "s9", a: T(94) - 0.1, b: 46.65, x: 110, y: 560, al: "", parts: [[T(94), L("Además")], [T(97), '<div class="feat"><svg viewBox="0 0 62 62"><circle cx="31" cy="26" r="11" fill="none" stroke="#e6cf9f" stroke-width="2.5"/><path d="M31 4 V9 M31 43 V48 M9 26 H14 M48 26 H53 M15 10 L19 14 M43 38 L47 42 M47 10 L43 14 M19 38 L15 42 M22 56 H40" stroke="#e6cf9f" stroke-width="2.5" stroke-linecap="round"/></svg><span>Iluminación LED solar</span></div>'], [T(100), '<div class="feat"><svg viewBox="0 0 62 62"><path d="M14 10 H48 V52 H14 Z M14 30 H48" fill="none" stroke="#e6cf9f" stroke-width="2.5"/><path d="M22 40 C 26 36, 30 44, 34 40 S 40 36, 42 40" fill="none" stroke="#e6cf9f" stroke-width="2.5" stroke-linecap="round"/></svg><span>Tanque de reserva de agua</span></div>'], [T(106), '<div class="feat"><svg viewBox="0 0 62 62"><path d="M8 54 V18 H54 V54 M8 54 H54 M31 18 V54" fill="none" stroke="#e6cf9f" stroke-width="2.5"/><path d="M20 36 L26 36 M36 36 L42 36" stroke="#e6cf9f" stroke-width="2.5" stroke-linecap="round"/><path d="M24 8 C 28 4, 34 4, 38 8 M20 4 C 26 -2, 36 -2, 42 4" fill="none" stroke="#e6cf9f" stroke-width="2" stroke-linecap="round"/></svg><span>Puertas eléctricas automatizadas</span></div>']] },
          { id: "s10", a: T(110) - 0.1, b: 50.6, x: 960, y: 380, al: "c", parts: [[T(110), '<div class="lab"><i></i>Lo mejor<i></i></div>'], [T(114), '<div class="ttl" style="font-size:118px">Se vende a</div>'], [T(117), '<div class="ttl" style="font-size:118px;margin-top:0"><em>puertas cerradas</em></div>']] },
        ];
        const host = $("#specs");
        SPECS.forEach((sp) => {
          const el = document.createElement("div");
          el.className = "spec " + sp.al;
          el.id = sp.id;
          if (sp.al === "r") el.style.right = 1920 - sp.x + "px";
          else if (sp.al === "c") (el.style.left = "0px"), (el.style.right = "0px");
          else el.style.left = sp.x + "px";
          el.style.top = sp.y + "px";
          sp.parts.forEach(([t, html], i) => {
            const w = document.createElement("div");
            w.className = "part";
            w.id = `${sp.id}-p${i}`;
            w.style.position = "relative";
            w.innerHTML = html;
            el.appendChild(w);
          });
          host.appendChild(el);
        });

        // ---------- captions (small, quiet) ----------
        const groups = [];
        let cur = [];
        const flush = () => cur.length && (groups.push(cur), (cur = []));
        W.forEach(([w], k) => {
          if (T(k) >= 50.6) return flush();
          if (cur.length && (T(k) - T(cur[cur.length - 1]) > 0.75 || cur.length >= 6)) flush();
          cur.push(k);
          if (/[.,:;?!]$/.test(w) && cur.length >= 3) flush();
        });
        flush();
        groups.forEach((g, gi) => {
          const cap = document.createElement("div");
          cap.className = "cap";
          cap.id = "cap-" + gi;
          const inner = document.createElement("div");
          inner.className = "inner";
          g.forEach((k) => {
            const s = document.createElement("span");
            s.className = "cw";
            s.id = "cw-" + k;
            s.textContent = W[k][0];
            inner.appendChild(s);
          });
          cap.appendChild(inner);
          $("#caps").appendChild(cap);
        });

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        gsap.set([".cap", ".spec", "#vf", "#gauge", "#endc", ".shade"], { autoAlpha: 0 });
        gsap.set([".cw", ".part"], { opacity: 0 });

        // captions
        groups.forEach((g, gi) => {
          const s = T(g[0]) - 0.05;
          const nx = gi + 1 < groups.length ? T(groups[gi + 1][0]) - 0.05 : 50.55;
          const e = Math.min(nx, T(g[g.length - 1]) + 1.8, 50.55);
          tl.set(`#cap-${gi}`, { autoAlpha: 1 }, s);
          g.forEach((k) => tl.set(`#cw-${k}`, { opacity: 1 }, T(k)).fromTo(`#cw-${k}`, { y: 8 }, { y: 0, duration: 0.3, ease: "power2.out" }, T(k)));
          tl.set(`#cap-${gi}`, { autoAlpha: 0 }, e);
        });

        // spec blocks: each part slides up out of a mask, labels draw their gold rule
        SPECS.forEach((sp) => {
          tl.set(`#${sp.id}`, { autoAlpha: 1, y: 0 }, sp.a);
          sp.parts.forEach(([t], i) => {
            const p = `#${sp.id}-p${i}`;
            tl.set(p, { opacity: 1 }, t)
              .fromTo(p, { clipPath: "inset(0 0 100% 0)", y: 40 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.9, ease: "expo.out" }, t);
            tl.fromTo(`${p} .lab i`, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out", transformOrigin: sp.al === "r" ? "100% 50%" : "0% 50%" }, t + 0.1);
            tl.fromTo(`${p} .rule`, { scaleX: 0, transformOrigin: sp.al === "r" ? "100% 50%" : "0% 50%" }, { scaleX: 1, duration: 1.0, ease: "expo.out" }, t + 0.1);
          });
          tl.to(`#${sp.id}`, { autoAlpha: 0, y: -16, duration: 0.45, ease: "power2.in" }, sp.b - 0.45);
          const sh = sp.al === "r" ? "#shadeR" : sp.al === "c" ? "#shadeC" : "#shadeL";
          tl.to(sh, { autoAlpha: 1, duration: 0.6, ease: "sine.out" }, sp.a - 0.1).to(sh, { autoAlpha: 0, duration: 0.5, ease: "sine.in" }, sp.b - 0.4);
        });
        // inline reveals inside blocks
        gsap.set("#s4 .r4b", { opacity: 0 });
        tl.fromTo("#s4 .r4b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, T(47));
        tl.fromTo(["#c5-b", "#c5-c"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 1.0 }, T(56));
        gsap.set(["#c5-b", "#c5-c"], { opacity: 0 });

        // counters
        const counter = (sel, from, to, t, d, dec = 0) => {
          const o = { v: from };
          tl.to(o, { v: to, duration: d, ease: "power2.out", onUpdate: () => ($(sel).textContent = dec ? o.v.toFixed(dec).replace(".", ",") : Math.round(o.v).toLocaleString("es-CO")) }, t);
        };
        counter("#n-m2", 0, 976, T(38), 1.6);
        counter("#n-depth", 0, 1.7, T(85), 1.2, 2);
        tl.fromTo("#n-pisos", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, T(35));

        // drone shots: viewfinder frame + REC pulse
        [[8.6, 12.2], [32.5, 35.4], [38.6, 40.1]].forEach(([a, b]) => {
          tl.set("#vf", { autoAlpha: 1 }, a).fromTo("#vf", { scale: 1.04, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out", transformOrigin: "50% 50%" }, a).to("#vf", { autoAlpha: 0, duration: 0.3 }, b - 0.3);
        });
        tl.to("#vf-rec", { opacity: 0.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 8.8).to("#vf-rec", { opacity: 0.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 32.6);

        // pool depth gauge
        tl.set("#gauge", { autoAlpha: 1 }, T(85) - 0.1)
          .to("#g-line", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.out" }, T(85))
          .fromTo("#g-ticks path", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.15, svgOrigin: "1560 500" }, T(85) + 0.1)
          .fromTo("#g-arrow", { y: -430, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: "power2.out" }, T(85))
          .to("#gauge", { autoAlpha: 0, duration: 0.35 }, 40.0);

        // ===== end card over the black tail =====
        const EW = [[0, T(123)], [1, T(124)], [2, T(125)], [3, T(127)]];
        // lay the four words out on one centered line with gold dots between
        let x = 0;
        const widths = EW.map(([i]) => $("#ew-" + i).getBoundingClientRect().width);
        const gap = 64;
        const total = widths.reduce((a, b) => a + b, 0) + gap * 3;
        x = (1920 - total) / 2;
        EW.forEach(([i], j) => {
          $("#ew-" + i).style.left = x + "px";
          if (j < 3) {
            const d = document.createElement("i");
            d.className = "dot";
            d.id = "dot-" + j;
            d.style.left = x + widths[j] + gap / 2 - 5 + "px";
            $("#endc").appendChild(d);
          }
          x += widths[j] + gap;
        });
        gsap.set(".ew", { opacity: 0 });
        gsap.set("#e-cta", { xPercent: -50 });
        tl.set("#endc", { autoAlpha: 1 }, 50.6)
          .fromTo("#endc", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 50.6)
          .to(["#e-l1", "#e-l2"], { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power2.inOut" }, 50.65)
          .fromTo("#e-lab", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 50.7);
        EW.forEach(([i, t], j) => {
          tl.set("#ew-" + i, { opacity: 1 }, t).fromTo("#ew-" + i, { clipPath: "inset(0 0 100% 0)", y: 50 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.9, ease: "expo.out" }, t);
          if (j > 0) tl.fromTo("#dot-" + (j - 1), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, t - 0.1);
        });
        tl.fromTo("#e-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, T(128))
          .fromTo("#e-con", { clipPath: "inset(0 0 100% 0)", y: 40, opacity: 1 }, { clipPath: "inset(0 0 0% 0)", y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, T(132))
          .fromTo("#e-cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, T(137) - 0.1)
          .fromTo("#e-cta", { boxShadow: "0 0 0 0 rgba(201,169,110,0.55)" }, { boxShadow: "0 0 0 26px rgba(201,169,110,0)", duration: 1.2, ease: "power2.out", repeat: 1, immediateRender: false }, T(139))
          .fromTo("#e-foot", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 57.3);
        gsap.set(["#e-sub", "#e-con", "#e-cta", "#e-foot", "#e-lab"], { opacity: 0 });

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
