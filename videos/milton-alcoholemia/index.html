    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

        // ---------- captions: [who, start, end, lead [[w,t]], big [word,t,hot?] | null, tail [text,t] | null, anim] ----------
        const G = [
          ["M", 2.26, 4.0, [["venga,", 2.9], ["pero,", 3.2], ["mano,", 3.48]], ["¿por qué?", 3.7], null, "pop"],

          ["M", 11.96, 15.46, [["necesito", 11.98], ["hacerle", 12.38], ["una", 12.58]], ["prueba", 12.82, 1], ["para determinar si está bajo los efectos del alcohol", 13.28], "pop"],
          ["A", 15.48, 18.38, [["no,", 15.5], ["no,", 15.74], ["no,", 16.12], ["yo", 16.66], ["no", 17.08], ["estoy", 17.22]], ["bajo efectos", 17.32], ["del alcohol", 17.76], "type"],
          ["M", 18.4, 20.48, [["pero", 18.42], ["por", 18.6], ["eso", 18.72], ["necesito", 18.9]], ["determinarlo", 19.22], null, "slide"],

          ["A", 42.54, 45.9, [["no,", 42.54], ["no,", 42.76], ["no,", 42.94], ["pero", 43.2], ["yo", 43.42], ["no", 43.54], ["me", 43.68], ["hago", 43.82]], ["ninguna prueba", 44.1], null, "slide"],
          ["M", 46.02, 47.5, [["no,", 46.04], ["señor,", 46.24], ["un", 46.44], ["momentico,", 46.6], ["lo", 46.94], ["que", 47.0], ["pasa", 47.1], ["es", 47.22], ["que", 47.26], ["el", 47.34]], null, null, "type"],
          ["M", 49.02, 53.3, [["dice", 50.68], ["que", 51.18], ["si", 51.36], ["usted", 51.64], ["se", 51.9]], ["niega", 52.16], ["a realizarse la prueba de alcoholemia", 52.44], "pop"],
          ["M", 53.32, 55.7, [["tiene", 54.46], ["la", 54.64]], ["sanción mayor", 54.84, 1], null, "slide"],
          ["M", 55.72, 58.86, [["de", 55.56]], ["1.440 salarios", 55.72, 1], ["mínimos diarios legales vigentes", 57.1], "bounce"],
          ["M", 58.88, 61.2, [["y", 58.9], ["la", 59.06]], ["cancelación", 59.36, 1], ["de la licencia de conducción", 59.82], "flip"],
          ["M", 61.22, 64.06, [["entonces,", 61.24], ["o", 61.56], ["se", 61.66], ["hace", 61.76], ["la", 62.08], ["prueba", 62.24], ["o", 62.98], ["le", 63.06], ["pongo", 63.18], ["la", 63.38]], ["sanción mayor", 63.52], null, "pop"],
          ["A", 64.08, 67.74, [["o", 64.16], ["sea", 64.18], ["que", 64.32], ["si", 64.48], ["yo", 64.76], ["no", 64.92], ["me", 65.02], ["hago", 65.12], ["la", 65.26], ["prueba,", 65.44], ["me", 66.12], ["pone", 66.24], ["la", 66.42], ["sanción", 66.58]], ["más cara", 66.92], null, "type"],
          ["M", 67.76, 70.5, [["claro,", 67.76], ["mi", 67.98], ["muchacho,", 68.2], ["es", 68.5], ["que", 68.58]], ["lo dicta la ley", 68.7], ["papá", 69.64], "slide"],
          ["A", 70.52, 72.2, [["ay,", 70.52], ["ay,", 71.02], ["ay,", 71.1]], ["yo no sabía", 71.18], null, "bounce"],
          ["A", 72.22, 74.28, [["ah,", 72.22], ["no,", 72.42]], ["hagamos la prueba", 72.56], ["hagamos la prueba", 73.2], "pop"],

        ];
        const caps = $("#caps");
        G.forEach(([who, a, b, lead, big, tail, anim]) => {
          const g = document.createElement("div");
          g.className = "cg " + who;
          const sm = document.createElement("div");
          sm.className = "sm";
          const leadEls = lead.map(([w, t]) => {
            const s = document.createElement("span");
            s.textContent = w;
            sm.appendChild(s);
            return [s, t];
          });
          g.appendChild(sm);
          let bg = null;
          let tn = null;
          if (big) {
            bg = document.createElement("div");
            bg.className = "bg" + (big[2] ? " hot" : "");
            // long keywords shrink so they always fit on one line
            if (big[0].length > 11) bg.style.fontSize = Math.round(Math.min(124, 1500 / big[0].length)) + "px";
            if (anim === "type") {
              [...big[0]].forEach((ch) => {
                const c = document.createElement("span");
                c.className = "c";
                c.textContent = ch === " " ? " " : ch;
                bg.appendChild(c);
              });
            } else bg.textContent = big[0];
            g.appendChild(bg);
          }
          if (tail) {
            tn = document.createElement("div");
            tn.className = "tn";
            tn.textContent = tail[0];
            g.appendChild(tn);
          }
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          leadEls.forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, Math.max(a, t)));
          if (bg) {
            const t = Math.max(a, big[1]);
            if (anim === "pop") tl.fromTo(bg, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.8)" }, t);
            else if (anim === "flip") tl.fromTo(bg, { rotationX: -95, opacity: 0, y: 20 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t);
            else if (anim === "slide") tl.fromTo(bg, { yPercent: 70, clipPath: "inset(0 -5% 100% -5%)" }, { yPercent: 0, clipPath: "inset(-15% -5% -15% -5%)", duration: 0.45, ease: "expo.out" }, t);
            else if (anim === "bounce") tl.fromTo(bg, { y: -200, scale: 1.3, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, t);

          if (b < 89.7) tl.set(g, { visibility: "hidden" }, b);

        // ---------- camera: comedic punch-ins on the reactions ----------
        // [t, scale, origin, hold]
        const P = [
          [11.96, 1.12, "50% 30%", 1.8], [26.62, 1.18, "50% 35%", 0.8], [39.94, 1.15, "50% 30%", 1.6], [55.72, 1.15, "50% 30%", 2.0], [70.52, 1.18, "50% 35%", 1.6],
        ];
        P.forEach(([t, s, o, hold]) => {
          tl.set("#zoom", { transformOrigin: o }, t)
            .fromTo("#zoom", { scale: 1 }, { scale: s, duration: 0.18, ease: "power4.out" }, t)
            .to("#zoom", { scale: s + 0.04, duration: hold - 0.4, ease: "none" }, t + 0.18)
            .to("#zoom", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + hold - 0.2);
        });
        // shakes on the punchlines
        [[26.62, 0.3], [59.36, 0.35]].forEach(([t, d]) => {
          tl.to("#zoom", { x: 12, duration: 0.04, ease: "none", yoyo: true, repeat: Math.round(d / 0.04) }, t);
          tl.set("#zoom", { x: 0 }, t + d + 0.05);
        });

        const show = (id, a, b) => {
          tl.set(id, { visibility: "visible" }, a);
          tl.set(id, { visibility: "hidden" }, b);
        };
        const pop = (sel, t, from = { scale: 0 }, d = 0.45, ease = "back.out(2.6)") =>
          tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: d, ease }, t);
        const slam = (sel, t, rot = -8) => {
          tl.fromTo(sel, { scale: 3, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo(sel, { y: 0 }, { y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.25);
        };

        // ===== artículo 152 title =====
        tl.fromTo("#art", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 47.5);
        tl.fromTo("#art-n", { scale: 2.6, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.3, ease: "power4.in" }, 48.0);
        tl.fromTo("#art-r", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 48.4);
        tl.to("#art", { opacity: 0, y: -60, duration: 0.4, ease: "power3.in" }, 61.0);

        // ===== plate blur (0 – 0.8) =====
        const box = (x0, y0, x1, y1) => "inset(" + Math.max(0, y0 - 40) + "px " + Math.max(0, 1080 - x1 - 40) + "px " + Math.max(0, 1920 - y1 - 40) + "px " + Math.max(0, x0 - 40) + "px round 18px)";
        const PK = [
          [0.0, 20, 1330, 290, 1520], [0.4, 0, 1360, 230, 1530], [0.75, 0, 1380, 130, 1545],
        ];
        tl.set("#plate", { opacity: 1, clipPath: box(...PK[0].slice(1)) }, 0);
        PK.slice(1).forEach((k, i) => tl.to("#plate", { clipPath: box(...k.slice(1)), duration: k[0] - PK[i][0], ease: "none" }, PK[i][0]));
        tl.set("#plate", { opacity: 0, clipPath: "inset(1920px 0px 0px 1080px)" }, 0.85);

        tl.set({}, {}, 83.77);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
