    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      /* Profe Milton palette */
      :root {
        --ink: #0b1428;
        --yellow: #ffd400;
        --orange: #ff7a2f;
        --red: #e5484d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #zoom {
        display: none;
      }
      #zoom {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- captions: cápsula hierarchy in Milton colours ---------- */
      .cg {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1470px;
        text-align: center;
        visibility: hidden;
        perspective: 900px;
      }
      .who {
        display: inline-block;
        height: 46px;
        padding: 0 20px;
        border-radius: 23px;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 0.14em;
        line-height: 46px;
        margin-bottom: 10px;
      }
      .who.A {
        background: var(--orange);
        color: #fff;
      }
      .who.M {
        background: var(--yellow);
        color: var(--ink);
      }
      .cg .sm {
        font-weight: 800;
        font-size: 50px;
        line-height: 1.1;
        color: #fff;
        -webkit-text-stroke: 9px var(--ink);
        paint-order: stroke fill;
      }
      .cg .sm span {
        display: inline-block;
        margin: 0 7px;
      }
      .cg .bg {
        display: inline-block;
        margin-top: 12px;
        font-weight: 900;
        font-size: 124px;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: #fff;
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
        transform-origin: 50% 70%;
      }
      .cg .bg.hot {
        color: var(--yellow);
      }
      .cg .bg .c {
        display: inline-block;
      }
      .cg .tn {
        margin-top: 4px;
        font-weight: 800;
        font-size: 38px;
        color: #fff;
        -webkit-text-stroke: 7px var(--ink);
        paint-order: stroke fill;
      }

      /* ---------- stickers ---------- */
      .stk {
        position: absolute;
        visibility: hidden;
      }
      .tog {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 96px;
        padding: 0 28px 0 18px;
        border-radius: 48px;
        background: var(--ink);
        color: #fff;
        font-weight: 900;
        font-size: 38px;
        white-space: nowrap;
        box-shadow: 0 10px 0 rgba(11, 20, 40, 0.35);
      }
      .flag {
        width: 84px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 3px solid #fff;
      }
      .sw {
        position: relative;
        width: 96px;
        height: 52px;
        border-radius: 26px;
        background: #3a4560;
      }
      .sw i {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
      }
      .stamp {
        padding: 14px 40px;
        border: 12px solid var(--red);
        border-radius: 22px;
        color: var(--red);
        font-weight: 900;
        font-size: 104px;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.86);
        white-space: nowrap;
      }
      .burst {
        display: grid;
        place-items: center;
        width: 330px;
        height: 330px;
        color: var(--ink);
        font-weight: 900;
        font-size: 64px;
        text-align: center;
        line-height: 0.95;
        background: var(--yellow);
        clip-path: polygon(50% 0%, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 86% 52%, 100% 68%, 79% 72%, 82% 94%, 61% 84%, 50% 100%, 39% 84%, 18% 94%, 21% 72%, 0% 68%, 14% 52%, 0% 36%, 20% 30%, 18% 8%, 39% 18%);
      }
      .pill {
        height: 76px;
        padding: 0 32px;
        border-radius: 38px;
        font-weight: 900;
        font-size: 36px;
        letter-spacing: 0.1em;
        line-height: 76px;
        white-space: nowrap;
      }
      .ov {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: screen;
      }
      html[data-mode="green"] .ov {
        display: none;
      }
      #rw {
        position: absolute;
        inset: 0;
        visibility: hidden;
        background: transparent;
      }
      #rw-t {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        text-align: center;
        font-weight: 900;
        font-size: 92px;
        white-space: nowrap;
        color: #fff;
        letter-spacing: -0.02em;
        -webkit-text-stroke: 12px #0b1428;
        paint-order: stroke fill;
      }
      #rw-s {
        position: absolute;
        left: 0;
        right: 0;
        top: 970px;
        text-align: center;
        font-weight: 800;
        font-size: 44px;
        color: var(--yellow);
        letter-spacing: 0.3em;
      }
      /* ---------- white motion-graphic scenes ---------- */
      .ws {
        position: absolute;
        inset: 0;
        background: #fff;
        color: var(--ink);
        clip-path: inset(0 0 0 100%);
        overflow: hidden;
      }
      .ws .edge {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 26px;
        background: var(--yellow);
        opacity: 0;
      }
      .ws .ttl {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 900;
        letter-spacing: 0.2em;
      }
      .mk {
        background: linear-gradient(transparent 58%, var(--yellow) 58%, var(--yellow) 92%, transparent 92%);
      }
      /* SOAT acronym */
      #wsA .row {
        position: absolute;
        left: 150px;
        display: flex;
        align-items: baseline;
        gap: 18px;
        white-space: nowrap;
      }
      #wsA .L {
        display: inline-block;
        width: 170px;
        font-weight: 900;
        font-size: 210px;
        line-height: 1;
        text-align: center;
      }
      #wsA .Lw i {
        position: absolute;
        left: 0;
        width: 170px;
        bottom: 18px;
        height: 60px;
        background: var(--yellow);
        transform-origin: 0 50%;
      }
      #wsA .Lw {
        position: relative;
        display: inline-block;
        isolation: isolate;
      }
      #wsA .Lw .L {
        position: relative;
      }
      #wsA .rest {
        font-weight: 700;
        font-size: 74px;
      }
      #wsA .rest small {
        font-size: 44px;
        font-weight: 600;
        opacity: 0.7;
        margin-right: 10px;
      }
      /* icon grid */
      #wsB .grid {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 620px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        row-gap: 100px;
      }
      #wsB .it {
        text-align: center;
      }
      #wsB .ic {
        width: 230px;
        height: 230px;
        margin: 0 auto;
        border-radius: 50%;
        background: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #wsB .ic svg {
        width: 150px;
        height: 150px;
        fill: none;
        stroke: var(--ink);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #wsB .lb {
        margin-top: 18px;
        font-weight: 800;
        font-size: 50px;
      }
      /* 18 months */
      #wsC .num {
        position: absolute;
        left: 0;
        right: 0;
        top: 650px;
        text-align: center;
        font-weight: 900;
        font-size: 380px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      #wsC .un {
        position: absolute;
        left: 0;
        right: 0;
        top: 1050px;
        text-align: center;
        font-weight: 900;
        font-size: 110px;
        letter-spacing: 0.12em;
      }
      #wsC .tlw {
        position: absolute;
        left: 130px;
        right: 130px;
        top: 1400px;
        height: 14px;
        border-radius: 7px;
        background: #e3e6ec;
      }
      #wsC .tlw i {
        position: absolute;
        inset: 0;
        border-radius: 7px;
        background: var(--yellow);
        transform-origin: 0 50%;
      }
      #wsC .dot {
        position: absolute;
        top: -19px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--ink);
        border: 9px solid #fff;
        box-shadow: 0 0 0 4px var(--ink);
      }
      #wsC .tl {
        position: absolute;
        top: 1460px;
        width: 380px;
        font-weight: 800;
        font-size: 40px;
        line-height: 1.15;
      }
      /* SOAT card + stamp */
      #wsD .card {
        position: absolute;
        left: 150px;
        right: 150px;
        top: 620px;
        height: 520px;
        border: 10px solid var(--ink);
        border-radius: 40px;
        padding: 50px 60px;
      }
      #wsD .card .h {
        font-weight: 900;
        font-size: 120px;
        line-height: 1;
      }
      #wsD .card .sub {
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.08em;
        margin-top: 10px;
      }
      #wsD .card .ln {
        height: 22px;
        border-radius: 11px;
        background: #e3e6ec;
        margin-top: 34px;
      }
      #wsD .vstamp {
        position: absolute;
        left: 0;
        right: 0;
        top: 960px;
        text-align: center;
      }
      #wsD .vstamp b {
        display: inline-block;
        padding: 18px 46px;
        border: 12px solid var(--ink);
        border-radius: 22px;
        background: var(--yellow);
        font-weight: 900;
        font-size: 120px;
        letter-spacing: 0.06em;
        transform: rotate(-8deg);
      }
      #wsD .foot {
        position: absolute;
        left: 0;
        right: 0;
        top: 1330px;
        text-align: center;
        font-weight: 700;
        font-size: 52px;
      }
      /* contact number at the very end */
      #tel {
        position: absolute;
        left: 0;
        right: 0;
        top: 1660px;
        text-align: center;
        opacity: 0;
        white-space: nowrap;
      }
      #tel svg {
        width: 84px;
        height: 84px;
        vertical-align: -12px;
        margin-right: 18px;
      }
      #tel b {
        font-weight: 900;
        font-size: 96px;
        letter-spacing: 0.02em;
        color: #fff;
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
      }
    </style>

          ["M", 12.3, 13.16, [["lo", 12.32], ["voy", 12.42], ["a", 12.5]], ["explicar", 12.64], null, "bounce"],
          ["M", 15.88, 18.55, [["le", 15.88], ["cubre", 16.08], ["a", 16.3]], ["todas las personas", 16.52], ["involucradas en el accidente", 17.46], "slide"],
          ["M", 23.92, 26.9, [["absolutamente", 23.96], ["a", 24.4]], ["todas las personas", 24.7, 1], ["involucradas en el accidente", 25.84], "type"],
          ["M", 33.9, 35.2, [["y", 33.92], ["algo", 34.16], ["muy", 34.36]], ["importante", 34.78], null, "bounce"],
          ["M", 38.1, 38.86, [["mis", 38.12]], ["muchachos", 38.34], null, "pop"],
          ["M", 38.88, 41.25, [["si", 38.9], ["todavía", 39.32], ["están", 39.62], ["dentro", 39.98], ["del", 40.16]], ["tiempo establecido", 40.42], null, "type"],
          ["M", 41.27, 43.2, [["y", 41.28], ["no", 41.38], ["han", 41.44], ["iniciado", 41.68], ["la", 41.92]], ["reclamación", 42.08], ["ante el SOAT", 42.6], "slide"],
          ["M", 43.22, 44.98, [["con", 43.26], ["mucho", 43.6], ["gusto", 43.9], ["nosotros", 44.08]], ["los acompañamos", 44.34], null, "pop"],
          ["M", 45.0, 48.45, [], ["contáctenos", 45.22, 1], null, "bounce"],
        ];
        const caps = $("#caps");
        G.forEach(([who, a, b, lead, big, tail, anim]) => {
          const g = document.createElement("div");
          g.className = "cg " + who;
          const sm = document.createElement("div");
          sm.className = "sm";
          const leadEls = lead.map(([w, t]) => {
            const s = document.createElement("span");
            s.textContent = w;
            sm.appendChild(s);
            return [s, t];
          });
          g.appendChild(sm);
          let bg = null;
          let tn = null;
          if (big) {
            bg = document.createElement("div");
            bg.className = "bg" + (big[2] ? " hot" : "");
            // long keywords shrink so they always fit on one line
            if (big[0].length > 11) bg.style.fontSize = Math.round(Math.min(124, 1500 / big[0].length)) + "px";
            if (anim === "type") {
              [...big[0]].forEach((ch) => {
                const c = document.createElement("span");
                c.className = "c";
                c.textContent = ch === " " ? " " : ch;
                bg.appendChild(c);
              });
            } else bg.textContent = big[0];
            g.appendChild(bg);
          }
          if (tail) {
            tn = document.createElement("div");
            tn.className = "tn";
            tn.textContent = tail[0];
            g.appendChild(tn);
          }
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          leadEls.forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, Math.max(a, t)));
          if (bg) {
            const t = Math.max(a, big[1]);
            if (anim === "pop") tl.fromTo(bg, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.8)" }, t);
            else if (anim === "flip") tl.fromTo(bg, { rotationX: -95, opacity: 0, y: 20 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t);
            else if (anim === "slide") tl.fromTo(bg, { yPercent: 70, clipPath: "inset(0 -5% 100% -5%)" }, { yPercent: 0, clipPath: "inset(-15% -5% -15% -5%)", duration: 0.45, ease: "expo.out" }, t);
            else if (anim === "bounce") tl.fromTo(bg, { y: -200, scale: 1.3, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, t);
            else if (anim === "type") tl.fromTo(bg.querySelectorAll(".c"), { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.035 }, t);
            tl.to(bg, { scale: 1.04, duration: Math.max(0.2, b - t - 0.6), ease: "none" }, t + 0.5);
          }
          if (tn) tl.fromTo(tn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, tail[1]);
          if (b < 89.7) tl.set(g, { visibility: "hidden" }, b);
        });

        // ---------- camera: comedic punch-ins on the reactions ----------
        // [t, scale, origin, hold]
        const P = [
          [9.48, 1.1, "50% 30%", 1.6], [34.78, 1.12, "50% 30%", 1.2], [44.34, 1.08, "50% 30%", 1.5],
        ];
        P.forEach(([t, s, o, hold]) => {
          tl.set("#zoom", { transformOrigin: o }, t)
            .fromTo("#zoom", { scale: 1 }, { scale: s, duration: 0.18, ease: "power4.out" }, t)
            .to("#zoom", { scale: s + 0.04, duration: hold - 0.4, ease: "none" }, t + 0.18)
            .to("#zoom", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + hold - 0.2);
        });

        const show = (id, a, b) => {
          tl.set(id, { visibility: "visible" }, a);
          tl.set(id, { visibility: "hidden" }, b);
        };
        const pop = (sel, t, from = { scale: 0 }, d = 0.45, ease = "back.out(2.6)") =>
          tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: d, ease }, t);
        const slam = (sel, t, rot = -8) => {
          tl.fromTo(sel, { scale: 3, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo(sel, { y: 0 }, { y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.25);
        };

        // ===== white scenes: wipe in from the right behind a yellow edge, wipe out to the left =====
        const scene = (id, a, b) => {
          tl.fromTo(id, { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.45, ease: "power3.inOut" }, a);
          tl.fromTo(id + " .edge", { opacity: 1, x: 1080 }, { x: -40, duration: 0.45, ease: "power3.inOut" }, a);
          tl.set(id + " .edge", { opacity: 0 }, a + 0.46);
          tl.to(id, { clipPath: "inset(0 100% 0 0)", duration: 0.4, ease: "power3.inOut" }, b - 0.4);
        };
        const up = (sel, t, d = 0.5) => tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);

        // A · S-O-A-T unfolds (13.1 – 15.85)
        scene("#wsA", 13.1, 15.85);
        $$("#wsA .row").forEach((r, i) => {
          tl.fromTo(r.querySelector(".L"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, 13.4 + i * 0.08);
          tl.fromTo(r.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, [13.94, 14.24, 14.94, 15.5][i]);
          tl.fromTo(r.querySelector(".rest"), { clipPath: "inset(0 100% 0 0)", x: -30 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.45, ease: "power3.out" }, [13.94, 14.24, 14.94, 15.5][i]);
        });

        // B · llámese … six icons (18.6 – 23.92)
        scene("#wsB", 18.6, 23.92);
        up("#wsB .ttl", 18.7);
        $$("#wsB .it").forEach((it, i) => {
          const t = [19.3, 19.96, 20.5, 21.32, 22.08, 22.64][i];
          tl.fromTo(it.querySelector(".ic"), { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, t);
          up(it.querySelector(".lb"), t + 0.1, 0.35);
        });

        // C · requisitos, 18 months, accident → claim (27.25 – 33.9)
        scene("#wsC", 27.25, 33.9);
        up("#wsC .ttl", 27.48);
        up("#c-hasta", 28.54);
        tl.fromTo("#c-num", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 29.1);
        const cn = { v: 0 };
        tl.to(cn, { v: 18, duration: 1.1, ease: "power2.out", onUpdate: () => ($("#c-num").textContent = Math.round(cn.v)) }, 29.1);
        up("#c-un", 29.62);
        up("#c-tl", 30.0, 0.4);
        up("#c-l1", 31.22, 0.4);
        tl.fromTo("#c-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 31.4);
        tl.fromTo("#c-d2", { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 32.8);
        up("#c-l2", 32.62, 0.45);

        // D · the SOAT must be valid (35.1 – 38.05)
        scene("#wsD", 35.1, 38.05);
        up("#wsD .ttl", 35.15);
        tl.fromTo("#d-card", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 35.3);
        tl.fromTo("#d-stamp b", { scale: 3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.22, ease: "power4.in" }, 36.6);
        tl.to("#d-card", { x: 10, duration: 0.04, yoyo: true, repeat: 5, ease: "none" }, 36.82);
        up("#d-foot", 37.28, 0.4);

        // contact number under "contáctenos", held over the frozen last frame
        tl.fromTo("#tel", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 45.45);
        tl.fromTo("#tel svg", { rotation: -20 }, { rotation: 20, duration: 0.08, yoyo: true, repeat: 7, ease: "none" }, 45.9);

        tl.set({}, {}, 48.45);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
