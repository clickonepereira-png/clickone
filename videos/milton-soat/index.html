<!doctype html>
<html lang="es" data-mode="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Profe Milton — reclamación SOAT</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      /* Profe Milton palette */
      :root {
        --ink: #0b1428;
        --yellow: #ffd400;
        --orange: #ff7a2f;
        --red: #e5484d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #zoom {
        display: none;
      }
      #zoom {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- captions: cápsula hierarchy in Milton colours ---------- */
      .cg {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1470px;
        text-align: center;
        visibility: hidden;
        perspective: 900px;
      }
      .who {
        display: inline-block;
        height: 46px;
        padding: 0 20px;
        border-radius: 23px;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 0.14em;
        line-height: 46px;
        margin-bottom: 10px;
      }
      .who.A {
        background: var(--orange);
        color: #fff;
      }
      .who.M {
        background: var(--yellow);
        color: var(--ink);
      }
      .cg .sm {
        font-weight: 800;
        font-size: 50px;
        line-height: 1.1;
        color: #fff;
        -webkit-text-stroke: 9px var(--ink);
        paint-order: stroke fill;
      }
      .cg .sm span {
        display: inline-block;
        margin: 0 7px;
      }
      .cg .bg {
        display: inline-block;
        margin-top: 12px;
        font-weight: 900;
        font-size: 124px;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: #fff;
        -webkit-text-stroke: 14px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
        transform-origin: 50% 70%;
      }
      .cg .bg.hot {
        color: var(--yellow);
      }
      .cg .bg .c {
        display: inline-block;
      }
      .cg .tn {
        margin-top: 4px;
        font-weight: 800;
        font-size: 38px;
        color: #fff;
        -webkit-text-stroke: 7px var(--ink);
        paint-order: stroke fill;
      }

      /* ---------- stickers ---------- */
      .stk {
        position: absolute;
        visibility: hidden;
      }
      .tog {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 96px;
        padding: 0 28px 0 18px;
        border-radius: 48px;
        background: var(--ink);
        color: #fff;
        font-weight: 900;
        font-size: 38px;
        white-space: nowrap;
        box-shadow: 0 10px 0 rgba(11, 20, 40, 0.35);
      }
      .flag {
        width: 84px;
        height: 56px;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 3px solid #fff;
      }
      .sw {
        position: relative;
        width: 96px;
        height: 52px;
        border-radius: 26px;
        background: #3a4560;
      }
      .sw i {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
      }
      .stamp {
        padding: 14px 40px;
        border: 12px solid var(--red);
        border-radius: 22px;
        color: var(--red);
        font-weight: 900;
        font-size: 104px;
        letter-spacing: 0.04em;
        background: rgba(255, 255, 255, 0.86);
        white-space: nowrap;
      }
      .burst {
        display: grid;
        place-items: center;
        width: 330px;
        height: 330px;
        color: var(--ink);
        font-weight: 900;
        font-size: 64px;
        text-align: center;
        line-height: 0.95;
        background: var(--yellow);
        clip-path: polygon(50% 0%, 61% 18%, 82% 8%, 80% 30%, 100% 36%, 86% 52%, 100% 68%, 79% 72%, 82% 94%, 61% 84%, 50% 100%, 39% 84%, 18% 94%, 21% 72%, 0% 68%, 14% 52%, 0% 36%, 20% 30%, 18% 8%, 39% 18%);
      }
      .pill {
        height: 76px;
        padding: 0 32px;
        border-radius: 38px;
        font-weight: 900;
        font-size: 36px;
        letter-spacing: 0.1em;
        line-height: 76px;
        white-space: nowrap;
      }
      .ov {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        mix-blend-mode: screen;
      }
      html[data-mode="green"] .ov {
        display: none;
      }
      #rw {
        position: absolute;
        inset: 0;
        visibility: hidden;
        background: transparent;
      }
      #rw-t {
        position: absolute;
        left: 0;
        right: 0;
        top: 820px;
        text-align: center;
        font-weight: 900;
        font-size: 92px;
        white-space: nowrap;
        color: #fff;
        letter-spacing: -0.02em;
        -webkit-text-stroke: 12px #0b1428;
        paint-order: stroke fill;
      }
      #rw-s {
        position: absolute;
        left: 0;
        right: 0;
        top: 970px;
        text-align: center;
        font-weight: 800;
        font-size: 44px;
        color: var(--yellow);
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.95" data-width="1080" data-height="1920">
      <div id="zoom">
        <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="45.95" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="voice" src="assets/footage.mp4" data-start="0" data-duration="45.95" data-track-index="10" data-volume="1"></audio>

      <div id="stage" class="clip" data-start="0" data-duration="45.95" data-track-index="1">

        <div id="caps"></div>
      </div>

      <!-- a few SFX only -->
      <audio id="sx1" src="assets/sfx/whoosh.wav" data-start="5.2" data-duration="0.57" data-track-index="20" data-volume="0.3"></audio>
      <audio id="sx2" src="assets/sfx/ding.wav" data-start="9.48" data-duration="1.2" data-track-index="21" data-volume="0.2"></audio>
      <audio id="sx3" src="assets/sfx/swoosh.wav" data-start="13.94" data-duration="0.5" data-track-index="22" data-volume="0.3"></audio>
      <audio id="sx4" src="assets/sfx/whoosh.wav" data-start="19.94" data-duration="0.57" data-track-index="20" data-volume="0.25"></audio>
      <audio id="sx5" src="assets/sfx/ding.wav" data-start="29.16" data-duration="1.2" data-track-index="21" data-volume="0.2"></audio>
      <audio id="sx6" src="assets/sfx/stamp.wav" data-start="36.68" data-duration="0.35" data-track-index="23" data-volume="0.45"></audio>
      <audio id="sx7" src="assets/sfx/pop.wav" data-start="45.22" data-duration="0.3" data-track-index="24" data-volume="0.35"></audio>
    </div>

    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

        // ---------- captions: [who, start, end, lead [[w,t]], big [word,t,hot?] | null, tail [text,t] | null, anim] ----------
        const G = [
          ["M", 5.3, 6.95, [["¿ya", 5.36], ["reclamó", 5.7], ["usted", 6.18], ["el", 6.34]], ["dinero", 6.62, 1], null, "pop"],
          ["M", 6.97, 8.1, [["por", 6.97], ["el", 7.0]], ["accidente", 7.14], ["de tránsito?", 7.58], "slide"],
          ["M", 8.12, 9.76, [["¿sabía", 8.14], ["usted", 8.74], ["que", 9.14], ["el", 9.3]], ["SOAT", 9.48, 1], null, "flip"],
          ["M", 9.78, 10.75, [["paga", 9.8], ["una", 10.0]], ["indemnización", 10.24], null, "pop"],
          ["M", 10.77, 12.28, [["por", 10.78]], ["incapacidad", 10.96, 1], ["permanente?", 11.68], "slide"],
          ["M", 12.3, 13.16, [["lo", 12.32], ["voy", 12.42], ["a", 12.5]], ["explicar", 12.64], null, "bounce"],
          ["M", 13.18, 15.82, [["el", 13.2], ["SOAT,", 13.4], ["que", 13.62], ["es", 13.7], ["el", 13.78]], ["Seguro Obligatorio", 13.94], ["de Accidentes de Tránsito", 14.94], "type"],
          ["M", 15.84, 18.62, [["le", 15.86], ["cubre", 16.08], ["a", 16.3]], ["todas las personas", 16.52], ["involucradas en el accidente", 17.46], "slide"],
          ["M", 18.64, 19.92, [["ya", 18.7], ["me", 18.8], ["refiero", 18.9], ["a", 19.26]], ["todo", 19.44], null, "pop"],
          ["M", 19.94, 20.42, [], ["conductor", 19.96], null, "pop"],
          ["M", 20.42, 21.3, [], ["pasajero", 20.44], null, "flip"],
          ["M", 21.3, 22.06, [], ["acompañante", 21.34], null, "slide"],
          ["M", 22.06, 22.62, [], ["ciclista", 22.1], null, "pop"],
          ["M", 22.62, 23.9, [], ["motociclista", 22.64], null, "bounce"],
          ["M", 23.92, 26.9, [["absolutamente", 23.96], ["a", 24.4]], ["todas las personas", 24.7, 1], ["involucradas en el accidente", 25.84], "type"],
          ["M", 27.4, 28.5, [], ["requisitos", 27.48], null, "flip"],
          ["M", 28.52, 30.0, [["tenemos", 28.54], ["hasta", 28.78]], ["18 meses", 29.16, 1], null, "pop"],
          ["M", 30.0, 32.15, [["contados", 30.0], ["a", 30.5], ["partir", 30.7], ["del", 30.96]], ["accidente", 31.22], ["de tránsito", 31.62], "slide"],
          ["M", 32.18, 33.9, [["para", 32.2], ["solicitar", 32.62], ["la", 33.14]], ["reclamación", 33.34], null, "pop"],
          ["M", 33.9, 35.2, [["y", 33.92], ["algo", 34.16], ["muy", 34.36]], ["importante", 34.78], null, "bounce"],
          ["M", 35.22, 37.0, [["el", 35.24], ["SOAT", 35.54], ["tuvo", 35.88], ["que", 36.04], ["haber", 36.16], ["estado", 36.4]], ["vigente", 36.68, 1], null, "flip"],
          ["M", 37.0, 38.1, [["en", 37.04], ["el", 37.12], ["momento", 37.28], ["del", 37.52]], ["accidente", 37.72], null, "slide"],
          ["M", 38.1, 38.86, [["mis", 38.12]], ["muchachos", 38.34], null, "pop"],
          ["M", 38.88, 41.25, [["si", 38.9], ["todavía", 39.32], ["están", 39.62], ["dentro", 39.98], ["del", 40.16]], ["tiempo establecido", 40.42], null, "type"],
          ["M", 41.27, 43.2, [["y", 41.28], ["no", 41.38], ["han", 41.44], ["iniciado", 41.68], ["la", 41.92]], ["reclamación", 42.08], ["ante el SOAT", 42.6], "slide"],
          ["M", 43.22, 44.98, [["con", 43.26], ["mucho", 43.6], ["gusto", 43.9], ["nosotros", 44.08]], ["los acompañamos", 44.34], null, "pop"],
          ["M", 45.0, 45.95, [], ["contáctenos", 45.22, 1], null, "bounce"],
        ];
        const caps = $("#caps");
        G.forEach(([who, a, b, lead, big, tail, anim]) => {
          const g = document.createElement("div");
          g.className = "cg " + who;
          const sm = document.createElement("div");
          sm.className = "sm";
          const leadEls = lead.map(([w, t]) => {
            const s = document.createElement("span");
            s.textContent = w;
            sm.appendChild(s);
            return [s, t];
          });
          g.appendChild(sm);
          let bg = null;
          let tn = null;
          if (big) {
            bg = document.createElement("div");
            bg.className = "bg" + (big[2] ? " hot" : "");
            // long keywords shrink so they always fit on one line
            if (big[0].length > 11) bg.style.fontSize = Math.round(Math.min(124, 1500 / big[0].length)) + "px";
            if (anim === "type") {
              [...big[0]].forEach((ch) => {
                const c = document.createElement("span");
                c.className = "c";
                c.textContent = ch === " " ? " " : ch;
                bg.appendChild(c);
              });
            } else bg.textContent = big[0];
            g.appendChild(bg);
          }
          if (tail) {
            tn = document.createElement("div");
            tn.className = "tn";
            tn.textContent = tail[0];
            g.appendChild(tn);
          }
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          leadEls.forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, Math.max(a, t)));
          if (bg) {
            const t = Math.max(a, big[1]);
            if (anim === "pop") tl.fromTo(bg, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.8)" }, t);
            else if (anim === "flip") tl.fromTo(bg, { rotationX: -95, opacity: 0, y: 20 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t);
            else if (anim === "slide") tl.fromTo(bg, { yPercent: 70, clipPath: "inset(0 -5% 100% -5%)" }, { yPercent: 0, clipPath: "inset(-15% -5% -15% -5%)", duration: 0.45, ease: "expo.out" }, t);
            else if (anim === "bounce") tl.fromTo(bg, { y: -200, scale: 1.3, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, t);
            else if (anim === "type") tl.fromTo(bg.querySelectorAll(".c"), { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.035 }, t);
            tl.to(bg, { scale: 1.04, duration: Math.max(0.2, b - t - 0.6), ease: "none" }, t + 0.5);
          }
          if (tn) tl.fromTo(tn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, tail[1]);
          if (b < 89.7) tl.set(g, { visibility: "hidden" }, b);
        });

        // ---------- camera: comedic punch-ins on the reactions ----------
        // [t, scale, origin, hold]
        const P = [
          [9.48, 1.1, "50% 30%", 1.6], [27.48, 1.12, "50% 30%", 1.0], [34.78, 1.12, "50% 30%", 1.2], [44.34, 1.08, "50% 30%", 1.5],
        ];
        P.forEach(([t, s, o, hold]) => {
          tl.set("#zoom", { transformOrigin: o }, t)
            .fromTo("#zoom", { scale: 1 }, { scale: s, duration: 0.18, ease: "power4.out" }, t)
            .to("#zoom", { scale: s + 0.04, duration: hold - 0.4, ease: "none" }, t + 0.18)
            .to("#zoom", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + hold - 0.2);
        });

        const show = (id, a, b) => {
          tl.set(id, { visibility: "visible" }, a);
          tl.set(id, { visibility: "hidden" }, b);
        };
        const pop = (sel, t, from = { scale: 0 }, d = 0.45, ease = "back.out(2.6)") =>
          tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: d, ease }, t);
        const slam = (sel, t, rot = -8) => {
          tl.fromTo(sel, { scale: 3, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo(sel, { y: 0 }, { y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.25);
        };

        tl.set({}, {}, 45.95);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
