        font-style: normal;

      @font-face {
        font-family: "Montserrat";

        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      :root {
        --white: #ffffff;
        --blue: #1f4fff;
        --navy: #0b1f66;
        --sky: #7d9bff;
        --mist: #e3eaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--white);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--white);
        font-family: "Montserrat", sans-serif;
        color: var(--navy);
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- shared ---------- */
      .mask {
        display: block;
        overflow: hidden;
        padding: 0 16px;
        margin: 0 -16px;
      }
      .mask > span,
      .mask > div {
        display: block;
      }
      .layer {
        position: absolute;
        left: 90px;
        right: 90px;
      }
      .icon {
        position: absolute;
        display: block;
        overflow: visible;
      }
      .sm {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 60px;
        line-height: 1.25;
        color: var(--navy);
      }

      /* ---------- vector transitions ---------- */
      .iris {
        position: absolute;
        width: 3400px;
        height: 3400px;
        left: -870px; /* centred on the coin (≈ 830, 560) */
        top: -1140px;
        border-radius: 50%;
      }
      #iris-blue {
        background: var(--blue);
      }
      #iris-white {
        background: var(--white);
      }
      .band {
        position: absolute;
        left: -500px;
        width: 2080px;
        border-radius: 999px;
      }
      #band-a {
        top: 820px;
        height: 170px;
        background: var(--blue);
      }
      #band-b {
        top: 1010px;
        height: 90px;
        background: var(--sky);
      }
      #band-c {
        top: 730px;
        height: 60px;
        background: var(--navy);
      }
      #panel {
        position: absolute;
        top: -200px;
        left: 0;
        width: 420px;
        height: 2320px;
        background: var(--blue);
      }
      #panel-thin {
        position: absolute;
        top: -200px;
        left: 0;
        width: 70px;
        height: 2320px;
        background: var(--sky);
      }

      /* ---------- continuity accents ---------- */
      #acc-dots {
        position: absolute;
        left: 90px;
        top: 290px;
        width: 170px;
        height: 90px;
      }
      #acc-ring {
        position: absolute;
        left: 880px;
        top: 1500px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 10px solid var(--blue);
      }

      /* ---------- S1 · ¿Cómo son tus aportes? ---------- */
      #s1 {
        top: 620px;
      }
      #s1-a {
        font-weight: 500;
        font-size: 96px;
        line-height: 1.1;
        color: var(--navy);
        transform-origin: 0% 50%;
      }
      #s1-b {
        font-weight: 300;
        font-style: italic;
        font-size: 104px;
        line-height: 1.1;
        color: var(--blue);
        transform-origin: 0% 50%;
      }
      #s1-c {
        font-weight: 900;
        font-size: 166px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--blue);
        transform-origin: 0% 60%;
      }
      #coin-wrap {
        position: absolute;
        left: 760px;
        top: 450px;
        width: 150px;
        height: 150px;
      }
      #coin {
        position: absolute;
        inset: 0;
        width: 150px;
        height: 150px;
        overflow: visible;
      }
      .coin-rip {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 6px solid var(--blue);
      }

      /* ---------- S2 · EN SALUD CERO PESOS ---------- */
      #s2-top {
        top: 430px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #cross {
        position: relative;
        flex: none;
        width: 96px;
        height: 96px;
      }
      #s2-lbl {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 66px;
        letter-spacing: 0.16em;

      #s2-big {
        top: 600px;

        flex-direction: column;
        align-items: center;

        line-height: 0.95;
        letter-spacing: -0.05em;

        width: 620px;
        height: 22px;

        background: var(--blue);

      /* ---------- S3 · En pensión ---------- */

        top: 330px;
        transform-origin: 0% 0%;
      }
      #pen-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #pen {
        font-weight: 300;
        font-style: italic;
        font-size: 124px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--blue);
      }
      #clock {
        flex: none;
        width: 150px;
        height: 150px;
        overflow: visible;
      }
      #cotizas {
        font-weight: 800;
        font-size: 112px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--navy);
        margin-top: 40px;
      }
      #porsem {
        font-weight: 900;
        font-size: 136px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--blue);
      }
      #s3b {
        top: 760px;
      }
      #num-wrap {
        position: relative;
        margin: 14px 0 18px;
      }
      #hl {
        position: absolute;
        left: -24px;
        top: 16px;
        width: 760px;
        height: 250px;
        border-radius: 24px;
        background: var(--mist);
      }
      #numero {
        position: relative;
        font-weight: 900;
        font-size: 140px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--blue);
      }
      #desem {
        position: relative;
        font-weight: 800;
        font-size: 108px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--blue);
      }
      #enmes {
        font-weight: 800;
        font-style: italic;
        font-size: 112px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--navy);
      }
      #mes-bar {
        width: 470px;
        height: 16px;
        border-radius: 8px;
        background: var(--blue);
        margin-top: 10px;
      }

      /* ---------- S4 · Y EN ARL ---------- */
      #s4a {
        top: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 0%;
      }

        font-size: 88px;

        letter-spacing: 0.02em;

      #dias {

        font-size: 196px;

        font-style: italic;

      #tiempo {

        font-size: 104px;

        color: var(--blue);

        gap: 36px;
        margin-top: 60px;

        width: 140px;
        height: 160px;

      #listo {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 110px;

        border-radius: 55px;
        background: var(--blue);

        font-weight: 700;
        font-style: italic;
        font-size: 60px;
      }
      #listo svg {
        width: 50px;
        height: 50px;
        overflow: visible;
      }

      <audio id="sfx-38" src="assets/sfx/click.wav" data-start="12.1" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-39" src="assets/sfx/pop-high.wav" data-start="12.35" data-duration="0.07" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-40" src="assets/sfx/click.wav" data-start="12.6" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-41" src="assets/sfx/pop.wav" data-start="13.0" data-duration="0.09" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-42" src="assets/sfx/confirm.wav" data-start="13.35" data-duration="0.5" data-track-index="16" data-volume="0.8"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

      // ---------- initial states ----------
      gsap.set(".iris", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(".band", { xPercent: -115, rotation: -26, transformOrigin: "50% 50%" });
      gsap.set(["#panel", "#panel-thin"], { x: -700, skewX: -14 });
      gsap.set(["#s2-top", "#s2-big", "#s3a", "#s3b", "#s4a", "#s4b"], { autoAlpha: 0 });
      gsap.set(["#coin", "#cross", "#clock", "#shield"], { transformOrigin: "50% 50%" });
      gsap.set(["#hand-m", "#hand-h"], { svgOrigin: "75 75" });
      gsap.set(".coin-rip", { opacity: 0 });

      // =====================================================
      // S1 · 0 – 3 s   ¿Cómo son / tus / aportes?
      // =====================================================
      tl.fromTo("#s1", { y: 140 }, { y: -30, duration: 2.6, ease: "power1.out" }, 0)
        .fromTo("#s1-a", { yPercent: 110 }, { yPercent: 0, duration: 0.45 }, 0.1)
        .fromTo("#acc-dots", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5 }, 0.1)
        .fromTo("#coin", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.6)" }, 0.35)
        .fromTo("#s1-b", { yPercent: 110 }, { yPercent: 0, duration: 0.45 }, 0.6)
        .fromTo("#s1-c", { scale: 0.5, x: -60, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, 0.85)
        .fromTo("#acc-ring", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.9)
        // "¿Cómo son tus" steps back so "aportes?" is the focus
        .to(["#s1-a", "#s1-b"], { scale: 0.74, opacity: 0.55, duration: 0.5, ease: "power3.out" }, 1.2)
        .to("#s1-c", { scale: 1.06, duration: 1.2, ease: "sine.inOut" }, 1.4);
      // coin pulses (synced with pop-high)
      [1.6, 2.1].forEach((t, i) => {
        tl.to("#coin", { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, t)
          .fromTo(`#crip${i + 1}`, { scale: 1, opacity: 0.8 }, { scale: 1.9, opacity: 0, duration: 0.5, ease: "power2.out" }, t);
      });

      // exit S1 + iris mask from the coin
      tl.to(["#s1-a", "#s1-b", "#s1-c"], { x: -1150, duration: 0.24, ease: "power3.in", stagger: 0.04 }, 2.55)
        .to("#coin", { scale: 1.25, duration: 0.1, ease: "power2.out" }, 2.55)
        .to("#coin", { scale: 0, duration: 0.14, ease: "power3.in" }, 2.66)
        .to("#iris-blue", { scale: 1, duration: 0.24, ease: "power3.in" }, 2.62)
        .to("#iris-white", { scale: 1, duration: 0.28, ease: "power3.out" }, 2.84)
        .set("#s1", { autoAlpha: 0 }, 2.9)
        .to("#acc-dots", { x: 650, y: 1240, duration: 0.55, ease: "expo.inOut" }, 2.62)
        .to("#acc-ring", { x: -60, y: -1180, duration: 0.55, ease: "expo.inOut" }, 2.62);

      // =====================================================
      // S2 · 3 – 6 s   EN SALUD → CERO PESOS
      // =====================================================
      tl.set(["#s2-top", "#s2-big"], { autoAlpha: 1 }, 3.0)
        .fromTo("#s2-lbl", { yPercent: 110 }, { yPercent: 0, duration: 0.45 }, 3.05)
        .fromTo("#cross", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.8)" }, 3.1)
        .fromTo("#cero", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 3.3)
        .fromTo("#s2-big", { y: 0 }, { y: 14, duration: 0.05, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.34)
        .fromTo("#pesos", { yPercent: 100 }, { yPercent: 0, duration: 0.45 }, 3.55)
        .fromTo("#pesos-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5 }, 3.7)
        .to(["#cero", "#pesos"], { scale: 1.06, duration: 1.5, ease: "sine.inOut" }, 3.9)
        .to("#cross", { scale: 1.25, rotation: 90, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 4.4)
        .to("#s2-top", { x: 40, duration: 1.0, ease: "sine.inOut" }, 4.4);

      // exit S2 — slide out in opposite directions + band sweep
      tl.to("#s2-top", { y: -260, opacity: 0, duration: 0.22, ease: "power3.in" }, 5.5)
        .to("#cero", { x: -1200, duration: 0.24, ease: "power3.in" }, 5.52)
        .to("#pesos", { x: 1200, duration: 0.24, ease: "power3.in" }, 5.55)
        .to("#pesos-bar", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.2, ease: "power2.in" }, 5.52)
        .to("#band-b", { xPercent: 115, duration: 0.45, ease: "power3.inOut" }, 5.5)
        .to("#band-a", { xPercent: 115, duration: 0.45, ease: "power3.inOut" }, 5.55)
        .to("#band-c", { xPercent: 115, duration: 0.45, ease: "power3.inOut" }, 5.6)
        .set(["#s2-top", "#s2-big"], { autoAlpha: 0 }, 5.85)
        .to("#acc-dots", { x: 650, y: 1300, duration: 0.5, ease: "expo.inOut" }, 5.6)
        .to("#acc-ring", { x: -780, y: -60, duration: 0.5, ease: "expo.inOut" }, 5.6);

      // =====================================================
      // S3 · 6 – 10 s   En pensión cotizas por semana → de acuerdo al número de semanas que has trabajado en el mes
      // =====================================================
      tl.set("#s3a", { autoAlpha: 1, y: 330 }, 6.0)
        .fromTo("#pen", { x: -440 }, { x: 0, duration: 0.5 }, 6.1)
        .fromTo("#clock", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 6.2)
        .fromTo("#cotizas", { yPercent: 110 }, { yPercent: 0, duration: 0.45 }, 6.5)
        .fromTo("#porsem", { scale: 0.5, opacity: 0, transformOrigin: "0% 60%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.9)" }, 6.65)
        // block rises and yields the lower half
        .to("#s3a", { y: 0, scale: 0.72, duration: 0.55, ease: "expo.inOut" }, 7.72)
        .set("#s3b", { autoAlpha: 1 }, 7.9)
        .fromTo("#s3-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 8.0)
        .fromTo("#numero", { yPercent: 105 }, { yPercent: 0, duration: 0.45 }, 8.2)
        .fromTo("#desem", { yPercent: 105 }, { yPercent: 0, duration: 0.45 }, 8.3)
        .fromTo("#hl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.inOut" }, 8.22)
        .fromTo("#s3-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 8.7)
        .fromTo("#enmes", { x: -300, yPercent: 100 }, { x: 0, yPercent: 0, duration: 0.45 }, 8.95)
        .fromTo("#mes-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45 }, 9.05);
      // clock ticks (synced with tick SFX)
      [6.8, 7.15, 7.5, 7.85, 8.2, 8.55, 8.9, 9.25].forEach((t, i) => {
        tl.to("#hand-m", { rotation: 45 * (i + 1), duration: 0.1, ease: "back.out(3)" }, t)
          .to("#hand-h", { rotation: 8 * (i + 1), duration: 0.1, ease: "back.out(3)" }, t);
      });

      // exit S3 — push up + panel wipe
      tl.to(["#s3a", "#s3b"], { y: "-=520", opacity: 0, duration: 0.24, ease: "power3.in", stagger: 0.04 }, 9.55)
        .to("#panel-thin", { x: 1300, duration: 0.42, ease: "power3.inOut" }, 9.52)
        .to("#panel", { x: 1300, duration: 0.42, ease: "power3.inOut" }, 9.56)
        .set(["#s3a", "#s3b"], { autoAlpha: 0 }, 9.9)
        .to("#acc-dots", { x: 650, y: 1300, duration: 0.5, ease: "expo.inOut" }, 9.6)
        .to("#acc-ring", { x: -780, y: 0, duration: 0.5, ease: "expo.inOut" }, 9.6);

      // =====================================================
      // S4 · 10 – 14 s   Y EN ARL → APORTAS 30 DÍAS → mes completo → así estarás protegido todo el tiempo → y listo
      // =====================================================
      const days = { v: 0 };
      tl.set("#s4a", { autoAlpha: 1, y: 330 }, 10.0)
        .fromTo("#arl", { x: 520 }, { x: 0, duration: 0.45 }, 10.05)
        .fromTo("#aportas", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 10.35)
        .fromTo("#dias", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" }, 10.55)
        .fromTo(days, { v: 1 }, {
          v: 30,
          duration: 0.6,
          ease: "power3.out",
          onUpdate: () => (document.getElementById("dias-n").textContent = Math.round(days.v)),
        }, 10.55)
        .fromTo("#mes", { x: -320, yPercent: 100 }, { x: 0, yPercent: 0, duration: 0.45 }, 11.3)
        .to("#dias", { scale: 1.05, duration: 0.5, ease: "sine.inOut" }, 11.2)
        // regroup: the ARL block rises and yields the bottom to the closing line
        .to("#s4a", { y: 0, scale: 0.8, duration: 0.5, ease: "expo.inOut" }, 11.9)
        .set("#s4b", { autoAlpha: 1 }, 12.0)
        .fromTo("#asi", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 12.1)
        .fromTo("#prot", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 12.35)
        .fromTo("#tiempo", { yPercent: 105 }, { yPercent: 0, duration: 0.4 }, 12.6)
        .fromTo("#shield", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, 13.0)
        .to("#shield-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.25, ease: "power2.out" }, 13.15)
        .fromTo("#listo", { scale: 0, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, 13.35)
        .to("#shield", { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 13.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
