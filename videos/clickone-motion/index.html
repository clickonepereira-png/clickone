<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      :root {
        --white: #ffffff;
        --blue: #1f4fff;
        --navy: #0b1f66;
        --sky: #7d9bff;
        --mist: #e3eaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--white);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--white);
        font-family: "Montserrat", sans-serif;
        color: var(--navy);
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- shared ---------- */
      .mask {
        display: block;
        overflow: hidden;
        padding: 0 16px;
        margin: 0 -16px;
      }
      .mask > span,
      .mask > div {
        display: block;
      }
      .layer {
        position: absolute;
        left: 90px;
        right: 90px;
      }
      .icon {
        position: absolute;
        display: block;
        overflow: visible;
      }

      /* ---------- vector transitions ---------- */
      .iris {
        position: absolute;
        width: 3400px;
        height: 3400px;
        left: -870px; /* centred on the coin (≈ 830, 560) */
        top: -1140px;
        border-radius: 50%;
      }
      #iris-blue {
        background: var(--blue);
      }
      #iris-white {
        background: var(--white);
      }
      .band {
        position: absolute;
        left: -500px;
        width: 2080px;
        border-radius: 999px;
      }
      #band-a {
        top: 820px;
        height: 170px;
        background: var(--blue);
      }
      #band-b {
        top: 1010px;
        height: 90px;
        background: var(--sky);
      }
      #band-c {
        top: 730px;
        height: 60px;
        background: var(--navy);
      }
      #panel {
        position: absolute;
        top: -200px;
        left: 0;
        width: 420px;
        height: 2320px;
        background: var(--blue);
      }
      #panel-thin {
        position: absolute;
        top: -200px;
        left: 0;
        width: 70px;
        height: 2320px;
        background: var(--sky);
      }

      /* ---------- continuity accents ---------- */
      #acc-dots {
        position: absolute;
        left: 90px;
        top: 290px;
        width: 170px;
        height: 90px;
      }
      #acc-ring {
        position: absolute;
        left: 880px;
        top: 1500px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 10px solid var(--blue);
      }

      /* ---------- S1 · ¿Y cómo funcionan los aportes? ---------- */
      #s1 {
        top: 600px;
      }
      #s1-a {
        font-weight: 500;
        font-size: 92px;
        line-height: 1.1;
        color: var(--navy);
        transform-origin: 0% 50%;
      }
      #s1-b {
        font-weight: 600;
        font-size: 78px;
        line-height: 1.15;
        margin-top: 26px;
        color: var(--navy);
      }
      #s1-c {
        font-weight: 900;
        font-size: 158px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--blue);
        transform-origin: 0% 60%;
      }
      #coin {
        left: 760px;
        top: 450px;
        width: 150px;
        height: 150px;
      }

      /* ---------- S2 · EN SALUD CERO PESOS ---------- */
      #s2-top {
        top: 430px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #cross {
        position: relative;
        flex: none;
        width: 96px;
        height: 96px;
      }
      #s2-lbl {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 66px;
        letter-spacing: 0.16em;
        color: var(--blue);
      }
      #s2-big {
        top: 600px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #cero {
        font-weight: 900;
        font-size: 300px;
        line-height: 0.95;
        letter-spacing: -0.05em;
        color: var(--navy);
      }
      #pesos {

      #pesos-bar {
        width: 620px;
        height: 22px;

        background: var(--blue);

      }

      /* ---------- S3 · En pensión ---------- */
      #s3 {
        top: 470px;
      }
      #pen {
        font-weight: 300;
        font-style: italic;
        font-size: 124px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--blue);
      }
      #clock {
        left: 800px;
        top: 440px;
        width: 150px;
        height: 150px;
      }
      #p-body {
        max-width: 820px;
        margin-top: 70px;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 60px;
        line-height: 1.3;
        color: var(--navy);
      }
      #p-body .w {
        display: inline-block;
        margin-right: 0.26em;
      }
      #sem-wrap {
        position: relative;
        margin-top: 30px;
      }
      #hl {
        position: absolute;
        left: -24px;
        top: 34px;
        width: 860px;
        height: 250px;
        border-radius: 24px;
        background: var(--mist);
      }
      #sem {
        position: relative;
        font-weight: 900;
        font-size: 150px;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--blue);
      }
      #trab {
        position: relative;
        font-weight: 900;
        font-style: italic;
        font-size: 124px;
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: var(--navy);
      }

      /* ---------- S4 · Y EN ARL ---------- */
      #s4a {
        top: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 0%;
      }
      #arl {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 70px;
        letter-spacing: 0.18em;
        color: var(--blue);
      }
      #aportas {
        font-weight: 700;
        font-size: 88px;
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: var(--navy);
        margin-top: 24px;
      }
      #dias {
        font-weight: 900;
        font-size: 196px;
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--blue);
      }
      #mes {
        font-weight: 800;
        font-style: italic;
        font-size: 116px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--navy);
      }
      #s4b {
        top: 850px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #asi {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 58px;
        color: var(--navy);
      }
      #prot {
        font-weight: 900;
        font-size: 172px;

        letter-spacing: -0.045em;
        color: var(--blue);
      }
      #tiempo {
        font-weight: 800;
        font-size: 104px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--blue);
      }
      #end-row {
        display: flex;
        align-items: center;
        gap: 36px;
        margin-top: 60px;
      }
      #shield {
        position: relative;
        width: 140px;
        height: 160px;
      }
      #listo {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 110px;
        padding: 0 46px 0 36px;
        border-radius: 55px;
        background: var(--blue);
        color: var(--white);
        font-weight: 700;
        font-style: italic;
        font-size: 60px;
      }
      #listo svg {
        width: 50px;
        height: 50px;
        overflow: visible;
      }
    </style>
  </head>
  <body>

          <path
            d="M92 55 C88 47 81 44 74 44 C64 44 57 50 57 58 C57 76 93 70 93 90 C93 99 85 106 75 106 C66 106 59 102 56 94 M75 34 L75 116"
            fill="none"
            stroke="#fff"
            stroke-width="9"
            stroke-linecap="round"
          />
        </svg>

        <!-- iris mask transition S1 → S2 -->
        <div id="iris-blue" class="iris"></div>
        <div id="iris-white" class="iris"></div>

        <!-- continuity accents -->
        <svg id="acc-dots" viewBox="0 0 170 90" aria-hidden="true">
          <g fill="#7d9bff">
            <circle cx="10" cy="10" r="8" /><circle cx="60" cy="10" r="8" /><circle cx="110" cy="10" r="8" /><circle cx="160" cy="10" r="8" />
            <circle cx="10" cy="60" r="8" /><circle cx="60" cy="60" r="8" /><circle cx="110" cy="60" r="8" /><circle cx="160" cy="60" r="8" />
          </g>
        </svg>

        <!-- ============ S2 ============ -->
        <div id="s2-top" class="layer">

            <rect x="33" y="4" width="30" height="88" rx="9" fill="#1f4fff" /><rect x="4" y="33" width="88" height="30" rx="9" fill="#1f4fff" />
          </svg>
          <div class="mask"><span id="s2-lbl">EN SALUD</span></div>
        </div>
        <div id="s2-big" class="layer">
          <div class="mask"><span id="cero">CERO</span></div>
          <div class="mask"><span id="pesos">PESOS</span></div>
          <div id="pesos-bar"></div>
        </div>

        <!-- ============ S3 ============ -->
        <div id="s3" class="layer">
          <div class="mask"><span id="pen">En pensión</span></div>
          <div id="p-body">
            <span class="w">puedes</span><span class="w">cotizar</span><span class="w">de</span><span class="w">acuerdo</span><span class="w">con</span><span class="w">las</span>
          </div>
          <div id="sem-wrap">
            <div id="hl"></div>
            <div class="mask"><span id="sem">semanas</span></div>
            <div class="mask"><span id="trab">trabajadas.</span></div>
          </div>
        </div>
        <svg id="clock" class="icon" viewBox="0 0 150 150" aria-hidden="true">
          <circle cx="75" cy="75" r="64" fill="#fff" stroke="#1f4fff" stroke-width="11" />
          <g fill="#1f4fff">
            <circle cx="75" cy="24" r="5" /><circle cx="126" cy="75" r="5" /><circle cx="75" cy="126" r="5" /><circle cx="24" cy="75" r="5" />
          </g>
          <line id="hand-h" x1="75" y1="75" x2="75" y2="48" stroke="#0b1f66" stroke-width="10" stroke-linecap="round" />
          <line id="hand-m" x1="75" y1="75" x2="104" y2="75" stroke="#1f4fff" stroke-width="8" stroke-linecap="round" />
          <circle cx="75" cy="75" r="8" fill="#0b1f66" />
        </svg>

        <!-- band sweep S2 → S3 -->
        <div id="band-b" class="band"></div>
        <div id="band-a" class="band"></div>
        <div id="band-c" class="band"></div>

        <!-- ============ S4 ============ -->
        <div id="s4a" class="layer">
          <div class="mask"><span id="arl">Y EN ARL</span></div>
          <div class="mask"><span id="aportas">APORTAS</span></div>
          <div class="mask"><span id="dias">30 DÍAS</span></div>
          <div class="mask"><span id="mes">mes completo</span></div>
        </div>
        <div id="s4b" class="layer">
          <div class="mask"><span id="asi">así estarás</span></div>
          <div class="mask"><span id="prot">protegido</span></div>
          <div class="mask"><span id="tiempo">todo el tiempo</span></div>
          <div id="end-row">
            <svg id="shield" viewBox="0 0 140 160" aria-hidden="true">
              <path d="M70 6 L128 28 V76 C128 114 102 140 70 154 C38 140 12 114 12 76 V28 Z" fill="#1f4fff" />
              <path id="shield-check" d="M42 80 L62 100 L100 58" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
            </svg>
            <div id="listo">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <circle cx="25" cy="25" r="23" fill="#fff" />
                <path d="M14 26 L22 34 L36 17" fill="none" stroke="#1f4fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>y listo</span>
            </div>
          </div>
        </div>

        <!-- panel wipe S3 → S4 -->
        <div id="panel"></div>
        <div id="panel-thin"></div>
      </div>

      <!-- ============ SFX (synthesized: tools/make_sfx.py) ============ -->
      <audio id="sfx-01" src="assets/sfx/whoosh.wav" data-start="0" data-duration="0.32" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-02" src="assets/sfx/pop.wav" data-start="0.16" data-duration="0.09" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-03" src="assets/sfx/click.wav" data-start="0.3" data-duration="0.03" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-04" src="assets/sfx/whoosh-fast.wav" data-start="0.66" data-duration="0.22" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-05" src="assets/sfx/click.wav" data-start="0.88" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-06" src="assets/sfx/pop-high.wav" data-start="0.92" data-duration="0.07" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-07" src="assets/sfx/impact.wav" data-start="1.02" data-duration="0.4" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-08" src="assets/sfx/pop.wav" data-start="1.16" data-duration="0.09" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-09" src="assets/sfx/whoosh.wav" data-start="1.58" data-duration="0.32" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-10" src="assets/sfx/click.wav" data-start="1.8" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-11" src="assets/sfx/tick.wav" data-start="2" data-duration="0.025" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-12" src="assets/sfx/tick.wav" data-start="2.15" data-duration="0.025" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-13" src="assets/sfx/pop.wav" data-start="2.2" data-duration="0.09" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-14" src="assets/sfx/tick.wav" data-start="2.3" data-duration="0.025" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-15" src="assets/sfx/tick.wav" data-start="2.45" data-duration="0.025" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-16" src="assets/sfx/whoosh-fast.wav" data-start="2.6" data-duration="0.22" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-17" src="assets/sfx/click.wav" data-start="2.76" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-18" src="assets/sfx/impact.wav" data-start="2.92" data-duration="0.4" data-track-index="13" data-volume="0.85"></audio>
      <audio id="sfx-19" src="assets/sfx/pop.wav" data-start="3.1" data-duration="0.09" data-track-index="11" data-volume="0.75"></audio>
      <audio id="sfx-20" src="assets/sfx/whoosh-fast.wav" data-start="3.24" data-duration="0.22" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-21" src="assets/sfx/pop-high.wav" data-start="3.4" data-duration="0.07" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-22" src="assets/sfx/pop.wav" data-start="3.58" data-duration="0.09" data-track-index="15" data-volume="0.8"></audio>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

      // ---------- initial states ----------
      gsap.set(".iris", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(".band", { xPercent: -115, rotation: -26, transformOrigin: "50% 50%" });
      gsap.set(["#panel", "#panel-thin"], { x: -700, skewX: -14 });
      gsap.set(["#s2-top", "#s2-big", "#s3", "#clock", "#s4a", "#s4b"], { autoAlpha: 0 });
      gsap.set(["#coin", "#cross", "#clock", "#shield"], { transformOrigin: "50% 50%" });
      gsap.set(["#hand-m", "#hand-h"], { svgOrigin: "75 75" });

      // =====================================================
      // S1 · 0.00 – 0.80  "¿Y cómo" → "funcionan los aportes?"
      // =====================================================
      tl.fromTo("#s1", { y: 120 }, { y: 0, duration: 0.8, ease: "power2.out" }, 0)
        .fromTo("#s1-a", { yPercent: 110 }, { yPercent: 0, duration: 0.32 }, 0.02)
        .fromTo("#acc-dots", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4 }, 0.04)
        .fromTo("#coin", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.6)" }, 0.14)
        .fromTo("#s1-b", { yPercent: 110 }, { yPercent: 0, duration: 0.34 }, 0.24)
        .fromTo("#s1-c", { scale: 0.55, x: -60, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.42, ease: "back.out(1.7)" }, 0.3)
        // "¿Y cómo" steps back so "aportes?" becomes the focus
        .to("#s1-a", { scale: 0.72, opacity: 0.6, duration: 0.35, ease: "power3.out" }, 0.32)
        .fromTo("#acc-ring", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.34);

      // exit S1 + iris mask from the coin
      tl.to(["#s1-a", "#s1-b", "#s1-c"], { x: -1100, duration: 0.2, ease: "power3.in", stagger: 0.03 }, 0.64)
        .to("#coin", { scale: 1.25, duration: 0.1, ease: "power2.out" }, 0.64)
        .to("#coin", { scale: 0, duration: 0.12, ease: "power3.in" }, 0.74)
        .to("#iris-blue", { scale: 1, duration: 0.2, ease: "power3.in" }, 0.68)
        .to("#iris-white", { scale: 1, duration: 0.24, ease: "power3.out" }, 0.84)
        .set("#s1", { autoAlpha: 0 }, 0.88);

      // accents travel with the cut
      tl.to("#acc-dots", { x: 650, y: 1240, duration: 0.5, ease: "expo.inOut" }, 0.7)
        .to("#acc-ring", { x: -60, y: -1180, duration: 0.5, ease: "expo.inOut" }, 0.7);

      // =====================================================
      // S2 · 0.80 – 1.70  EN SALUD → CERO PESOS
      // =====================================================
      tl.set(["#s2-top", "#s2-big"], { autoAlpha: 1 }, 0.84)
        .fromTo("#s2-lbl", { yPercent: 110 }, { yPercent: 0, duration: 0.34 }, 0.86)
        .fromTo("#cross", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.8)" }, 0.9)
        .fromTo("#cero", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 1.0)
        .fromTo("#s2-big", { y: 0 }, { y: 14, duration: 0.05, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.04)
        .fromTo("#pesos", { yPercent: 100 }, { yPercent: 0, duration: 0.36 }, 1.14)
        .fromTo("#pesos-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.34 }, 1.22)
        .to(["#cero", "#pesos"], { scale: 1.05, duration: 0.26, ease: "sine.inOut" }, 1.3);

      // exit S2 — slide out in opposite directions
      tl.to("#s2-top", { y: -260, opacity: 0, duration: 0.18, ease: "power3.in" }, 1.56)
        .to("#cero", { x: -1200, duration: 0.2, ease: "power3.in" }, 1.58)
        .to("#pesos", { x: 1200, duration: 0.2, ease: "power3.in" }, 1.6)
        .to("#pesos-bar", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.16, ease: "power2.in" }, 1.58)
        .to("#band-b", { xPercent: 115, duration: 0.4, ease: "power3.inOut" }, 1.56)
        .to("#band-a", { xPercent: 115, duration: 0.4, ease: "power3.inOut" }, 1.6)
        .to("#band-c", { xPercent: 115, duration: 0.4, ease: "power3.inOut" }, 1.64)
        .set(["#s2-top", "#s2-big"], { autoAlpha: 0 }, 1.8);

      tl.to("#acc-dots", { x: 650, y: 60, duration: 0.45, ease: "expo.inOut" }, 1.6)
        .to("#acc-ring", { x: 0, y: -40, duration: 0.45, ease: "expo.inOut" }, 1.6);

      // =====================================================
      // S3 · 1.70 – 2.70  En pensión … semanas trabajadas.
      // =====================================================
      tl.set(["#s3", "#clock"], { autoAlpha: 1 }, 1.74)
        .fromTo("#pen", { x: -420 }, { x: 0, duration: 0.4 }, 1.76)
        .fromTo("#clock", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 1.82)
        .fromTo("#p-body .w", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.028 }, 1.9)
        .fromTo("#sem", { yPercent: 105 }, { yPercent: 0, duration: 0.36 }, 2.16)
        .fromTo("#trab", { yPercent: 105 }, { yPercent: 0, duration: 0.36 }, 2.24)
        .fromTo("#hl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.42, ease: "expo.inOut" }, 2.18);
      // clock ticks (synced with tick SFX)
      [2.0, 2.15, 2.3, 2.45].forEach((t, i) => {
        tl.to("#hand-m", { rotation: 90 * (i + 1), duration: 0.1, ease: "back.out(3)" }, t)
          .to("#hand-h", { rotation: 22 * (i + 1), duration: 0.1, ease: "back.out(3)" }, t);
      });

      // exit S3 — push up
      tl.to("#s3", { y: -520, opacity: 0, duration: 0.2, ease: "power3.in" }, 2.58)
        .to("#clock", { scale: 0, rotation: -90, duration: 0.16, ease: "power3.in" }, 2.58)
        .to("#panel-thin", { x: 1300, duration: 0.36, ease: "power3.inOut" }, 2.56)
        .to("#panel", { x: 1300, duration: 0.36, ease: "power3.inOut" }, 2.6)
        .set(["#s3", "#clock"], { autoAlpha: 0 }, 2.8);

      tl.to("#acc-dots", { x: 650, y: 1300, duration: 0.45, ease: "expo.inOut" }, 2.6)
        .to("#acc-ring", { x: -780, y: 0, duration: 0.45, ease: "expo.inOut" }, 2.6);

      // =====================================================
      // S4 · 2.70 – 4.00  Y EN ARL → 30 DÍAS → mes completo → protegido → y listo
      // =====================================================
      tl.set("#s4a", { autoAlpha: 1, y: 330 }, 2.7)
        .fromTo("#arl", { x: 520 }, { x: 0, duration: 0.34 }, 2.74)
        .fromTo("#aportas", { yPercent: 110 }, { yPercent: 0, duration: 0.3 }, 2.86)
        .fromTo("#dias", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, 2.9)
        .fromTo("#mes", { x: -300, yPercent: 100 }, { x: 0, yPercent: 0, duration: 0.34 }, 3.08)
        // regroup: the ARL block rises and yields the bottom to the closing line
        .to("#s4a", { y: 0, scale: 0.8, duration: 0.36, ease: "expo.inOut" }, 3.24)
        .set("#s4b", { autoAlpha: 1 }, 3.3)
        .fromTo("#asi", { yPercent: 110 }, { yPercent: 0, duration: 0.3 }, 3.32)
        .fromTo("#prot", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(2)" }, 3.38)
        .fromTo("#tiempo", { yPercent: 105 }, { yPercent: 0, duration: 0.3 }, 3.46)
        .fromTo("#shield", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, 3.56)
        .to("#shield-check", { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power2.out" }, 3.66)
        .fromTo("#listo", { scale: 0, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)" }, 3.72);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
