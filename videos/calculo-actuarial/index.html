      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);
        const NS = "http://www.w3.org/2000/svg";
        const rect = (parent, a) => {
          const r = document.createElementNS(NS, "rect");
          for (const k in a) r.setAttribute(k, a[k]);
          parent.appendChild(r);
          return r;
        };

        // ---------- static builds (deterministic) ----------
        document.querySelectorAll(".split").forEach((el) => {
          const t = el.textContent;
          el.textContent = "";
          for (const c of t) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c === " " ? " " : c;
            el.appendChild(s);
          }
        });
        // barcode
        const BARS = [3, 1, 2, 1, 4, 1, 1, 3, 2, 1, 1, 2, 3, 1, 2, 4, 1, 1, 2, 1, 3, 2, 1, 1, 3, 1, 2, 1, 1, 4, 2, 1, 3, 1];
        let bx = 0;
        BARS.forEach((w, i) => {
          if (i % 2 === 0) rect($("#bars"), { x: bx * 2.2, y: 0, width: w * 2.2, height: 54 });
          bx += w;
        });
        // calculator: screen digits (bars) + key grid
        [[250, 96], [296, 96], [342, 96]].forEach(([x, y], i) => rect($("#scr"), { id: "scr-" + i, x, y, width: 34, height: 52, rx: 6 }));
        rect($("#scr"), { x: 62, y: 70, width: 120, height: 14, rx: 7, fill: "#9fb0db" });
        for (let r = 0; r < 5; r++)
          for (let c = 0; c < 4; c++) {
            const op = c === 3;
            rect($("#keys"), {
              id: `key-${r}-${c}`,
              x: 36 + c * 88,
              y: 206 + r * 76,
              width: 72,
              height: 60,
              rx: 16,
              fill: op ? "#1f4fff" : r === 4 && c === 0 ? "#7d9bff" : "#2a3f96",
            });
          }
        // week slots: recorded weeks vs. gaps the employer left
        const GAPS = [1, 4, 7, 8, 11, 13];
        for (let k = 0; k < 15; k++) {
          const c = k % 5, r = Math.floor(k / 5);
          const s = document.createElement("div");
          s.className = "slot " + (GAPS.includes(k) ? "gap" : "rec");
          s.id = "slot-" + k;
          s.style.left = c * 172 + "px";
          s.style.top = r * 150 + "px";
          $("#slots").appendChild(s);
        }
        GAPS.forEach((k, i) => {
          const c = k % 5, r = Math.floor(k / 5);
          const f = document.createElement("div");
          f.className = "fill shadow";
          f.id = "fill-" + i;
          f.style.left = c * 172 + "px";
          f.style.top = r * 150 + "px";
          f.innerHTML = '<svg viewBox="0 0 64 64"><path d="M14 34 L27 47 L51 19" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          $("#slots").appendChild(f);
        });

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        const GHOST = "#8390b3";
        const ink = (sel, t, color, step = 0.12, ghost = GHOST) => {
          document.querySelectorAll(sel + " .rw").forEach((w, i) => {
            const c = w.dataset.ink || color;
            tl.fromTo(w, { opacity: 0, y: 26, color: ghost }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + i * step)
              .to(w, { color: c, duration: 0.25, ease: "power1.out" }, t + i * step + 0.14);
          });
        };
        const letters = (sel, t, from, stagger = 0.035, dur = 0.42) =>
          tl.fromTo(sel + " .ch", from, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: dur, stagger, ease: "expo.out" }, t);

        gsap.set(["#b2", "#b3", "#b4"], { autoAlpha: 0 });
        gsap.set("#bluebg", { yPercent: 100 });
        gsap.set(".fill", { opacity: 0 });
        gsap.set(".sym", { opacity: 0 });
        gsap.set("#sign1", { svgOrigin: "277 160" });
        gsap.set("#sign2", { svgOrigin: "277 364" });
        gsap.set("#omit-box", { clipPath: "inset(0% 100% 0% 0%)" });

        // =============== B1 · existe una ALTERNATIVA que se llama ===============
        tl.fromTo("#barcode", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5 }, 0)
          .fromTo("#grid1", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.8, ease: "expo.inOut" }, 0.1);
        ink("#existe", 0.1, "#0b1f66");
        letters("#alternativa", 0.36, { scale: 1.8, opacity: 0, filter: "blur(10px)" }, 0.035, 0.45);
        ink("#llama", 0.8, "#0b1f66");
        tl.fromTo("#pole-r", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45, ease: "expo.out" }, 0.95)
          .fromTo("#sign", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.95)
          .fromTo("#sign1", { rotation: 70, opacity: 0 }, { rotation: -8, opacity: 1, duration: 0.55, ease: "back.out(2.2)" }, 1.2)
          .fromTo("#sign2", { rotation: -70, opacity: 0 }, { rotation: 6, opacity: 1, duration: 0.55, ease: "back.out(2.2)" }, 1.42)
          .to("#sign1", { rotation: -14, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.8);
        tl.to("#b1", { scale: 1.14, opacity: 0, filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 2.1)
          .set("#b1", { autoAlpha: 0 }, 2.44);

        // =============== B2 · CÁLCULO ACTUARIAL ===============
        tl.set("#b2", { autoAlpha: 1 }, 2.38)
          .fromTo("#b2", { scale: 0.92, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 2.38);
        letters("#calculo", 2.46, { yPercent: 110 }, 0.035);
        letters("#actuarial", 2.66, { yPercent: 110 }, 0.03);
        tl.fromTo("#grid2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "expo.inOut" }, 2.8)
          .fromTo("#blk2", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45 }, 2.95)
          .fromTo("#calc", { x: 620, rotation: 30 }, { x: 0, rotation: 7, duration: 0.6, ease: "back.out(1.4)" }, 3.0);
        [0, 1, 2, 3, 4].forEach((i) => {
          tl.fromTo(`#sym-${i}`, { scale: 0, rotation: -60, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(3)" }, 3.2 + i * 0.1)
            .to(`#sym-${i}`, { y: -60, duration: 1.0, ease: "sine.inOut" }, 3.4 + i * 0.1);
        });
        // key presses + digits appearing on the screen
        [[1, 1], [2, 2], [3, 0], [0, 3]].forEach(([r, c], i) => {
          const t = 3.5 + i * 0.15;
          tl.to(`#key-${r}-${c}`, { attr: { fill: "#7d9bff" }, duration: 0.05, yoyo: true, repeat: 1 }, t);
          if (i < 3) tl.fromTo(`#scr-${i}`, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.14, ease: "back.out(3)" }, t);
        });
        tl.to("#calc", { scale: 1.05, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out" }, 4.1);
        tl.to("#b2", { y: -300, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 4.3)
          .set("#b2", { autoAlpha: 0 }, 4.64);

        // =============== B3 · el cálculo actuarial permite RECONOCER LAS SEMANAS ===============
        tl.set("#b3", { autoAlpha: 1 }, 4.62);
        ink("#b3-a", 4.68, "#0b1f66");
        ink("#permite", 5.05, "#0b1f66");
        letters("#reconocer", 5.2, { yPercent: 110 }, 0.035);
        letters("#lassemanas", 5.5, { yPercent: 110 }, 0.03);
        tl.fromTo("#grid3", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "expo.inOut" }, 5.45)
          .fromTo(".slot", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.025 }, 5.55)
          // the gaps blink: these are the omitted weeks
          .to(".slot.gap", { borderColor: "#1f4fff", duration: 0.12, yoyo: true, repeat: 3, ease: "none" }, 5.95);
        for (let i = 0; i < 6; i++) {
          tl.fromTo(`#fill-${i}`, { y: -220, scale: 1.3, rotation: i % 2 ? 12 : -12, opacity: 0 }, { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.36, ease: "back.out(2)" }, 6.2 + i * 0.14);
        }
        tl.to("#slots", { scale: 1.03, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 7.08);

        tl.to("#bluebg", { yPercent: -8, duration: 0.45, ease: "power3.inOut" }, 7.35)
          .to("#b3", { y: -220, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 7.37)
          .set("#b3", { autoAlpha: 0 }, 7.82)
          .to("#bars", { attr: { fill: "#ffffff" }, duration: 0.3 }, 7.55);

        // =============== B4 · que tu empleador OMITIÓ tu afiliación al SISTEMA DE SEGURIDAD SOCIAL ===============
        tl.set("#b4", { autoAlpha: 1 }, 7.72);
        ink("#empleador", 7.82, "#ffffff", 0.12, "#c3d0ff");
        letters("#omitio", 8.08, { scale: 1.8, opacity: 0, filter: "blur(10px)" }, 0.045, 0.45);
        tl.to("#omit-box", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" }, 8.35);
        ink("#afiliacion", 8.62, "#ffffff", 0.12, "#c3d0ff");
        letters("#sistema", 8.95, { yPercent: 110 }, 0.03);
        letters("#seguridad", 9.15, { yPercent: 110 }, 0.03);
        tl.fromTo("#card", { y: 900, rotation: -18, scale: 0.8 }, { y: 0, rotation: -3, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 9.45)
          .fromTo("#stamp", { scale: 2.4, rotation: -40, opacity: 0 }, { scale: 1, rotation: -12, opacity: 1, duration: 0.3, ease: "power4.in" }, 9.8)
          .to("#card", { y: 10, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 10.1)
          .to("#stamp", { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 10.2)
          .to("#card", { y: -14, rotation: -1, duration: 0.7, ease: "sine.inOut" }, 10.3);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
