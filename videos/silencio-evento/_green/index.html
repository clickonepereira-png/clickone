<!doctype html>
<html lang="es" data-mode="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Silencio para escuchar la vida — reel editado</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair";
        src: url("assets/fonts/playfair-display-latin-wght-normal.woff2") format("woff2");
        font-weight: 400 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Playfair";
        src: url("assets/fonts/playfair-display-latin-wght-italic.woff2") format("woff2");
        font-weight: 400 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-500-italic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
      }

      /* brand: Silencio para escuchar la vida */
      :root {
        --violet: #3b1f6e;
        --violet-2: #4b2a85;
        --ink: #2b1052;
        --lilac: #b9a3e3;
        --lilac-2: #e8defa;
        --glow: #c58bff;
        --gold: #e6b35a;
        --gold-2: #f7d58b;
        --cream: #f8f1e7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* green-screen export for CapCut "Chroma": no footage, flat key colour */
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #cam {
        display: none;
      }
      #cam {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- captions: Poppins + Playfair italic accents, hard ink outline (keys cleanly) ---------- */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
      }
      .inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 18px;
        text-align: center;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 60px;
        line-height: 1.3;
        color: #ffffff;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
      }
      .cw.kw {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 72px;
        color: var(--gold-2);
      }
      .cw.hero {
        flex-basis: 100%;
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 800;
        color: var(--gold-2);
        line-height: 1.05;
        -webkit-text-stroke: 16px var(--ink);
      }

      /* ---------- breathing light waves (poster's violet light ribbons) ---------- */
      #waves {
        position: absolute;
        left: 0;
        top: 1060px;
        width: 1080px;
        height: 300px;
        overflow: visible;
      }

      /* ---------- event pill (poster) ---------- */
      #pill {
        position: absolute;
        left: 50%;
        top: 230px;
        height: 156px;
        display: flex;
        align-items: center;
        border-radius: 78px;
        background: var(--cream);
        border: 5px solid var(--gold);
        overflow: hidden;
        white-space: nowrap;
      }
      .pi {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 40px;
        height: 100%;
      }
      .pi svg {
        width: 64px;
        height: 64px;
        flex: none;
      }
      .pi .t {
        font-family: "Playfair", serif;
        font-weight: 600;
        font-size: 44px;
        line-height: 1.08;
        color: var(--violet);
      }
      .pi .t i {
        font-style: italic;
        font-weight: 500;
      }
      #pdiv {
        width: 4px;
        height: 90px;
        border-radius: 2px;
        background: var(--lilac);
        flex: none;
      }
      #arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }

      /* ---------- ribbon transition ---------- */
      #ribbon {
        position: absolute;
        left: -500px;
        top: 760px;
        width: 2080px;
        height: 300px;
        border-radius: 150px;
        background: linear-gradient(90deg, var(--lilac-2) 0%, var(--lilac) 35%, var(--glow) 60%, var(--gold) 100%);
      }

      /* ---------- brand lockup card ---------- */
      #lock {
        position: absolute;
        left: 150px;
        top: 1120px;
        width: 780px;
        height: 500px;
        border-radius: 44px;
        background: var(--cream);
        border: 5px solid var(--gold);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .lw {
        display: block;
        font-family: "Playfair", serif;
        color: var(--violet-2);
      }
      #l-sil {
        font-weight: 800;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--violet);
      }
      #l-para {
        font-style: italic;
        font-weight: 500;
        font-size: 50px;
        line-height: 1.1;
      }
      #l-esc,
      #l-vida {
        font-style: italic;
        font-weight: 600;
        font-size: 90px;
        line-height: 1.02;
      }
      .spark {
        position: absolute;
        overflow: visible;
      }

      /* ---------- three pillars ---------- */
      #pillars {
        position: absolute;
        left: 80px;
        top: 1090px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }
      #p-label {
        font-family: "Poppins", sans-serif;
        font-style: italic;
        font-weight: 500;
        font-size: 50px;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        margin-left: 12px;
      }
      .pl {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 124px;
        padding: 0 44px 0 18px;
        border-radius: 62px;
        background: var(--cream);
        border: 4px solid var(--gold);
      }
      .pl .ic {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--violet);
        display: grid;
        place-items: center;
        flex: none;
      }
      .pl .ic svg {
        width: 56px;
        height: 56px;
      }
      .pl .t {
        font-family: "Playfair", serif;
        font-size: 58px;
        color: var(--violet);
        white-space: nowrap;
      }
      .pl .t b {
        font-weight: 700;
      }
      .pl .t i {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="20.2" data-track-index="0" muted playsinline></video>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="20.2" data-track-index="1">
        <!-- breathing waves -->
        <svg id="waves" viewBox="0 0 1080 300" aria-hidden="true">
          <path id="wv-1" d="M-40 150 C 120 40, 260 40, 400 150 S 680 260, 820 150 S 1040 40, 1120 120" fill="none" stroke="#c58bff" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
          <path id="wv-2" d="M-40 190 C 140 100, 280 110, 420 190 S 700 280, 840 190 S 1040 100, 1120 160" fill="none" stroke="#e8defa" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
          <path id="wv-3" d="M-40 110 C 100 20, 250 10, 380 110 S 660 220, 800 110 S 1040 10, 1120 80" fill="none" stroke="#b9a3e3" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        </svg>

        <!-- event pill: 24 de octubre | Hotel Sonesta, Pereira -->
        <div id="pill">
          <div class="pi" id="pi-date">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="8" y="12" width="48" height="44" rx="8" fill="none" stroke="#3b1f6e" stroke-width="4" />
              <path d="M8 26 H56 M20 6 V16 M44 6 V16" stroke="#3b1f6e" stroke-width="4" stroke-linecap="round" />
            </svg>
            <div class="t">24 de<br /><i>octubre</i></div>
          </div>
          <div id="pdiv"></div>
          <div class="pi" id="pi-loc">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 58 C32 58 12 38 12 24 C12 13 21 6 32 6 C43 6 52 13 52 24 C52 38 32 58 32 58 Z" fill="none" stroke="#3b1f6e" stroke-width="4" stroke-linejoin="round" />
              <circle cx="32" cy="24" r="7" fill="none" stroke="#3b1f6e" stroke-width="4" />
            </svg>
            <div class="t">Hotel Sonesta,<br /><i id="pereira">Pereira</i></div>
          </div>
        </div>
        <svg id="arrow" viewBox="0 0 1080 1920" aria-hidden="true">
          <path id="arr-path" d="M760 400 C 860 520, 820 640, 650 720" fill="none" stroke="#f7d58b" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 18" />
          <path id="arr-head" d="M690 690 L648 722 L700 734" fill="none" stroke="#f7d58b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <div id="caps"></div>

        <!-- brand lockup -->
        <div id="lock">
          <span class="lw" id="l-sil">Silencio</span>
          <span class="lw" id="l-para">para</span>
          <span class="lw" id="l-esc">escuchar</span>
          <span class="lw" id="l-vida">la vida.</span>
          <svg class="spark" id="sp-1" style="left: 640px; top: 40px; width: 60px; height: 60px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#e6b35a" /></svg>
          <svg class="spark" id="sp-2" style="left: 600px; top: 380px; width: 44px; height: 44px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#e6b35a" /></svg>
          <svg class="spark" id="sp-3" style="left: 90px; top: 70px; width: 34px; height: 34px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#b9a3e3" /></svg>
        </div>

        <!-- three pillars -->
        <div id="pillars">
          <span id="p-label">integramos</span>
          <div class="pl" id="pl-0">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M22 10 C14 10 10 16 11 22 C6 24 6 32 10 35 C8 41 13 46 19 45 C21 49 26 49 28 46 V12 C27 10 25 10 22 10 Z M34 10 C42 10 46 16 45 22 C50 24 50 32 46 35 C48 41 43 46 37 45 C35 49 30 49 28 46" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="t"><b>Neurociencia</b> <i>aplicada</i></span>
          </div>
          <div class="pl" id="pl-1">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M6 22 C14 14 22 14 30 22 S 44 30 50 22 M6 34 C14 26 22 26 30 34 S 44 42 50 34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="t"><b>Respiración</b> <i>consciente</i></span>
          </div>
          <div class="pl" id="pl-2">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M8 26 H48 C48 36 40 44 28 44 C16 44 8 36 8 26 Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" />
                <path d="M20 18 C20 14 24 14 24 10 M30 18 C30 14 34 14 34 10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
              </svg>
            </span>
            <span class="t"><b>Sonido</b></span>
          </div>
        </div>

        <div id="ribbon"></div>
      </div>

      <!-- ============ SFX: few and soft (tools/make_sfx.py) ============ -->
      <audio id="sfx-01" src="assets/sfx/whoosh-soft.wav" data-start="1.1" data-duration="0.55" data-track-index="20" data-volume="0.28"></audio>
      <audio id="sfx-02" src="assets/sfx/whoosh-soft.wav" data-start="7.15" data-duration="0.55" data-track-index="20" data-volume="0.22"></audio>
      <audio id="sfx-03" src="assets/sfx/riser.wav" data-start="11.05" data-duration="1.4" data-track-index="21" data-volume="0.22"></audio>
      <audio id="sfx-04" src="assets/sfx/whoosh.wav" data-start="12.32" data-duration="0.32" data-track-index="20" data-volume="0.3"></audio>
      <audio id="sfx-05" src="assets/sfx/bowl.wav" data-start="12.84" data-duration="3.2" data-track-index="22" data-volume="0.42"></audio>
      <audio id="sfx-06" src="assets/sfx/whoosh-soft.wav" data-start="15.7" data-duration="0.55" data-track-index="20" data-volume="0.2"></audio>
      <audio id="sfx-07" src="assets/sfx/bowl-high.wav" data-start="19.52" data-duration="0.68" data-track-index="23" data-volume="0.35"></audio>
    </div>

    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);

        // ---------- transcript (local Whisper small word timestamps; accents / "integramos" fixed) ----------
        const W = [
          ["¿Sabías", 0.22, 0.62], ["que", 0.62, 0.84], ["tu", 0.84, 1.2], ["respiración", 1.2, 2.06], ["puede", 2.06, 2.42], ["influir", 2.42, 2.88],
          ["en", 2.88, 3.24], ["cómo", 3.24, 3.66], ["responde", 3.66, 3.94], ["tu", 3.94, 4.38], ["sistema", 4.38, 4.64], ["nervioso?", 4.64, 5.04],
          ["Este", 5.36, 5.9], ["24", 5.9, 6.2], ["de", 6.2, 6.36], ["octubre", 6.36, 6.9], ["en", 6.9, 7.08], ["el", 7.08, 7.26], ["Hotel", 7.26, 7.64],
          ["Sonesta,", 7.64, 8.2], ["en", 8.28, 8.4], ["la", 8.4, 8.68], ["ciudad", 8.68, 8.88], ["de", 8.88, 9.1], ["Pereira,", 9.1, 9.36],
          ["queremos", 9.72, 10.08], ["llevar", 10.08, 10.56], ["esta", 10.56, 11.08], ["experiencia", 11.08, 11.74], ["mucho", 11.74, 11.96], ["más", 11.96, 12.24], ["allá.", 12.24, 12.5],
          ["En", 12.6, 12.84], ["silencio", 12.84, 13.44], ["para", 13.44, 13.74], ["escuchar", 13.74, 14.06], ["la", 14.06, 14.32], ["vida,", 14.32, 14.6],
          ["integramos", 14.86, 15.8], ["neurociencia", 15.8, 16.8], ["aplicada.", 16.8, 17.24], ["Respiración", 17.76, 18.8], ["consciente.", 18.8, 19.28], ["¡Sonido!", 19.52, 20.12],
        ];
        // caption groups: [first, last, top(px), keyword indices, hero {index: font-size}]
        const CAPS = [
          [0, 2, 1400, []],
          [3, 3, 1360, [], { 3: 130 }],
          [4, 7, 1400, [5]],
          [8, 11, 1380, [10, 11]],
          [12, 15, 1400, [13, 14, 15]],
          [16, 19, 1400, [18, 19]],
          [20, 24, 1400, [24]],
          [25, 27, 1400, [26]],
          [28, 31, 1360, [28], { 31: 118 }],
        ];
        const ENDS = { 8: 12.45 }; // last spoken group before the lockup clears for the ribbon

        const caps = $("#caps");
        const groups = CAPS.map(([a, b, top, kws, hero = {}], gi) => {
          const cap = document.createElement("div");
          cap.className = "cap";
          cap.id = "cap-" + gi;
          cap.style.top = top + "px";
          const inner = document.createElement("div");
          inner.className = "inner";
          for (let k = a; k <= b; k++) {
            const s = document.createElement("span");
            s.className = "cw" + (kws.includes(k) ? " kw" : "") + (k in hero ? " hero" : "");
            s.id = "cw-" + k;
            s.textContent = W[k][0];
            if (k in hero) s.style.fontSize = hero[k] + "px";
            inner.appendChild(s);
          }
          cap.appendChild(inner);
          caps.appendChild(cap);
          return { cap, a, b, gi };
        });
        // "más allá." reads as one hero line
        $("#cw-30").classList.add("hero");
        $("#cw-30").style.fontSize = "118px";
        $("#cw-30").style.flexBasis = "auto";
        $("#cw-31").style.flexBasis = "auto";

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        gsap.set([".cap", "#lock", "#pillars", "#pill", "#arrow"], { autoAlpha: 0 });
        gsap.set(".cw", { opacity: 0 });
        gsap.set("#pill", { xPercent: -50 });
        // the pill is laid out full width; the venue half is revealed with a clip mask
        const pillW = $("#pill").offsetWidth, dateW = $("#pi-date").offsetWidth + 5;
        const hidden = pillW - dateW;
        gsap.set("#pill", { x: hidden / 2, clipPath: `inset(0px ${hidden}px 0px 0px round 78px)` });
        gsap.set("#pi-loc", { opacity: 0 });
        gsap.set("#pdiv", { scaleY: 0 });
        gsap.set("#ribbon", { xPercent: -115, rotation: -24, transformOrigin: "50% 50%" });
        gsap.set(".pl", { autoAlpha: 0 });
        gsap.set("#arr-head", { opacity: 0 });

        // ---- captions: words rise softly out of a blur; accent words bloom in ----
        groups.forEach(({ cap, a, b, gi }) => {
          const s = W[a][1] - 0.06;
          const e = ENDS[gi] ?? (gi + 1 < groups.length ? W[groups[gi + 1].a][1] - 0.06 : 20.2);
          tl.set(cap, { autoAlpha: 1 }, s);
          for (let k = a; k <= b; k++) {
            const el = $("#cw-" + k);
            if (el.classList.contains("hero"))
              tl.fromTo(el, { opacity: 0, scale: 1.25, y: 18, filter: "blur(12px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, W[k][1]);
            else if (el.classList.contains("kw"))
              tl.fromTo(el, { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, W[k][1]);
            else tl.fromTo(el, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, W[k][1]);
          }
          tl.to(cap, { opacity: 0, y: -10, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, Math.max(s + 0.3, e - 0.16)).set(cap, { autoAlpha: 0 }, e);
        });

        // ---- "respiración": light waves breathe across ----
        tl.to("#wv-3", { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "power2.inOut" }, 1.1)
          .to("#wv-1", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut" }, 1.2)
          .to("#wv-2", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut" }, 1.35)
          .fromTo("#waves", { y: 0, scaleY: 1 }, { y: -14, scaleY: 1.18, transformOrigin: "50% 50%", duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.6)
          .to(["#wv-1", "#wv-2", "#wv-3"], { attr: { "stroke-dashoffset": -1 }, duration: 0.9, ease: "power2.in" }, 4.5);

        // ---- event pill: date, then it widens to add the venue; Pereira inks in ----
        tl.set("#pill", { autoAlpha: 1 }, 5.84)
          .fromTo("#pill", { y: -60, scale: 0.7, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 5.86)
          .to("#pdiv", { scaleY: 1, duration: 0.3, ease: "power2.out" }, 7.2)
          .to("#pill", { x: 0, clipPath: "inset(0px 0px 0px 0px round 78px)", duration: 0.6, ease: "expo.out" }, 7.24)
          .to("#pi-loc", { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.3)
          .fromTo("#pereira", { opacity: 0.25 }, { opacity: 1, duration: 0.3 }, 9.1)
          .set("#arrow", { autoAlpha: 1 }, 7.7)
          .fromTo("#arrow", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" }, 7.7)
          .to("#arr-head", { opacity: 1, duration: 0.15 }, 8.25)
          .to("#arrow", { opacity: 0, duration: 0.3 }, 9.3)
          .to("#pill", { y: -60, opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power3.in" }, 9.55)
          .set(["#pill", "#arrow"], { autoAlpha: 0 }, 9.95);

        // ---- ribbon sweep into the brand lockup ----
        tl.to("#ribbon", { xPercent: 115, duration: 0.55, ease: "power3.inOut" }, 12.3);

        // ---- "En Silencio para escuchar la vida": lockup card, word by word ----
        tl.set("#lock", { autoAlpha: 1 }, 12.5)
          .fromTo("#lock", { scale: 0.85, y: 60, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 12.5)

          .fromTo("#l-vida", { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 14.06)
          .fromTo(["#sp-1", "#sp-3"], { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)", stagger: 0.12 }, 13.0)
          .fromTo("#sp-2", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, 14.32)
          .to(".spark", { rotation: 45, duration: 1.2, ease: "sine.inOut" }, 14.4)

          .set("#lock", { autoAlpha: 0 }, 15.05);

        // ---- three pillars build as they are named ----
        tl.set("#pillars", { autoAlpha: 1 }, 14.82)
          .fromTo("#p-label", { opacity: 0, x: -40, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 14.86);
        [15.8, 17.76, 19.52].forEach((t, i) => {
          tl.set(`#pl-${i}`, { autoAlpha: 1 }, t - 0.02)
            .fromTo(`#pl-${i}`, { x: -700, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, t - 0.02)
            .fromTo(`#pl-${i} .ic`, { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, t + 0.12);
        });

        window.__timelines["main"] = tl;
        tl.seek(0);
