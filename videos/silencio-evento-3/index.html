<!doctype html>
<html lang="es" data-mode="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Silencio para escuchar la vida — parte 3</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair";
        src: url("assets/fonts/playfair-display-latin-wght-normal.woff2") format("woff2");
        font-weight: 400 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Playfair";
        src: url("assets/fonts/playfair-display-latin-wght-italic.woff2") format("woff2");
        font-weight: 400 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Poppins";
        src: url("assets/fonts/poppins-latin-500-italic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
      }

      /* brand: Silencio para escuchar la vida */
      :root {
        --violet: #3b1f6e;
        --violet-2: #4b2a85;
        --ink: #2b1052;
        --lilac: #b9a3e3;
        --lilac-2: #e8defa;
        --glow: #c58bff;
        --gold: #e6b35a;
        --gold-2: #f7d58b;
        --cream: #f8f1e7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #cam {
        display: none;
      }
      #cam {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- captions (series system) ---------- */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
      }
      .inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 18px;
        text-align: center;
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 60px;
        line-height: 1.3;
        color: #ffffff;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
      }
      .cw.kw {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 72px;
        color: var(--gold-2);
      }
      .cw.hero {
        flex-basis: 100%;
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 800;
        color: var(--gold-2);
        line-height: 1.05;
        -webkit-text-stroke: 16px var(--ink);
      }

      /* ---------- pillars ---------- */
      #pillars {
        position: absolute;
        left: 80px;
        top: 1080px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }
      #p-label {
        font-family: "Poppins", sans-serif;
        font-style: italic;
        font-weight: 500;
        font-size: 50px;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;
        margin-left: 12px;
      }
      .pl {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 124px;
        padding: 0 44px 0 18px;
        border-radius: 62px;
        background: var(--cream);
        border: 4px solid var(--gold);
      }
      .pl .ic {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: var(--violet);
        display: grid;
        place-items: center;
        flex: none;
      }
      .pl .ic svg {
        width: 56px;
        height: 56px;
      }
      .pl .t {
        font-family: "Playfair", serif;
        font-size: 58px;
        color: var(--violet);
        white-space: nowrap;
      }
      .pl .t b {
        font-weight: 700;
      }
      .pl .t i {
        font-weight: 500;
      }

      /* ---------- calm waves ---------- */
      .waves {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 300px;
        overflow: visible;
      }

      /* ---------- event pill (poster) ---------- */
      .epill {
        position: absolute;
        left: 50%;
        height: 156px;
        display: flex;
        align-items: center;
        border-radius: 78px;
        background: var(--cream);
        border: 5px solid var(--gold);
        white-space: nowrap;
      }
      .pi {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 40px;
        height: 100%;
      }
      .pi svg {
        width: 64px;
        height: 64px;
        flex: none;
      }
      .pi .t {
        font-family: "Playfair", serif;
        font-weight: 600;
        font-size: 44px;
        line-height: 1.08;
        color: var(--violet);
      }
      .pi .t i {
        font-style: italic;
        font-weight: 500;
      }
      .pdiv {
        width: 4px;
        height: 90px;
        border-radius: 2px;
        background: var(--lilac);
        flex: none;
      }

      /* ---------- CTA button ---------- */
      .cta {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 22px;
        height: 132px;
        padding: 0 60px 0 30px;
        border-radius: 66px;
        background: linear-gradient(180deg, #5a35a0 0%, #3b1f6e 100%);
        border: 5px solid var(--gold);
        white-space: nowrap;
      }
      .cta .dot {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--gold);
        display: grid;
        place-items: center;
      }
      .cta .dot svg {
        width: 44px;
        height: 44px;
      }
      .cta span {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 62px;
        color: #fff;
      }

      /* ---------- end card ---------- */
      #endcard {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 38%, #fbf6ee 0%, #f3ebf6 55%, #e3d6f3 100%);
        overflow: hidden;
      }
      #e-lock {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .lw {
        display: block;
        font-family: "Playfair", serif;
        color: var(--violet-2);
      }
      #e-sil {
        font-weight: 800;
        font-size: 200px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--violet);
      }
      #e-para {
        font-style: italic;
        font-weight: 500;
        font-size: 64px;
        line-height: 1.1;
      }
      #e-esc,
      #e-vida {
        font-style: italic;
        font-weight: 600;
        font-size: 118px;
        line-height: 1.02;
      }
      .spark {
        position: absolute;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18.0"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="16.41" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="voice" src="assets/footage.mp4" data-start="0" data-duration="16.41" data-track-index="10" data-volume="1"></audio>

      <div id="stage" class="clip" data-start="0" data-duration="18.0" data-track-index="1">
        <!-- calm waves for "la calma" -->
        <svg id="waves" class="waves" style="top: 1080px" viewBox="0 0 1080 300" aria-hidden="true">
          <path class="wv" d="M-40 150 C 120 40, 260 40, 400 150 S 680 260, 820 150 S 1040 40, 1120 120" fill="none" stroke="#c58bff" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
          <path class="wv" d="M-40 190 C 140 100, 280 110, 420 190 S 700 280, 840 190 S 1040 100, 1120 160" fill="none" stroke="#e8defa" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
          <path class="wv" d="M-40 110 C 100 20, 250 10, 380 110 S 660 220, 800 110 S 1040 10, 1120 80" fill="none" stroke="#b9a3e3" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        </svg>

        <!-- pillars: sonido · cuencos alquímicos · respiración consciente -->
        <div id="pillars">
          <span id="p-label">con</span>
          <div class="pl" id="pl-0">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M10 28 V28 M18 20 V36 M26 12 V44 M34 18 V38 M42 24 V32" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="t"><b>Sonido</b></span>
          </div>
          <div class="pl" id="pl-1">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M8 26 H48 C48 36 40 44 28 44 C16 44 8 36 8 26 Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" />
                <path d="M20 18 C20 14 24 14 24 10 M30 18 C30 14 34 14 34 10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
              </svg>
            </span>
            <span class="t"><b>Cuencos</b> <i>alquímicos</i></span>
          </div>
          <div class="pl" id="pl-2">
            <span class="ic">
              <svg viewBox="0 0 56 56" aria-hidden="true">
                <path d="M6 22 C14 14 22 14 30 22 S 44 30 50 22 M6 34 C14 26 22 26 30 34 S 44 42 50 34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
              </svg>
            </span>
            <span class="t"><b>Respiración</b> <i>consciente</i></span>
          </div>
        </div>

        <div id="caps"></div>

        <!-- event pill: 24 de octubre | Hotel Sonesta, Pereira -->
        <div id="pill" class="epill" style="top: 230px">
          <div class="pi" id="pi-date">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="8" y="12" width="48" height="44" rx="8" fill="none" stroke="#3b1f6e" stroke-width="4" />
              <path d="M8 26 H56 M20 6 V16 M44 6 V16" stroke="#3b1f6e" stroke-width="4" stroke-linecap="round" />
            </svg>
            <div class="t">24 de<br /><i>octubre</i></div>
          </div>
          <div class="pdiv" id="pdiv"></div>
          <div class="pi" id="pi-loc">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 58 C32 58 12 38 12 24 C12 13 21 6 32 6 C43 6 52 13 52 24 C52 38 32 58 32 58 Z" fill="none" stroke="#3b1f6e" stroke-width="4" stroke-linejoin="round" />
              <circle cx="32" cy="24" r="7" fill="none" stroke="#3b1f6e" stroke-width="4" />
            </svg>
            <div class="t">Hotel Sonesta,<br /><i>Pereira</i></div>
          </div>
        </div>

        <!-- CTA over camera -->
        <div id="cta" class="cta" style="top: 1560px">
          <span class="dot">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <path d="M8 16 H36 M12 6 V12 M32 6 V12 M8 10 H36 V38 H8 Z M15 26 L20 31 L30 21" fill="none" stroke="#3b1f6e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>Reserva tu lugar</span>
        </div>

        <!-- end card: holds the brand after the footage ends -->
        <div id="endcard">
          <svg class="waves" style="top: 1560px" viewBox="0 0 1080 300" aria-hidden="true">
            <path class="ewv" d="M-40 150 C 120 40, 260 40, 400 150 S 680 260, 820 150 S 1040 40, 1120 120" fill="none" stroke="#c58bff" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
            <path class="ewv" d="M-40 190 C 140 100, 280 110, 420 190 S 700 280, 840 190 S 1040 100, 1120 160" fill="none" stroke="#b9a3e3" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
          </svg>
          <div id="e-lock">
            <span class="lw" id="e-sil">Silencio</span>
            <span class="lw" id="e-para">para</span>
            <span class="lw" id="e-esc">escuchar</span>
            <span class="lw" id="e-vida">la vida.</span>
          </div>
          <svg class="spark" id="sp-1" style="left: 860px; top: 400px; width: 70px; height: 70px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#e6b35a" /></svg>
          <svg class="spark" id="sp-2" style="left: 150px; top: 450px; width: 40px; height: 40px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#b9a3e3" /></svg>
          <svg class="spark" id="sp-3" style="left: 800px; top: 900px; width: 50px; height: 50px" viewBox="-32 -32 64 64" aria-hidden="true"><path d="M0 -30 C4 -4 4 -4 30 0 C4 4 4 4 0 30 C-4 4 -4 4 -30 0 C-4 -4 -4 -4 0 -30 Z" fill="#e6b35a" /></svg>
          <div id="e-pill" class="epill" style="top: 1110px">
            <div class="pi">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <rect x="8" y="12" width="48" height="44" rx="8" fill="none" stroke="#3b1f6e" stroke-width="4" />
                <path d="M8 26 H56 M20 6 V16 M44 6 V16" stroke="#3b1f6e" stroke-width="4" stroke-linecap="round" />
              </svg>
              <div class="t">24 de<br /><i>octubre</i></div>
            </div>
            <div class="pdiv"></div>
            <div class="pi">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 58 C32 58 12 38 12 24 C12 13 21 6 32 6 C43 6 52 13 52 24 C52 38 32 58 32 58 Z" fill="none" stroke="#3b1f6e" stroke-width="4" stroke-linejoin="round" />
                <circle cx="32" cy="24" r="7" fill="none" stroke="#3b1f6e" stroke-width="4" />
              </svg>
              <div class="t">Hotel Sonesta,<br /><i>Pereira</i></div>
            </div>
          </div>
          <div id="e-cta" class="cta" style="top: 1340px">
            <span class="dot">
              <svg viewBox="0 0 44 44" aria-hidden="true">
                <path d="M8 16 H36 M12 6 V12 M32 6 V12 M8 10 H36 V38 H8 Z M15 26 L20 31 L30 21" fill="none" stroke="#3b1f6e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span>Reserva tu lugar</span>
          </div>
        </div>
      </div>

      <!-- ============ SFX: few and soft (tools/make_sfx.py) ============ -->
      <audio id="sfx-01" src="assets/sfx/bowl.wav" data-start="4.64" data-duration="2.4" data-track-index="22" data-volume="0.36"></audio>
      <audio id="sfx-02" src="assets/sfx/whoosh-soft.wav" data-start="7.66" data-duration="0.55" data-track-index="20" data-volume="0.22"></audio>
      <audio id="sfx-03" src="assets/sfx/whoosh-soft.wav" data-start="11.36" data-duration="0.55" data-track-index="20" data-volume="0.2"></audio>
      <audio id="sfx-04" src="assets/sfx/riser.wav" data-start="14.95" data-duration="1.4" data-track-index="21" data-volume="0.18"></audio>
      <audio id="sfx-05" src="assets/sfx/whoosh.wav" data-start="16.25" data-duration="0.32" data-track-index="20" data-volume="0.28"></audio>
      <audio id="sfx-06" src="assets/sfx/bowl-high.wav" data-start="16.5" data-duration="1.5" data-track-index="23" data-volume="0.32"></audio>
    </div>

    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);

        // ---------- transcript (local Whisper small, merged windows; spelling fixed) ----------
        const W = [
          ["quien", 0.18, 0.38], ["nos", 0.38, 0.54], ["guiará", 0.54, 1.24], ["en", 1.24, 1.6], ["técnicas", 1.6, 2.18], ["para", 2.18, 2.46],
          ["liberar", 2.46, 2.88], ["tensión", 2.88, 3.3], ["y", 3.3, 3.52], ["llevarte", 3.52, 4.0], ["de", 4.0, 4.14], ["nuevo", 4.14, 4.3], ["a", 4.3, 4.4],
          ["la", 4.4, 4.64], ["calma.", 4.64, 5.0], ["Una", 5.08, 5.64], ["experiencia", 5.64, 5.88], ["de", 5.88, 6.16], ["inmersión", 6.16, 7.04], ["total", 7.04, 7.42],
          ["con", 7.42, 7.72], ["sonido,", 7.72, 8.2], ["cuencos", 8.22, 8.76], ["alquímicos", 8.76, 9.5], ["y", 9.58, 9.92], ["respiración", 9.92, 10.66], ["consciente.", 10.66, 11.3],
          ["24", 11.42, 11.78], ["de", 11.78, 11.92], ["octubre,", 11.92, 12.6], ["Hotel", 12.7, 13.1], ["Sonesta,", 13.1, 13.62], ["Pereira.", 13.62, 14.1],
          ["Conoce", 14.16, 14.56], ["la", 14.56, 14.92], ["experiencia", 14.92, 15.44], ["y", 15.44, 15.78], ["reserva", 15.78, 16.08], ["tu", 16.08, 16.32], ["lugar.", 16.32, 16.41],
        ];
        // captions: [first, last, top(px), keyword indices, hero {index: font-size}] — 20-26 are the pillars
        const CAPS = [
          [0, 3, 1400, [2]],
          [4, 7, 1380, [4, 6, 7]],
          [8, 12, 1400, [11]],
          [13, 14, 1360, [], { 14: 140 }],
          [15, 19, 1330, [], { 18: 116, 19: 116 }],
          [27, 29, 1380, [27, 28, 29]],
          [30, 32, 1380, [30, 31, 32]],
          [33, 35, 1300, [35]],
          [36, 39, 1300, [37, 38, 39]],
        ];
        const ENDS = { 4: 7.4, 8: 16.3 };

        const caps = $("#caps");
        const groups = CAPS.map(([a, b, top, kws, hero = {}], gi) => {
          const cap = document.createElement("div");
          cap.className = "cap";
          cap.id = "cap-" + gi;
          cap.style.top = top + "px";
          const inner = document.createElement("div");
          inner.className = "inner";
          for (let k = a; k <= b; k++) {
            const s = document.createElement("span");
            s.className = "cw" + (kws.includes(k) ? " kw" : "") + (k in hero ? " hero" : "");
            s.id = "cw-" + k;
            s.textContent = W[k][0];
            if (k in hero) s.style.fontSize = hero[k] + "px";
            inner.appendChild(s);
          }
          cap.appendChild(inner);
          caps.appendChild(cap);
          return { cap, a, b, gi };
        });
        ["#cw-18", "#cw-19"].forEach((id) => ($(id).style.flexBasis = "auto"));

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        gsap.set([".cap", "#pillars", "#pill", "#cta", "#endcard"], { autoAlpha: 0 });
        gsap.set(".cw", { opacity: 0 });
        gsap.set([".epill", ".cta"], { xPercent: -50 });
        gsap.set(".pl", { autoAlpha: 0 });
        // the venue half of the pill is revealed with a clip mask
        const pillW = $("#pill").offsetWidth, dateW = $("#pi-date").offsetWidth + 5;
        const hidden = pillW - dateW;
        gsap.set("#pill", { x: hidden / 2, clipPath: `inset(0px ${hidden}px 0px 0px round 78px)` });
        gsap.set("#pi-loc", { opacity: 0 });
        gsap.set("#pdiv", { scaleY: 0 });

        // ---- captions ----
        groups.forEach(({ cap, a, b, gi }) => {
          const s = W[a][1] - 0.06;
          const e = ENDS[gi] ?? (gi + 1 < groups.length ? W[groups[gi + 1].a][1] - 0.06 : 16.3);
          tl.set(cap, { autoAlpha: 1 }, s);
          for (let k = a; k <= b; k++) {
            const el = $("#cw-" + k);
            if (el.classList.contains("hero"))
              tl.fromTo(el, { opacity: 0, scale: 1.25, y: 18, filter: "blur(12px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, W[k][1]);
            else if (el.classList.contains("kw"))
              tl.fromTo(el, { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, W[k][1]);
            else tl.fromTo(el, { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, W[k][1]);
          }
          tl.to(cap, { opacity: 0, y: -10, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, Math.max(s + 0.3, e - 0.16)).set(cap, { autoAlpha: 0 }, e);
        });

        // ---- "la calma": light waves breathe in ----
        tl.to("#waves .wv", { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut", stagger: 0.12 }, 4.3)
          .fromTo("#waves", { y: 0, scaleY: 1 }, { y: -14, scaleY: 1.18, transformOrigin: "50% 50%", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.9)
          .to("#waves .wv", { attr: { "stroke-dashoffset": -1 }, duration: 0.8, ease: "power2.in" }, 6.7);

        // ---- pillars: con sonido · cuencos alquímicos · respiración consciente ----
