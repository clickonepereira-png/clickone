<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sumando semanas — motion vertical 9:16</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      :root {
        --white: #ffffff;
        --blue: #1f4fff;
        --navy: #0b1f66;
        --sky: #7d9bff;
        --mist: #e3eaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--white);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--white);
        font-family: "Montserrat", sans-serif;
        color: var(--navy);
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      .mask {
        display: block;
        overflow: hidden;
        padding: 0 16px;
        margin: 0 -16px;
      }
      .mask > span {
        display: block;
      }
      .layer {
        position: absolute;
        left: 90px;
        right: 90px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---------- headline ---------- */
      #head {
        top: 300px;
      }
      #sum-row {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #plus-badge {
        flex: none;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: var(--blue);
        display: grid;
        place-items: center;
      }
      #plus-badge svg {
        width: 40px;
        height: 40px;
      }
      #sumando {
        font-family: "Inter", sans-serif;
        font-weight: 800;
        font-size: 68px;
        letter-spacing: 0.2em;
        color: var(--blue);
      }
      #semanas {
        font-weight: 900;
        font-size: 164px;
        line-height: 1.05;
        letter-spacing: -0.045em;
        color: var(--blue);
        margin-top: 8px;
      }

      #tail {
        top: 650px;
      }
      #paratu {
        font-weight: 300;
        font-style: italic;
        font-size: 104px;
        line-height: 1.1;
        color: var(--navy);
      }
      #pension {
        font-weight: 900;
        font-size: 176px;
        line-height: 1.08;
        letter-spacing: -0.045em;
        color: var(--navy);
      }
      #pen-bar {
        width: 520px;
        height: 18px;
        border-radius: 9px;
        background: var(--blue);
        margin-top: 12px;
      }

      /* ---------- stacking weeks ---------- */
      .blk {
        position: absolute;
        width: 110px;
        height: 60px;
        border-radius: 14px;
      }
      #base {
        position: absolute;
        left: 110px;
        top: 1576px;
        width: 860px;
        height: 10px;
        border-radius: 5px;
        background: var(--navy);
      }
      .plus {
        position: absolute;
        width: 70px;
        text-align: center;
        font-weight: 900;
        font-size: 64px;
        line-height: 1;
        color: var(--blue);
      }
      #trend {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .spark {
        position: absolute;
        width: 44px;
        height: 44px;
      }

      /* ---------- accents ---------- */
      #acc-dots {
        position: absolute;
        left: 820px;
        top: 200px;
        width: 170px;
        height: 90px;
      }
      #acc-ring {
        position: absolute;
        left: 100px;
        top: 190px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 10px solid var(--blue);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <svg id="acc-dots" viewBox="0 0 170 90" aria-hidden="true">
          <g fill="#7d9bff">
            <circle cx="10" cy="10" r="8" /><circle cx="60" cy="10" r="8" /><circle cx="110" cy="10" r="8" /><circle cx="160" cy="10" r="8" />
            <circle cx="10" cy="60" r="8" /><circle cx="60" cy="60" r="8" /><circle cx="110" cy="60" r="8" /><circle cx="160" cy="60" r="8" />
          </g>
        </svg>
        <div id="acc-ring"></div>

        <!-- stacking weeks (blocks, "+" marks and sparks are generated below) -->
        <div id="chart"></div>
        <div id="base"></div>
        <svg id="trend" viewBox="0 0 1080 1920" aria-hidden="true">
          <polyline
            id="trend-line"
            points="175,1462 321,1392 467,1322 613,1252 759,1182 905,1112 975,1078"
            fill="none"
            stroke="#1f4fff"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
            pathLength="1"
            stroke-dasharray="1 1"
            stroke-dashoffset="1"
          />
          <g id="trend-head" transform="translate(975 1078) rotate(-25.6)">
            <path id="trend-tip" d="M-40 -26 L2 0 L-40 26" fill="none" stroke="#1f4fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>

        <!-- headline -->
        <div id="head" class="layer">
          <div id="sum-row">
            <div id="plus-badge">
              <svg viewBox="0 0 40 40" aria-hidden="true">
                <path d="M20 5 V35 M5 20 H35" stroke="#fff" stroke-width="8" stroke-linecap="round" />
              </svg>
            </div>
            <div class="mask"><span id="sumando">SUMANDO</span></div>
          </div>
          <div class="mask"><span id="semanas">SEMANAS</span></div>
        </div>
        <div id="tail" class="layer">
          <div class="mask"><span id="paratu">para tu</span></div>
          <div class="mask"><span id="pension">PENSIÓN</span></div>
          <div id="pen-bar"></div>
        </div>
      </div>

      <!-- ============ SFX (synthesized: tools/make_sfx.py) ============ -->
      <audio id="sfx-01" src="assets/sfx/whoosh.wav" data-start="0" data-duration="0.32" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-02" src="assets/sfx/pop-high.wav" data-start="0.08" data-duration="0.07" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-03" src="assets/sfx/click.wav" data-start="0.14" data-duration="0.03" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-04" src="assets/sfx/impact.wav" data-start="0.42" data-duration="0.4" data-track-index="13" data-volume="0.75"></audio>
      <audio id="sfx-05" src="assets/sfx/riser.wav" data-start="0.62" data-duration="1.4" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-06" src="assets/sfx/pop-up-1.wav" data-start="0.7" data-duration="0.1" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-07" src="assets/sfx/pop-up-2.wav" data-start="0.82" data-duration="0.1" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-08" src="assets/sfx/pop-up-3.wav" data-start="1" data-duration="0.1" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-09" src="assets/sfx/pop-up-4.wav" data-start="1.24" data-duration="0.1" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-10" src="assets/sfx/pop-up-5.wav" data-start="1.54" data-duration="0.1" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-11" src="assets/sfx/pop-up-6.wav" data-start="1.9" data-duration="0.1" data-track-index="15" data-volume="0.85"></audio>
      <audio id="sfx-12" src="assets/sfx/whoosh-fast.wav" data-start="1.95" data-duration="0.22" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-13" src="assets/sfx/click.wav" data-start="2.3" data-duration="0.03" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-14" src="assets/sfx/impact.wav" data-start="2.55" data-duration="0.4" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-15" src="assets/sfx/confirm.wav" data-start="3.05" data-duration="0.5" data-track-index="16" data-volume="0.7"></audio>
    </div>

    <script>
      // ---------- build the week blocks (deterministic) ----------
      const chart = document.getElementById("chart");
      const COLS = 6, X0 = 120, STEP = 146, BASE = 1570, ROW = 70;
      const shades = ["#e3eaff", "#c3d1ff", "#a3b8ff", "#7d9bff", "#4e75ff", "#1f4fff"];
      const blocks = [];
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= c; r++) {
          const b = document.createElement("div");
          b.className = "blk";
          b.style.left = X0 + c * STEP + "px";
          b.style.top = BASE - (r + 1) * ROW + "px";
          b.style.background = shades[c];
          chart.appendChild(b);
          blocks.push(b);
        }
        const p = document.createElement("div");
        p.className = "plus";
        p.id = "plus-" + c;
        p.textContent = "+";
        p.style.left = X0 + c * STEP + 20 + "px";
        p.style.top = BASE - (c + 1) * ROW - 90 + "px";
        chart.appendChild(p);
      }
      // rising sparks for the final hold (fixed positions)
      const SPARKS = [[140, 1700], [300, 1780], [470, 1720], [640, 1800], [820, 1740], [930, 1680], [220, 1840], [560, 1860]];
      SPARKS.forEach(([x, y], i) => {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("viewBox", "0 0 44 44");
        s.setAttribute("class", "spark");
        s.id = "spark-" + i;
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.innerHTML = '<path d="M22 6 V38 M6 22 H38" stroke="' + (i % 2 ? "#7d9bff" : "#1f4fff") + '" stroke-width="8" stroke-linecap="round"/>';
        chart.appendChild(s);
      });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
      gsap.set("#head", { y: 460 });
      gsap.set(".plus", { opacity: 0 });
      gsap.set(".spark", { opacity: 0 });
      gsap.set("#trend-tip", { scale: 0, transformOrigin: "100% 50%" });

      // ---------- 0.0 – 0.7  SUMANDO → SEMANAS ----------
      tl.fromTo("#plus-badge", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.6)" }, 0.06)
        .fromTo("#sumando", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 0.12)
        .fromTo("#semanas", { scale: 0.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.4)
        .fromTo("#acc-ring", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.2)
        .fromTo("#acc-dots", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.5 }, 0.25)
        .fromTo("#base", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5 }, 0.45);

      // ---------- 0.7 – 1.95  weeks stack up, headline is pushed upward ----------
      blocks.forEach((b, k) => {
        tl.fromTo(b, { y: -260, scaleY: 1.4, opacity: 0 }, { y: 0, scaleY: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.7 + k * 0.06);
      });
      [0.7, 0.82, 1.0, 1.24, 1.54, 1.9].forEach((t, c) => {
        tl.fromTo(`#plus-${c}`, { y: 30, opacity: 0, scale: 0.4 }, { y: -20, opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, t)
          .to(`#plus-${c}`, { y: -110, opacity: 0, duration: 0.4, ease: "power2.in" }, t + 0.24)
          .to("#plus-badge", { scale: 1.15, duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      });
      tl.to("#head", { y: 0, duration: 1.3, ease: "power2.inOut" }, 0.68)
        .to("#semanas", { scale: 0.94, duration: 1.05, ease: "power2.inOut" }, 0.92);

      // ---------- 1.9 – 2.4  trend arrow draws up ----------
      tl.to("#trend-line", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 1.9)
        .to("#trend-tip", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.28)
        .to("#chart", { y: -24, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.95);

      // ---------- 2.3 – 3.0  para tu PENSIÓN ----------
      tl.fromTo("#paratu", { yPercent: 110 }, { yPercent: 0, duration: 0.4 }, 2.3)
        .fromTo("#pension", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 2.55)
        .fromTo("#tail", { y: 0 }, { y: 12, duration: 0.05, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.6)
        .fromTo("#pen-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45 }, 2.75);

      // ---------- 3.0 – 4.0  keep climbing ----------
      tl.to("#trend-head", { x: 12, y: -6, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out" }, 3.05)
        .to("#pension", { scale: 1.05, duration: 0.95, ease: "sine.inOut" }, 3.05)
        .to("#head", { y: -30, duration: 1.0, ease: "sine.inOut" }, 3.0);
      SPARKS.forEach((_, i) => {
        const t = 2.4 + i * 0.16;
        tl.fromTo(`#spark-${i}`, { y: 0, opacity: 0, rotation: 0, scale: 0.5 }, { y: -420, opacity: 1, rotation: 90, scale: 1, duration: 0.5, ease: "power2.out" }, t)
          .to(`#spark-${i}`, { opacity: 0, duration: 0.3, ease: "power1.in" }, t + 0.5);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
