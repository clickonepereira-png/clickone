      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);

        // ---------- static builds (deterministic) ----------
        // split display words into letters
        document.querySelectorAll(".split").forEach((el) => {
          const t = el.textContent;
          el.textContent = "";
          for (const c of t) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c === " " ? " " : c;
            el.appendChild(s);
          }
        });
        // barcode
        const BARS = [3, 1, 2, 1, 4, 1, 1, 3, 2, 1, 1, 2, 3, 1, 2, 4, 1, 1, 2, 1, 3, 2, 1, 1, 3, 1, 2, 1, 1, 4, 2, 1, 3, 1];
        let bx = 0;
        BARS.forEach((w, i) => {
          if (i % 2 === 0) {
            const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            r.setAttribute("x", bx * 2.2);
            r.setAttribute("y", 0);
            r.setAttribute("width", w * 2.2);
            r.setAttribute("height", 54);
            $("#bars").appendChild(r);
          }
          bx += w;
        });
        // document rows (text-like bars)
        for (let i = 0; i < 8; i++) {
          const y = 164 + i * 52;
          const g = $("#doc-rows");
          [[44, 150 - (i % 3) * 22, "#d5dcec"], [300, 90, "#c3cde6"], [420, 96 - (i % 2) * 20, "#a9b8e0"]].forEach(([x, w, f]) => {
            const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            r.setAttribute("x", x);
            r.setAttribute("y", y);
            r.setAttribute("width", w);
            r.setAttribute("height", 16);
            r.setAttribute("rx", 8);
            r.setAttribute("fill", f);
            g.appendChild(r);
          });
        }
        // calendar cards for B3 (staircase)
        const ON = [5, 2, 9, 6, 11];
        for (let i = 0; i < 5; i++) {
          const c = document.createElement("div");
          c.className = "ccard shadow";
          c.id = "card-" + i;
          c.style.left = 110 + i * 166 + "px";
          c.style.top = 1430 - i * 62 + "px";
          let days = "";
          for (let d = 0; d < 12; d++) days += '<span class="d' + (d <= ON[i] ? " on" : "") + '"></span>';
          c.innerHTML = '<div class="hd"></div><div class="days">' + days + "</div>";
          $("#cards").appendChild(c);
          const p = document.createElement("div");
          p.className = "cplus";
          p.id = "cplus-" + i;
          p.textContent = "+";
          p.style.left = 110 + i * 166 + 60 + "px";
          p.style.top = 1430 - i * 62 - 110 + "px";
          $("#cards").appendChild(p);
        }

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        const GHOST = "#c5cde2";
        // reference move: words land light grey, then ink in
        const ink = (sel, t, color, step = 0.12) => {
          document.querySelectorAll(sel + " .rw").forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, y: 26, color: GHOST }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + i * step)
              .to(w, { color, duration: 0.25, ease: "power1.out" }, t + i * step + 0.14);
          });
        };
        const letters = (sel, t, from, stagger = 0.035, dur = 0.42, ease = "expo.out") =>
          tl.fromTo(sel + " .ch", from, { yPercent: 0, xPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: dur, stagger, ease }, t);

        gsap.set(["#b2", "#b3", "#b4"], { autoAlpha: 0 });
        gsap.set("#bluebg", { yPercent: 100 });
        gsap.set(".cplus", { opacity: 0 });
        gsap.set("#mag", { transformOrigin: "37.5% 37.5%" });

        // =============== B1 · REVISA / en tu / EXTRACTO LABORAL ===============
        tl.fromTo("#barcode", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5 }, 0)
          .fromTo("#grid1", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.8, ease: "expo.inOut" }, 0.05);
        letters("#revisa", 0.08, { yPercent: 110 });
        ink("#entu", 0.45, "#0b1f66");
        letters("#extracto", 0.62, { yPercent: 110 }, 0.03);
        letters("#laboral", 0.78, { yPercent: 110 }, 0.03);
        tl.fromTo("#blk1", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5 }, 0.7)
          .fromTo("#doc", { y: 1000, rotation: 20 }, { y: 0, rotation: -6, duration: 0.65, ease: "back.out(1.3)" }, 0.8)
          .fromTo("#mag", { x: 620, y: 380, rotation: 40 }, { x: 0, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.4)" }, 1.28)
          .fromTo("#doc-hl", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4 }, 1.62)
          .to("#mag", { x: -40, y: -16, duration: 0.3, ease: "sine.inOut" }, 1.85);

        // zoom-blur exit (reference transition)
        tl.to("#b1", { scale: 1.14, opacity: 0, filter: "blur(18px)", duration: 0.32, ease: "power2.in" }, 2.02)
          .set("#b1", { autoAlpha: 0 }, 2.36);

        // =============== B2 · cuántas SEMANAS tienes cotizadas a la fecha ===============
        tl.set("#b2", { autoAlpha: 1 }, 2.28)
          .fromTo("#b2", { scale: 0.92, filter: "blur(18px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 2.28);
        ink("#cuantas2", 2.32, "#0b1f66");
        letters("#semanas2", 2.5, { scale: 1.8, opacity: 0, filter: "blur(10px)" }, 0.045, 0.45);
        // magnifier glides across the textured word
        tl.to("#mag", { x: -590, y: -540, rotation: -10, duration: 0.45, ease: "power3.inOut" }, 2.1)
          .to("#mag", { x: 20, y: -520, rotation: 8, duration: 1.0, ease: "sine.inOut" }, 2.72);
        ink("#tienes", 3.05, "#0b1f66", 0.15);
        ink("#fecha", 3.5, "#1f4fff", 0.1);
        tl.fromTo("#fecha-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45 }, 3.72)
          .fromTo("#grid2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "expo.inOut" }, 3.6)
          .fromTo("#blk2", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45 }, 3.85)
          .to("#mag", { x: 150, y: 240, rotation: 18, duration: 0.5, ease: "back.out(1.4)" }, 3.85);
        // whip exit
        tl.to("#b2", { y: -300, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 4.45)
          .to("#mag", { x: 900, y: 0, rotation: 60, duration: 0.32, ease: "power3.in" }, 4.45)
          .set("#b2", { autoAlpha: 0 }, 4.8);

        // =============== B3 · y cuántas SEMANAS PODRÁS SUMAR desde ahora ===============
        tl.set("#b3", { autoAlpha: 1 }, 4.74);
        ink("#ycuantas", 4.8, "#0b1f66");
        letters("#semanas3", 4.95, { yPercent: 110 }, 0.03);
        letters("#podras", 5.15, { yPercent: 110 }, 0.04);
        letters("#sumar", 5.35, { yPercent: 110 }, 0.04);
        tl.fromTo("#grid3", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "expo.inOut" }, 5.3);
        for (let i = 0; i < 5; i++) {
          const t = 5.55 + i * 0.15;
          tl.fromTo(`#card-${i}`, { y: 520, rotation: i % 2 ? 14 : -14, opacity: 0 }, { y: 0, rotation: i % 2 ? 4 : -4, opacity: 1, duration: 0.42, ease: "back.out(1.8)" }, t)
            .fromTo(`#cplus-${i}`, { y: 30, opacity: 0, scale: 0.4 }, { y: -10, opacity: 1, scale: 1, duration: 0.22, ease: "back.out(3)" }, t + 0.1)
            .to(`#cplus-${i}`, { y: -70, opacity: 0, duration: 0.45, ease: "power2.in" }, t + 0.34);
        }
        ink("#desde", 6.3, "#0b1f66");
        tl.to("#cards", { y: -30, duration: 0.7, ease: "sine.inOut" }, 6.3);

        // vector wipe to the blue scene
        tl.to("#bluebg", { yPercent: -8, duration: 0.45, ease: "power3.inOut" }, 6.98)
          .to("#b3", { y: -220, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 7.0)
          .set("#b3", { autoAlpha: 0 }, 7.45)
          .to("#bars", { attr: { fill: "#ffffff" }, duration: 0.3 }, 7.2);

        // =============== B4 · hasta el 31 DE MARZO DE 2027 ===============
        tl.set("#b4", { autoAlpha: 1 }, 7.35);
        ink("#hasta", 7.45, "#ffffff");
        tl.fromTo("#cal", { y: -1100, rotation: -22 }, { y: 0, rotation: -4, duration: 0.6, ease: "back.out(1.5)" }, 7.6);
        const day = { v: 1 };
        tl.fromTo(day, { v: 1 }, {
          v: 31,
          duration: 0.8,
          ease: "power2.in",
          onUpdate: () => ($("#cal-num").textContent = Math.round(day.v)),
        }, 7.95)
          .to("#cal", { scale: 1.08, rotation: 3, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 8.78);
        letters("#fecha4a", 8.85, { yPercent: 110 }, 0.03);
        letters("#fecha4b", 9.08, { yPercent: 110 }, 0.035);
        tl.fromTo("#b4-bar", { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.45 }, 9.35)
          .to("#cal", { y: -16, rotation: -2, duration: 0.6, ease: "sine.inOut" }, 9.4);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
