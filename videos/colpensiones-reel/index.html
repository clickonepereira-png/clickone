<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Colpensiones o fondo privado — reel editado</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-wght-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      :root {
        --white: #ffffff;
        --blue: #1f4fff;
        --navy: #0b1f66;
        --sky: #7d9bff;
        --mist: #e3eaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }

      /* ---------- footage: the camera wrapper carries every zoom ---------- */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 53% 27%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #leak {
        position: absolute;
        right: -360px;
        top: -360px;
        width: 1100px;
        height: 1100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 248, 235, 0.22) 38%, rgba(255, 255, 255, 0) 70%);
      }

      /* ---------- captions (reference: thin, soft shadow, keywords bold-italic + drawn underline) ---------- */
      .cap {
        position: absolute;
        left: 70px;
        right: 70px;
        display: flex;
        justify-content: center;
      }
      .inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 16px;
        text-align: center;
      }
      .inner.pill {
        background: rgba(11, 31, 102, 0.9);
        border-radius: 30px;
        padding: 12px 36px 18px;
        box-shadow: 0 18px 40px rgba(11, 31, 102, 0.35);
      }
      .cw {
        position: relative;
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
        font-size: 62px;
        line-height: 1.28;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(11, 31, 102, 0.8), 0 0 26px rgba(11, 31, 102, 0.65), 0 0 60px rgba(11, 31, 102, 0.35);
        white-space: nowrap;
      }
      .cap.dark .cw {
        color: var(--navy);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.85);
      }
      .cw.kw {
        font-weight: 700;
        font-style: italic;
      }
      .cw .ul {
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 4px;
        height: 6px;
        border-radius: 3px;
        background: currentColor;
        box-shadow: 0 2px 6px rgba(11, 31, 102, 0.4);
      }
      .cw.hero {
        flex-basis: 100%;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.02em;
        line-height: 1.02;
      }

      /* ---------- data chip (reference: navy glass pill + dot + underlined label) ---------- */
      .chip {
        position: absolute;
        left: 90px;
        top: 1470px;
        display: flex;
        align-items: center;
        gap: 22px;
        height: 96px;
        padding: 0 42px 0 16px;
        border-radius: 48px;
        background: rgba(11, 31, 102, 0.78);
        box-shadow: 0 16px 36px rgba(11, 31, 102, 0.35);
      }
      .chip .dot {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.25);
      }
      .chip .lbl {
        position: relative;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 46px;
        color: #fff;
        white-space: nowrap;
      }
      .chip .lbl .ul {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -6px;
        height: 4px;
        border-radius: 2px;
        background: #fff;
      }
      .streak {
        position: absolute;
        left: 0;
        top: 1478px;
        width: 760px;
        height: 80px;
        border-radius: 40px;
        background: rgba(31, 79, 255, 0.7);
        filter: blur(14px);
      }

      /* ---------- full-screen graphic cutaways (house style) ---------- */
      .cut {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f8f9fd 55%, #e8edf8 100%);
        overflow: hidden;
      }
      .barcode {
        position: absolute;
        left: 450px;
        top: 130px;
        width: 180px;
        height: 54px;
      }
      .grid {
        position: absolute;
        background-image: linear-gradient(to right, rgba(31, 79, 255, 0.16) 2px, transparent 2px),
          linear-gradient(to bottom, rgba(31, 79, 255, 0.16) 2px, transparent 2px);
        background-size: 56px 56px;
      }
      .shadow {
        filter: drop-shadow(0 30px 34px rgba(11, 31, 102, 0.24)) drop-shadow(0 5px 8px rgba(11, 31, 102, 0.12));
      }
      .layer {
        position: absolute;
        left: 110px;
        right: 110px;
        display: flex;
        flex-direction: column;
      }
      .line {
        display: block;
        overflow: hidden;
        padding: 0 10px;
        margin: 0 -10px;
      }
      .disp {
        font-family: "Anton", sans-serif;
        text-transform: uppercase;
        line-height: 1.12;
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
      }
      .sans {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 74px;
        line-height: 1.25;
        white-space: nowrap;
      }
      .rw {
        display: inline-block;
        margin-right: 0.24em;
      }
      .mcard {
        position: absolute;
        top: 910px;
        width: 390px;
        height: 460px;
        border-radius: 34px;
        background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%);
        overflow: hidden;
      }
      .mcard .hd {
        height: 84px;
        line-height: 84px;
        text-align: center;
        font-size: 52px;
        color: #fff;
      }
      .mcard svg {
        position: absolute;
        left: 75px;
        top: 150px;
        width: 240px;
        height: 220px;
      }
      #a-div {
        position: absolute;
        left: 537px;
        top: 930px;
        width: 6px;
        height: 420px;
        background: repeating-linear-gradient(to bottom, #9fb0db 0 16px, transparent 16px 28px);
      }
      #wash {
        position: absolute;
        inset: 0;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.15"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="20.15" data-track-index="0" muted playsinline></video>
      </div>
      <audio id="voice" src="assets/footage.mp4" data-start="0" data-duration="20.15" data-track-index="10" data-volume="1"></audio>

      <div id="stage" class="clip" data-start="0" data-duration="20.15" data-track-index="1">
        <div id="leak"></div>
        <div id="caps"></div>

        <div id="chip-a" class="chip"><span class="dot"></span><span class="lbl">Colpensiones<span class="ul"></span></span></div>
        <div id="streak-a" class="streak"></div>
        <div id="chip-b" class="chip"><span class="dot"></span><span class="lbl">Fondo privado<span class="ul"></span></span></div>
        <div id="streak-b" class="streak"></div>

        <!-- ============ cutaway A · Antes eran dos modelos independientes, en Colpensiones ============ -->
        <div id="cutA" class="cut">
          <svg class="barcode" viewBox="0 0 180 54" aria-hidden="true"><g class="bars" fill="#0b1f66"></g></svg>
          <div class="layer" style="top: 300px; align-items: flex-start">
            <span class="line"><span id="a-antes" class="sans words"><span class="rw">antes</span><span class="rw">eran</span></span></span>
            <span class="line"><span id="a-dos" class="disp split" style="font-size: 168px; color: #0b1f66">dos modelos</span></span>
            <span class="line"><span id="a-ind" class="disp split" style="font-size: 136px; color: #1f4fff">independientes</span></span>
          </div>
          <div id="a-div"></div>
          <div id="a-cardL" class="mcard shadow" style="left: 110px">
            <div class="hd disp" style="background: #1f4fff">Colpensiones</div>
            <svg viewBox="0 0 240 220" aria-hidden="true">
              <path d="M120 10 L228 66 H12 Z" fill="#1f4fff" />
              <rect x="34" y="78" width="22" height="96" rx="6" fill="#1f4fff" />
              <rect x="84" y="78" width="22" height="96" rx="6" fill="#1f4fff" />
              <rect x="134" y="78" width="22" height="96" rx="6" fill="#1f4fff" />
              <rect x="184" y="78" width="22" height="96" rx="6" fill="#1f4fff" />
              <rect x="12" y="184" width="216" height="26" rx="8" fill="#0b1f66" />
            </svg>
          </div>
          <div id="a-cardR" class="mcard shadow" style="left: 580px">
            <div class="hd disp" style="background: #0b1f66">Fondo privado</div>
            <svg viewBox="0 0 240 220" aria-hidden="true">
              <ellipse cx="120" cy="120" rx="96" ry="72" fill="#0b1f66" />
              <circle cx="66" cy="60" r="22" fill="#0b1f66" />
              <rect x="206" y="102" width="28" height="36" rx="10" fill="#0b1f66" />
              <rect x="62" y="176" width="26" height="36" rx="8" fill="#0b1f66" />
              <rect x="152" y="176" width="26" height="36" rx="8" fill="#0b1f66" />
              <rect x="94" y="54" width="52" height="12" rx="6" fill="#7d9bff" />
              <circle cx="168" cy="104" r="8" fill="#fff" />
            </svg>
          </div>
        </div>

        <!-- ============ cutaway B · En los fondos privados tu dinero entraba ============ -->
        <div id="cutB" class="cut">
          <svg class="barcode" viewBox="0 0 180 54" aria-hidden="true"><g class="bars" fill="#0b1f66"></g></svg>
          <div class="layer" style="top: 290px; align-items: flex-start">
            <span class="line"><span id="b-enlos" class="sans words"><span class="rw">en</span><span class="rw">los</span></span></span>
            <span class="line"><span id="b-fondos" class="disp split" style="font-size: 224px; color: #1f4fff">fondos</span></span>
            <span class="line"><span id="b-priv" class="disp split" style="font-size: 224px; color: #0b1f66">privados</span></span>
          </div>
          <div id="b-grid" class="grid" style="left: 170px; top: 960px; width: 740px; height: 440px"></div>
          <svg id="b-piggy" class="shadow" style="position: absolute; left: 310px; top: 1000px; width: 460px; height: 345px; overflow: visible" viewBox="0 0 200 150" aria-hidden="true">
            <ellipse cx="100" cy="84" rx="78" ry="56" fill="#1f4fff" />
            <circle cx="56" cy="36" r="18" fill="#1f4fff" />
            <rect x="170" y="70" width="24" height="30" rx="9" fill="#1f4fff" />
            <rect x="50" y="124" width="22" height="26" rx="6" fill="#1f4fff" />
            <rect x="128" y="124" width="22" height="26" rx="6" fill="#1f4fff" />
            <rect x="78" y="34" width="44" height="10" rx="5" fill="#0b1f66" />
            <circle cx="140" cy="70" r="7" fill="#fff" />
          </svg>
          <svg class="b-coin" id="b-coin-1" style="position: absolute; left: 505px; top: 780px; width: 76px; height: 76px" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#7d9bff" stroke="#0b1f66" stroke-width="4" /><path d="M23 11 V35 M29 16 C23 12 15 14 17 21 C19 27 30 23 29 30 C28 35 20 36 15 31" fill="none" stroke="#0b1f66" stroke-width="3.5" stroke-linecap="round" /></svg>
          <svg class="b-coin" id="b-coin-2" style="position: absolute; left: 505px; top: 780px; width: 76px; height: 76px" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#7d9bff" stroke="#0b1f66" stroke-width="4" /><path d="M23 11 V35 M29 16 C23 12 15 14 17 21 C19 27 30 23 29 30 C28 35 20 36 15 31" fill="none" stroke="#0b1f66" stroke-width="3.5" stroke-linecap="round" /></svg>
          <svg class="b-coin" id="b-coin-3" style="position: absolute; left: 505px; top: 780px; width: 76px; height: 76px" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#7d9bff" stroke="#0b1f66" stroke-width="4" /><path d="M23 11 V35 M29 16 C23 12 15 14 17 21 C19 27 30 23 29 30 C28 35 20 36 15 31" fill="none" stroke="#0b1f66" stroke-width="3.5" stroke-linecap="round" /></svg>
          <div class="layer" style="top: 1420px; align-items: center">
            <span class="line"
              ><span id="b-dinero" style="display: flex; align-items: baseline; gap: 22px"
                ><span class="sans rw2" id="b-tu">tu</span><span class="disp" id="b-din" style="font-size: 150px; color: #1f4fff">dinero</span
                ><span class="sans rw2" id="b-ent">entraba</span></span
              ></span
            >
          </div>
        </div>

        <div id="wash"></div>
      </div>
    </div>

    <script>
      document.fonts.ready.then(() => {
        const $ = (s) => document.querySelector(s);

        // ---------- transcript (local Whisper small word timestamps; proper nouns / punctuation fixed) ----------
        const W = [
          ["¿En", 0.12, 0.3], ["Colpensiones", 0.3, 0.88], ["o", 0.88, 1.14], ["fondo", 1.14, 1.38], ["privado?", 1.38, 1.7],
          ["si", 1.8, 2.0], ["aún", 2.0, 2.4], ["tienes", 2.4, 2.66], ["dudas", 2.66, 2.98],
          ["de", 2.98, 3.22], ["cómo", 3.22, 3.44], ["cambió", 3.44, 3.58], ["el", 3.58, 3.92], ["sistema", 3.92, 4.16],
          ["te", 4.16, 4.4], ["explico", 4.4, 4.56],
          ["con", 4.74, 4.86], ["la", 4.86, 4.98], ["nueva", 4.98, 5.24], ["normativa.", 5.24, 5.68],
          ["Antes", 5.96, 6.32], ["eran", 6.32, 6.58], ["dos", 6.58, 6.8], ["modelos", 6.8, 7.28], ["independientes,", 7.28, 7.9],
          ["en", 7.98, 8.1], ["Colpensiones,", 8.2, 8.94],
          ["tus", 8.98, 9.16], ["aportes", 9.16, 9.72], ["iban", 9.72, 9.88],
          ["a", 9.88, 10.04], ["un", 10.04, 10.32], ["fondo", 10.32, 10.74], ["público", 10.74, 11.22], ["común", 11.22, 11.46],
          ["y", 11.46, 11.58], ["la", 11.58, 11.8], ["pensión", 11.8, 12.1], ["se", 12.1, 12.38], ["calculaba", 12.38, 12.66],
          ["por", 12.98, 13.28], ["semanas.", 13.28, 13.72],
          ["En", 13.84, 13.98], ["los", 13.98, 14.28], ["fondos", 14.28, 14.66], ["privados", 14.66, 15.18],
          ["tu", 15.18, 15.44], ["dinero", 15.44, 15.78], ["entraba", 15.78, 16.24],
          ["a", 16.24, 16.42], ["una", 16.42, 16.8], ["cuenta", 16.8, 17.02],
          ["de", 17.02, 17.24], ["ahorro", 17.24, 17.84], ["individual", 17.84, 18.08],
          ["que", 18.08, 18.42], ["generaba", 18.42, 18.88], ["rendimientos.", 18.88, 19.64],
        ];
        // caption groups on camera: [first, last, top(px), style, keyword indices, hero {index: font-size}]
        const CAPS = [
          [0, 1, 1290, "", [1]],
          [2, 4, 1290, "", [3, 4]],
          [5, 8, 1300, "pill", [8]],
          [9, 13, 190, "dark", [11, 13]],
          [14, 15, 1290, "", [15]],
          [16, 19, 170, "dark", [18], { 19: 132 }],
          [27, 29, 1290, "", [28]],
          [30, 34, 1260, "", [32, 33, 34]],
          [35, 39, 190, "dark", [37]],
          [40, 41, 1200, "", [], { 41: 156 }],
          [49, 51, 1290, "", [51]],
          [52, 54, 1300, "pill", [53, 54]],
          [55, 57, 1230, "pill", [], { 57: 104 }],
        ];
        // a group ends where the next one starts, or where a cutaway takes over
        const CUTS = [[5.86, 9.0], [13.78, 16.22]];
        const END = 20.1;

        const caps = $("#caps");
        const groups = CAPS.map(([a, b, top, style, kws, hero = {}], gi) => {
          const cap = document.createElement("div");
          cap.className = "cap" + (style === "dark" ? " dark" : "");
          cap.id = "cap-" + gi;
          cap.style.top = top + "px";
          const inner = document.createElement("div");
          inner.className = "inner" + (style === "pill" ? " pill" : "");
          for (let k = a; k <= b; k++) {
            const s = document.createElement("span");
            const isHero = k in hero;
            s.className = "cw" + (kws.includes(k) ? " kw" : "") + (isHero ? " hero" : "");
            s.id = "cw-" + k;
            s.textContent = W[k][0];
            if (isHero) s.style.fontSize = hero[k] + "px";
            if (kws.includes(k)) {
              const u = document.createElement("span");
              u.className = "ul";
              u.id = "ul-" + k;
              s.appendChild(u);
            }
            inner.appendChild(s);
          }
          cap.appendChild(inner);
          caps.appendChild(cap);
          return { cap, inner, a, b, style };
        });

        // cutaway helpers (same build as the house motion graphics)
        document.querySelectorAll(".split").forEach((el) => {
          const t = el.textContent;
          el.textContent = "";
          for (const c of t) {
            const s = document.createElement("span");
            s.className = "ch";
            s.textContent = c === " " ? " " : c;
            el.appendChild(s);
          }
        });
        const BARS = [3, 1, 2, 1, 4, 1, 1, 3, 2, 1, 1, 2, 3, 1, 2, 4, 1, 1, 2, 1, 3, 2, 1, 1, 3, 1, 2, 1, 1, 4, 2, 1, 3, 1];
        document.querySelectorAll(".bars").forEach((g) => {
          let bx = 0;
          BARS.forEach((w, i) => {
            if (i % 2 === 0) {
              const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              r.setAttribute("x", bx * 2.2);
              r.setAttribute("y", 0);
              r.setAttribute("width", w * 2.2);
              r.setAttribute("height", 54);
              g.appendChild(r);
            }
            bx += w;
          });
        });

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
        const GHOST = "#8390b3";
        const ink = (sel, t, color, step = 0.12) => {
          document.querySelectorAll(sel + " .rw").forEach((w, i) => {
            tl.fromTo(w, { opacity: 0, y: 26, color: GHOST }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + i * step)
              .to(w, { color, duration: 0.25, ease: "power1.out" }, t + i * step + 0.14);
          });
        };
        const letters = (sel, t, from, stagger = 0.03, dur = 0.42) =>
          tl.fromTo(sel + " .ch", from, { yPercent: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: dur, stagger, ease: "expo.out" }, t);

        gsap.set([".cap", "#cutA", "#cutB", ".chip", ".streak"], { autoAlpha: 0 });
        gsap.set(".cw", { opacity: 0 });
        gsap.set(".cw .ul, .chip .ul", { scaleX: 0, transformOrigin: "0% 50%" });
        gsap.set("#wash", { opacity: 0 });
        gsap.set(".b-coin", { opacity: 0 });

        // ---- soft light leak drifting (finite) ----
        tl.fromTo("#leak", { opacity: 0.55, x: 0, y: 0 }, { opacity: 0.9, x: -60, y: 40, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

        // ---- captions: each word fades up out of a blur; keywords draw their underline; hero words bloom ----
        const nextStart = (gi) => {
          const e = gi + 1 < groups.length ? W[groups[gi + 1].a][1] - 0.06 : END;
          const cut = CUTS.find(([c0]) => c0 > W[groups[gi].b][1] - 0.01 && c0 < e);
          return cut ? cut[0] - 0.05 : e;
        };
        groups.forEach(({ cap, inner, a, b, style }, gi) => {
          const s = W[a][1] - 0.06;
          const e = nextStart(gi);
          tl.set(cap, { autoAlpha: 1 }, s);
          if (style === "pill") tl.fromTo(inner, { scaleX: 0.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "back.out(1.8)" }, s);
          for (let k = a; k <= b; k++) {
            const el = "#cw-" + k;
            if (document.querySelector(el).classList.contains("hero"))
              tl.fromTo(el, { opacity: 0, scale: 1.35, scaleX: 1.6, filter: "blur(16px)" }, { opacity: 1, scale: 1, scaleX: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, W[k][1]);
            else tl.fromTo(el, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, W[k][1]);
            if (document.querySelector("#ul-" + k)) tl.to("#ul-" + k, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, W[k][1] + 0.12);
          }
          tl.to(cap, { opacity: 0, filter: "blur(10px)", duration: 0.14, ease: "power2.in" }, Math.max(s + 0.3, e - 0.14)).set(cap, { autoAlpha: 0 }, e);
        });

        // ---- data chips: blurred streak sweeps, the pill slides in, label underline draws ----
        const chip = (id, t0, t1) => {
          tl.set([`#streak-${id}`, `#chip-${id}`], { autoAlpha: 1 }, t0)
            .fromTo(`#streak-${id}`, { x: -800, opacity: 0.9 }, { x: 400, opacity: 0, duration: 0.45, ease: "power2.out" }, t0)
            .fromTo(`#chip-${id}`, { x: -620, filter: "blur(12px)" }, { x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t0 + 0.05)
            .fromTo(`#chip-${id} .dot`, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, t0 + 0.2)
            .to(`#chip-${id} .ul`, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, t0 + 0.35)
            .to(`#chip-${id}`, { x: -620, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, t1 - 0.3)
            .set([`#chip-${id}`, `#streak-${id}`], { autoAlpha: 0 }, t1);
        };
        chip("a", 9.1, 13.7);
        chip("b", 16.4, 20.1);

        // ---- camera: opening punch-out, punch-ins on beats, punch back after each cutaway ----
        tl.fromTo("#cam", { scale: 1.12 }, { scale: 1.0, duration: 1.0, ease: "expo.out" }, 0)
          .to("#cam", { scale: 1.12, duration: 0.2, ease: "power3.out" }, 4.16)
          .set("#cam", { scale: 1.22 }, 9.0)
          .to("#cam", { scale: 1.06, duration: 0.7, ease: "expo.out" }, 9.0)
          .to("#cam", { scale: 1.15, duration: 0.2, ease: "power3.out" }, 12.38)
          .set("#cam", { scale: 1.22 }, 16.22)
          .to("#cam", { scale: 1.08, duration: 0.7, ease: "expo.out" }, 16.22)
          .to("#cam", { scale: 1.2, duration: 1.2, ease: "sine.inOut" }, 18.88);

        // ---- white-wash transitions into / out of the cutaways (reference) ----
        const washIn = (t, cut) =>
          tl.to("#wash", { opacity: 1, duration: 0.18, ease: "power2.in" }, t - 0.18).set(cut, { autoAlpha: 1 }, t).to("#wash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        const washOut = (t, cut) =>
          tl.to("#wash", { opacity: 1, duration: 0.16, ease: "power2.in" }, t - 0.16).set(cut, { autoAlpha: 0 }, t).to("#wash", { opacity: 0, duration: 0.32, ease: "power2.out" }, t);

        // =========== cutaway A (5.86 – 9.00) ===========
        washIn(5.86, "#cutA");
        ink("#a-antes", 5.96, "#0b1f66", 0.36);
        letters("#a-dos", 6.58, { yPercent: 110 }, 0.03);
        letters("#a-ind", 7.28, { scale: 1.8, opacity: 0, filter: "blur(10px)" }, 0.03, 0.45);
        tl.fromTo(["#a-cardL", "#a-cardR"], { y: 700, rotation: (i) => (i ? 10 : -10) }, { y: 0, rotation: (i) => (i ? 3 : -3), duration: 0.55, ease: "back.out(1.4)", stagger: 0.08 }, 6.7)
          // "independientes": the two models pull apart, divider draws
          .fromTo("#a-cardL", { x: 120 }, { x: -20, duration: 0.45, ease: "back.out(1.8)" }, 7.28)
          .fromTo("#a-cardR", { x: -120 }, { x: 20, duration: 0.45, ease: "back.out(1.8)" }, 7.28)
          .fromTo("#a-div", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 7.4)
          // "en Colpensiones": the public model takes the focus
          .to("#a-cardL", { scale: 1.08, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 8.2)
          .to("#a-cardR", { opacity: 0.35, scale: 0.94, duration: 0.35, ease: "power2.out" }, 8.2);
        washOut(9.0, "#cutA");

        // =========== cutaway B (13.78 – 16.22) ===========
        washIn(13.78, "#cutB");
        ink("#b-enlos", 13.84, "#0b1f66", 0.14);
        letters("#b-fondos", 14.28, { yPercent: 110 }, 0.035);
        letters("#b-priv", 14.66, { yPercent: 110 }, 0.03);
        tl.fromTo("#b-grid", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "expo.inOut" }, 14.1)
          .fromTo("#b-piggy", { scale: 0.3, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 14.5)
          .fromTo("#b-tu", { opacity: 0, y: 26, color: GHOST }, { opacity: 1, y: 0, color: "#0b1f66", duration: 0.3 }, 15.18)
          .fromTo("#b-din", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 15.44)
          .fromTo("#b-ent", { opacity: 0, y: 26, color: GHOST }, { opacity: 1, y: 0, color: "#0b1f66", duration: 0.3 }, 15.78);
        [0, 1, 2].forEach((i) => {
          tl.fromTo(`#b-coin-${i + 1}`, { y: -120, opacity: 0, rotation: -40 }, { y: 250, opacity: 1, rotation: 0, duration: 0.32, ease: "power2.in" }, 15.44 + i * 0.16)
            .to(`#b-coin-${i + 1}`, { scale: 0.2, opacity: 0, duration: 0.1 }, 15.76 + i * 0.16);
        });
        tl.to("#b-piggy", { scale: 1.06, duration: 0.1, yoyo: true, repeat: 3, ease: "power2.out" }, 15.76);
        washOut(16.22, "#cutB");

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
