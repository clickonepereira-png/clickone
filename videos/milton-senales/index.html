          ["M", 111.5, 112.15, [], ["¡comente!", 111.6, 1], null, "pop"],
        ];
        const caps = $("#caps");
        G.forEach(([who, a, b, lead, big, tail, anim]) => {
          const g = document.createElement("div");
          g.className = "cg " + who;
          const sm = document.createElement("div");
          sm.className = "sm";
          const leadEls = lead.map(([w, t]) => {
            const s = document.createElement("span");
            s.textContent = w;
            sm.appendChild(s);
            return [s, t];
          });
          g.appendChild(sm);
          let bg = null;
          let tn = null;
          if (big) {
            bg = document.createElement("div");
            bg.className = "bg" + (big[2] ? " hot" : "");
            // long keywords shrink so they always fit on one line
            if (big[0].length > 11) bg.style.fontSize = Math.round(Math.min(124, 1500 / big[0].length)) + "px";
            if (anim === "type") {
              [...big[0]].forEach((ch) => {
                const c = document.createElement("span");
                c.className = "c";
                c.textContent = ch === " " ? " " : ch;
                bg.appendChild(c);
              });
            } else bg.textContent = big[0];
            g.appendChild(bg);
          }
          if (tail) {
            tn = document.createElement("div");
            tn.className = "tn";
            tn.textContent = tail[0];
            g.appendChild(tn);
          }
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          leadEls.forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, Math.max(a, t)));
          if (bg) {
            const t = Math.max(a, big[1]);
            if (anim === "pop") tl.fromTo(bg, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.8)" }, t);
            else if (anim === "flip") tl.fromTo(bg, { rotationX: -95, opacity: 0, y: 20 }, { rotationX: 0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, t);
            else if (anim === "slide") tl.fromTo(bg, { yPercent: 70, clipPath: "inset(0 -5% 100% -5%)" }, { yPercent: 0, clipPath: "inset(-15% -5% -15% -5%)", duration: 0.45, ease: "expo.out" }, t);
            else if (anim === "bounce") tl.fromTo(bg, { y: -200, scale: 1.3, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "bounce.out" }, t);
            else if (anim === "type") tl.fromTo(bg.querySelectorAll(".c"), { opacity: 0, y: 30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.035 }, t);
            tl.to(bg, { scale: 1.04, duration: Math.max(0.2, b - t - 0.6), ease: "none" }, t + 0.5);
          }
          if (tn) tl.fromTo(tn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, tail[1]);
          tl.set(g, { visibility: "hidden" }, b);
        });

        // ---------- camera: comedic punch-ins on the reactions ----------
        // [t, scale, origin, hold]
        const P = [
          [9.72, 1.15, "50% 35%", 1.0], [19.82, 1.15, "50% 35%", 1.1], [24.5, 1.2, "50% 35%", 0.9], [27.04, 1.1, "50% 35%", 1.0],
          [46.34, 1.12, "50% 40%", 1.2], [60.6, 1.15, "50% 40%", 1.0], [73.18, 1.12, "50% 40%", 1.4], [97.8, 1.15, "50% 35%", 0.9], [110.74, 1.1, "50% 30%", 1.2],
        ];
        P.forEach(([t, s, o, hold]) => {
          tl.set("#zoom", { transformOrigin: o }, t)
            .fromTo("#zoom", { scale: 1 }, { scale: s, duration: 0.18, ease: "power4.out" }, t)
            .to("#zoom", { scale: s + 0.04, duration: hold - 0.4, ease: "none" }, t + 0.18)
            .to("#zoom", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + hold - 0.2);
        });

        const show = (id, a, b) => {
          tl.set(id, { visibility: "visible" }, a);
          tl.set(id, { visibility: "hidden" }, b);
        };
        const pop = (sel, t, from = { scale: 0 }, d = 0.45, ease = "back.out(2.6)") =>
          tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, scale: 1, x: 0, y: 0, rotation: 0, duration: d, ease }, t);
        const slam = (sel, t, rot = -8) => {
          tl.fromTo(sel, { scale: 3, opacity: 0, rotation: rot - 10 }, { scale: 1, opacity: 1, rotation: rot, duration: 0.25, ease: "power4.in" }, t);
          tl.fromTo(sel, { y: 0 }, { y: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, t + 0.25);
        };

        // ===== plate blur (0 – 6.5): two patches, re-cut every frame =====
        const K = 1080 / 480, PAD = 10;
        const TRUCK = [[0, 300, 650, 336, 671], [1.0, 298, 651, 334, 671], [1.8, 334, 650, 368, 671], [2.4, 352, 649, 388, 670], [3.0, 363, 648, 398, 669], [3.6, 367, 648, 401, 668], [4.4, 390, 646, 424, 666], [5.0, 395, 646, 431, 666], [5.6, 399, 647, 438, 668], [6.2, 408, 647, 446, 668], [6.5, 412, 647, 450, 668]];
        const CAR = [[0, 444, 622, 480, 644], [2.2, 442, 622, 480, 644]];
        const at = (keys, t) => {
          if (t < keys[0][0] || t > keys[keys.length - 1][0]) return null;
          for (let i = 1; i < keys.length; i++)
            if (t <= keys[i][0]) {
              const a = keys[i - 1], b = keys[i], w = (t - a[0]) / (b[0] - a[0] || 1);
              return [1, 2, 3, 4].map((k) => a[k] + (b[k] - a[k]) * w);
            }
          return keys[keys.length - 1].slice(1);
        };
        const rect = (r) => {
          const [x0, y0, x1, y1] = [r[0] * K - PAD, r[1] * K - PAD, r[2] * K + PAD, r[3] * K + PAD];
          return "M" + x0 + " " + y0 + " H" + x1 + " V" + y1 + " H" + x0 + " Z ";
        };
        tl.set("#plate", { opacity: 1 }, 0);
        for (let f = 0; f <= 195; f++) {
          const t = f / 30, a = at(TRUCK, t), b = at(CAR, t);
          const d = (a ? rect(a) : "") + (b ? rect(b) : "");
          tl.set("#plate", { clipPath: d ? "path('" + d + "')" : "inset(100%)" }, t);
        }
        tl.set("#plate", { opacity: 0 }, 6.55);

        // ===== sign cards: in with a whoosh, "¿qué significa?", then the real meaning =====
        const SG = [["glorieta", 29.65, 38.35, 31.4], ["noparquear", 38.4, 42.45, 39.9], ["pr63", 42.6, 61.6, 60.95], ["angosta", 61.7, 71.0, 63.7], ["giro", 71.2, 78.15, 74.85], ["adelantar", 78.2, 84.0, 83.3], ["peso", 86.0, 92.9, 90.7], ["altura", 93.4, 101.7, 96.6]];
        SG.forEach(([k, a, b, rv]) => {
          const id = "#sg-" + k;
          tl.set(id, { visibility: "visible" }, a);
          tl.fromTo(id + " .pic", { scale: 0, rotation: -25, y: -120 }, { scale: 1, rotation: 0, y: 0, duration: 0.55, ease: "back.out(1.9)" }, a);
          tl.to(id + " .pic", { rotation: 4, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((rv - a - 0.8) / 0.6)), ease: "sine.inOut" }, a + 0.6);
          tl.to(id + " .pic", { rotation: 0, duration: 0.15 }, rv - 0.15);
          tl.fromTo(id + " .pic", { scale: 1.18 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, rv);
          tl.to(id, { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, b - 0.3);
          tl.set(id, { visibility: "hidden" }, b);
        });

        // ===== side glow on every verdict =====



        tl.set({}, {}, 112.15);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
