      }
      * {

        padding: 0;

      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #zoom {
        display: none;
      }
      #zoom,
      #stage,
      #trk {
        position: absolute;
        inset: 0;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #trk {
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .neon {
        fill: none;
        stroke: var(--y);
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px rgba(255, 214, 10, 0.9)) drop-shadow(0 0 18px rgba(255, 214, 10, 0.55));
        opacity: 0;
      }
      .area {
        fill: rgba(255, 214, 10, 0.13);
      }
      .ahead {
        fill: var(--y);
        filter: drop-shadow(0 0 8px rgba(255, 214, 10, 0.8));
        opacity: 0;
      }
      .ring {
        fill: none;
        stroke: var(--y);
        stroke-width: 6;
        filter: drop-shadow(0 0 8px rgba(255, 214, 10, 0.8));
        opacity: 0;
      }

      /* pins and road labels follow tracked points */
      .pin,
      .tag {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
      }
      .pin .in {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 100%;
      }
      /* labels near the frame edge open towards the centre */
      .pin.r .in {
        transform: translate(-52px, -100%);
        align-items: flex-start;
      }
      .pin.l .in {
        transform: translate(calc(-100% + 52px), -100%);
        align-items: flex-end;
      }
      .pin.r .lbl {
        text-align: left;
      }
      .pin.l .lbl {
        text-align: right;
      }

        height: 135px;

        text-transform: uppercase;
        white-space: nowrap;
        color: #fff;
        -webkit-text-stroke: 11px var(--ink);
        paint-order: stroke fill;
        margin-bottom: 8px;
        text-align: center;
        line-height: 1.05;
      }
      .lbl small {
        display: block;
        font-size: 34px;
        letter-spacing: 0.16em;
        -webkit-text-stroke: 8px var(--ink);
      }
      .tag .in {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
      }

      /* captions — reference style, yellow only on the key word */
      .cap {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 1330px;
        text-align: center;
        font-weight: 800;
        font-size: 62px;
        line-height: 1.12;
        text-transform: uppercase;
        color: #fff;
        -webkit-text-stroke: 11px var(--ink);
        paint-order: stroke fill;
        visibility: hidden;
      }
      .cap .w {
        display: inline-block;
        margin: 0 15px;
      }
      .hot {
        color: var(--y);
      }

      /* big condensed words */
      .big {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 700px;
        text-align: center;
        visibility: hidden;
      }
      .big .ld {
        font-weight: 800;
        font-size: 52px;
        text-transform: uppercase;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
        paint-order: stroke fill;

        line-height: 1;

        color: #fff;

      }
      .big .bw.hot {
        color: var(--y);
      }

      #loc {

        left: 0;
        right: 0;
        top: 240px;
        text-align: center;
        opacity: 0;

      #loc .a {

        letter-spacing: 0.2em;

      #loc .b {

      #meter {

        top: 640px;

      #meter .ld {
        font-weight: 800;

        -webkit-text-stroke: 10px var(--ink);

      #meter .num {

      #meter .num span {

      #meter .bar {
        width: 640px;

        display: block;
        height: 100%;
        width: 100%;
        background: var(--y);
        transform-origin: 0 50%;
        box-shadow: 0 0 14px var(--y);
      }

          [58.66, 60.02, "y ven a conocer MoviGym", "MOVIGYM"],
        ];
        const caps = $("#caps");
        C.forEach(([a, b, text, hot]) => {
          const g = document.createElement("div");
          g.className = "cap";
          const words = text.split(" ");
          // multi-word accents ("CALLE 43") light up every word they contain
          const hotSet = new Set(hot.split(" ").filter(Boolean));
          const multi = hot.includes(" ") && text.toUpperCase().includes(hot);
          const ws = words.map((w) => {
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = w;
            const W = w.toUpperCase().replace(/[,.]/g, "");
            if (hotSet.has(W) || (multi && hot.split(" ").includes(W))) s.classList.add("hot");
            g.appendChild(s);
            return s;
          });
          caps.appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          const step = Math.min(0.2, ((b - a) * 0.65) / ws.length);
          ws.forEach((s, i) => tl.fromTo(s, { opacity: 0, scale: 0.6, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(3)" }, a + i * step));
          tl.set(g, { visibility: "hidden" }, b);
        });

        // ---------- big condensed words: [start, end, lead, words, accent] ----------
        const B = [
          [6.95, 8.4, "Llegar es", "MUY FÁCIL", "FÁCIL"],
          [37.15, 38.85, "", "PERO ESPERA", "ESPERA"],
          [46.18, 47.85, "Ya sea que quieras", "GANAR FUERZA", "FUERZA"],
          [47.88, 49.05, "Mejorar tu", "RESISTENCIA", "RESISTENCIA"],
        ];
        B.forEach(([a, b, lead, big, hot], k) => {
          const g = document.createElement("div");
          g.className = "big";
          if (lead) {
            const l = document.createElement("div");
            l.className = "ld";
            l.textContent = lead;
            g.appendChild(l);
            tl.fromTo(l, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, a);
          }
          const tBig = lead ? Math.min(b - 0.9, a + [0.5, 0, 0.74, 0.4][k]) : a;
          big.split(" ").forEach((w, i) => {
            const s = document.createElement("span");
            s.className = "bw" + (w === hot ? " hot" : "");
            s.textContent = w;
            if (w.length > 9) s.style.fontSize = "170px";
            g.appendChild(s);
            tl.fromTo(s, { opacity: 0, scale: 1.8, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "power4.out" }, tBig + i * 0.16);
          });
          $("#stage").appendChild(g);
          tl.set(g, { visibility: "visible" }, a);
          tl.to(g, { scale: 1.06, duration: b - a, ease: "none" }, a);
          tl.set(g, { visibility: "hidden" }, b);
        });

        tl.set({}, {}, 60.02);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
