      /* Cocoa / Silencio line: violet · gold · cream · lilac */
      :root {

        --ink: #2b1052;

        --glow: #c58bff;
        --gold: #e6b35a;
        --gold-2: #f7d58b;
        --cream: #f8f1e7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      html[data-mode="green"],
      html[data-mode="green"] body,
      html[data-mode="green"] #root {
        background: #00b140;
      }
      html[data-mode="green"] #cam,
      html[data-mode="green"] .fullonly {
        display: none;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      .ch {
        display: inline-block;
      }

      /* ---------- base subtitles ---------- */
      .cap {
        position: absolute;
        left: 110px;
        right: 110px;
        top: 1460px;
        display: flex;
        justify-content: center;
      }
      .inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 15px;
        text-align: center;
      }
      .cw {
        display: inline-block;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 54px;
        line-height: 1.25;
        color: #fff;
        -webkit-text-stroke: 11px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
      }
      .cw.kw {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 64px;
        color: var(--gold-2);
      }

      /* ---------- hero words ---------- */
      .hero {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hl {
        display: block;
        white-space: nowrap;
        paint-order: stroke fill;
      }
      .h-big {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 800;
        font-size: 140px;
        line-height: 1.02;
        color: #fff;
        -webkit-text-stroke: 16px var(--ink);
      }
      .h-serif {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 104px;
        line-height: 1.08;
        color: var(--gold-2);
        -webkit-text-stroke: 14px var(--ink);
      }
      .h-small {
        font-family: "Poppins", sans-serif;
        font-style: italic;
        font-weight: 500;
        font-size: 50px;
        line-height: 1.2;
        color: #fff;
        -webkit-text-stroke: 10px var(--ink);
      }
      #heroes .h-small {
        margin-bottom: 18px;
      }
      #heroes .h-big + .h-serif,
      #heroes div + div .h-serif {
        margin-top: 6px;
      }
      .hicon {
        width: 120px;
        height: 120px;
        margin-bottom: 6px;
        overflow: visible;
      }
      .spark {
        position: absolute;
        overflow: visible;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff6e0;
      }

      /* ---------- full-frame cards over the black beats ---------- */
      .dcard {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 44%, #5a35a0 0%, #3b1f6e 42%, #1d0b3d 100%);
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: var(--lilac-2);
      }
      .lock {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .l-sil {
        font-family: "Playfair", serif;
        font-weight: 800;
        line-height: 1;
        color: #fff;
        white-space: nowrap;
      }
      .l-para {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 500;
        color: var(--lilac-2);
      }
      .l-esc {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        color: var(--gold-2);
        line-height: 1.02;
        white-space: nowrap;
      }
      .epill {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        height: 150px;
        border-radius: 75px;
        background: var(--cream);
        border: 5px solid var(--gold);
        white-space: nowrap;
      }
      .pi {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 36px;
        height: 100%;
      }
      .pi svg {
        width: 60px;
        height: 60px;
        flex: none;
      }
      .pi .t {
        font-family: "Playfair", serif;
        font-weight: 600;
        font-size: 42px;
        line-height: 1.08;
        color: var(--violet);
      }
      .pi .t i {
        font-style: italic;
        font-weight: 500;
      }
      .pdiv {
        width: 4px;
        height: 86px;
        border-radius: 2px;
        background: var(--lilac);
        flex: none;
      }
      .cta {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 24px;
        height: 150px;
        padding: 0 64px 0 30px;
        border-radius: 75px;
        background: linear-gradient(180deg, #f7d58b 0%, #e6b35a 100%);
        border: 5px solid #fff3d6;
        white-space: nowrap;
      }
      .cta .dot {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: var(--violet);
        display: grid;
        place-items: center;
      }
      .cta .dot svg {

        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 800;
        font-size: 70px;
        color: var(--ink);
