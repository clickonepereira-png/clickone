        font-family: "Montserrat", sans-serif;

      #footage {

        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        inset: 0;
      }

      /* ---------- base subtitles: small, sentence case, building word by word ---------- */
      .cap {
        position: absolute;
        left: 170px;
        right: 170px;
        top: 1470px;
        display: flex;
        justify-content: center;
      }
      .inner {

        text-align: center;
      }

        font-weight: 600;
        font-size: 50px;
        line-height: 1.22;
        color: #ffffff;
        -webkit-text-stroke: 8px var(--ink);
        paint-order: stroke fill;
        white-space: nowrap;
      }
      .cw.kw {
        color: var(--yellow);
        font-weight: 700;
      }

      /* ---------- hero words: one strong idea at a time ---------- */
      .hero {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hl {
        display: block;
        white-space: nowrap;
        -webkit-text-stroke: 12px var(--ink);
        paint-order: stroke fill;
      }
      .h-big {
        font-weight: 900;
        font-style: italic;
        font-size: 124px;
        line-height: 1;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: #ffffff;
      }
      .h-serif {
        font-family: "Playfair", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 80px;
        line-height: 1.05;
        color: var(--yellow);
        -webkit-text-stroke: 10px var(--ink);
      }
      .h-small {
        font-weight: 800;
        font-style: italic;
        font-size: 52px;
        line-height: 1.1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--yellow);
        -webkit-text-stroke: 9px var(--ink);
      }
      .uline {
        display: block;
        width: 70%;
        height: 12px;
        margin-top: 10px;
        border-radius: 6px;
        background: var(--yellow);
        border: 3px solid var(--ink);
      }
      .hicon {
        width: 96px;
        height: 96px;
        margin-bottom: 8px;
        overflow: visible;
      }

      /* ---------- end card ---------- */
      #endc {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 42%, #16284d 0%, #0b1428 70%);
      }
